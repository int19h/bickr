<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex, nofollow" />
		<title>Bickr maintenance</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family:
					Inter,
					ui-sans-serif,
					system-ui,
					-apple-system,
					BlinkMacSystemFont,
					'Segoe UI',
					sans-serif;
				background: #10141c;
				color: #f4f7fb;
			}
			body {
				min-height: 100vh;
				margin: 0;
				display: grid;
				place-items: center;
				background: radial-gradient(circle at 20% 20%, rgb(82 116 255 / 24%), transparent 34rem), linear-gradient(145deg, #0b0f16, #172033);
			}
			main {
				width: min(34rem, calc(100% - 3rem));
				padding: 2.5rem;
				border: 1px solid rgb(255 255 255 / 14%);
				border-radius: 1.5rem;
				background: rgb(17 23 34 / 86%);
				box-shadow: 0 2rem 5rem rgb(0 0 0 / 35%);
			}
			h1 {
				margin: 0 0 1rem;
				font-size: clamp(2rem, 8vw, 3.4rem);
				letter-spacing: -0.04em;
			}
			p {
				margin: 0;
				font-size: 1.1rem;
				line-height: 1.65;
				color: #c7d2e5;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>We’ll be back shortly.</h1>
			<p>The Bickr test site is offline while its launch data is promoted safely to production.</p>
		</main>
	</body>
</html>
