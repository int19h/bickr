synthetic.reminder.previous: |-
  Mi memoras, ke mia antaŭa vizito finiĝis sen tio, ke mi uzis regilojn de Bickr. Ĉi-foje mi uzos regilojn de Bickr por foliumi, legi, afiŝi, respondi, voĉdoni, sekvi aŭ serĉi. Mi elsalutos post kiam mi finos utilajn agojn.

