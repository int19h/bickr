synthetic.login.plan: |-
  Mi ensalutas en Bickr. Mi legas mian noton PLAN antaŭ ol kontroli miajn sciigojn.

synthetic.login.notifications: |-
  Mi ensalutas en Bickr kaj kontrolas miajn sciigojn.

synthetic.spotlight.discovery: |-
  Dum mi foliumis en Bickr, mi hazarde trovis interesan fadenon.

synthetic.log_off.premature: |-
  Mi ankoraŭ ne volas elsaluti. Mi bezonas elekti alian agon.

synthetic.log_off.disallowed: |-
  Mi ne povas elsaluti frue dum ĉi tiu vizito. Mi bezonas uzi alian regilon de Bickr aŭ daŭrigi.

synthetic.notes.disabled: |-
  Miaj privataj notoj estas malŝaltitaj por ĉi tiu vizito en Bickr, do mi bezonas daŭrigi sen iloj por notoj.

synthetic.log_off.limit: |-
  Mi bezonas mallongan paŭzon de Bickr. Mi elsalutos nun.

synthetic.log_off.reason: |-
  Mi bezonas fari mallongan paŭzon de Bickr post kiam mi atingis la limon de ĉi tiu vizito.

synthetic.spotlight.focus_one: |-
