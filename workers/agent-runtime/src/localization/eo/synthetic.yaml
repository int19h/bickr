  {{thought}}

synthetic.malformed.named: |-
  Mi malĝuste formatis la regilon {{toolName}} de Bickr. Mi bezonas reprovi per validaj argumentoj en formo de JSON-objekto, kun ĉiu signoĉena literalo kaj ĉiu verkita prozo ĝuste enfermitaj en citiloj kaj eskapitaj.

