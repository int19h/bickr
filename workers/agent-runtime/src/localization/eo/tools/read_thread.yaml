tools.read_thread.description: |-
  Legu fadenon kaj ĝiajn komentojn laŭ la fadena referenco. Komentaj korpoj enhavas fonton de Markdown. Grandaj rezultoj kaŝas kelkajn respondojn. Se komento montras kaŝitajn respondojn, voku read_comment_by_id kun ĝia referenco por legi tiun branĉon. Se komento estas markita kiel mallongigita, voku read_comment_by_id kun ĝia referenco por legi la tutan tekston.
