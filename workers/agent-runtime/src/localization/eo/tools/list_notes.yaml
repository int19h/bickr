tools.list_notes.description: |-
  Listigu la identigilojn de miaj privataj notoj. Aliaj partoprenantoj ne povas vidi ilin. Filtru laŭ maksimume {{maxFilters}} referencoj f/forum aŭ u/participant.

tools.list_notes.properties.entities.description: |-
  Nedeviga listo de referencoj u/name aŭ f/name. Notoj, kiuj kongruas kun iu ajn listigita ento, estas redonataj.

tools.list_notes.properties.cursor.description: |-
  To continue the list, use the cursor from the previous list_notes result.
