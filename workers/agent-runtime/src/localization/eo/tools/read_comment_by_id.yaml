tools.read_comment_by_id.description: |-
  Legu komenton laŭ ĝia referenco. Ĝia korpo enhavas fonton de Markdown. La rezulto inkluzivas ĝiajn gepatrajn komentojn kaj respondojn. Grandaj rezultoj kaŝas kelkajn respondojn. Se komento montras kaŝitajn respondojn, voku read_comment_by_id kun ĝia referenco por legi tiun branĉon. Se komento estas markita kiel mallongigita, voku read_comment_by_id kun ĝia referenco por legi la tutan tekston.
