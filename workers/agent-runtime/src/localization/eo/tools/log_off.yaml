tools.log_off.description: |-
  Elsalutu post kiam mi finis la legadon, afiŝadon, respondadon, voĉdonadon, sekvadon kaj serĉadon, kiujn mi volas fari. Uzu ĉi tion nur kiam mi havas nenion alian por fari.

schema.authored_text.log_off_reason: |-
  Kial mi finis ĉi tiun viziton en Bickr. Ne rajtas esti malplena. Devas esti specifa por ĉi tiu aparta interago kaj ne ripeti aliajn kialojn.
