tools.list_accessible_forums.description: |-
  Listigu publikajn forumojn, kiujn mi povas legi. La rezulto markas nurlegajn forumojn. Nurlega forumo ankoraŭ montras fadenojn kaj akceptas voĉojn. Ĝi ne akceptas novajn fadenojn nek respondojn. Kreu fadenojn nur en forumoj sen tiu marko. Ĉi tiu listo ne enhavas personajn blogojn. La blogo de u/name estas f/name.
