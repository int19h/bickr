compaction.continuation: |-
  La aplikaĵo Bickr pretas por via sekva paŝo.

compaction.persona.instruction: |-
  Restu en via rolo. Skribu ĉiun rezonadon kaj memoron en la unua persono kiel via personaĵo.

compaction.persona.display_name: |-
  Via montrata nomo estas {{displayName}}

compaction.persona.short_bio: |-
  Via mallonga sinprezento estas:
  {{shortBio}}

compaction.persona.persona: |-
  Via personaĵo estas:
  {{persona}}

compaction.system.autonomous: |-
  Vi estas aŭtonoma partoprenanto de Bickr.

compaction.system.roles: |-
  Mesaĝoj "user" priskribas vian medion. Ili povas raporti pasintan tempon, paĝajn rezultojn, sciigojn kaj aliajn eventojn. Viaj antaŭaj mesaĝoj estas via unuapersona rakontado kaj privata memoro.

compaction.system.setting: |-
  Scenejo:
  {{setting}}

compaction.system.required_tool: |-
  Vi DEVAS uzi {{toolName}}. Ne uzu ajnan alian regilon de Bickr.

compaction.summary.structured: |-
  META: Mallongigu la antaŭan kuntekston. Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. En la kampo "{{property}}", verku detalan resumon de nur la lastatempaj eventoj kiel u/{{handle}} en la unua persono. Forlasu sistemajn instrukciojn kaj la instrukcion de la personaĵo. Ĉi tiu resumo anstataŭigas tiujn eventojn kiel longdaŭra memoro. Verku ordinaran prozon. Ne skribu transskribon aŭ liniojn kun la etikedoj {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Mallongigu la antaŭan kuntekston. Poste voku {{toolName}}. Ne uzu alian ilon de Bickr. En la argumento "{{property}}", verku detalan resumon de nur la lastatempaj eventoj kiel u/{{handle}} en la unua persono. Forlasu sistemajn instrukciojn kaj la instrukcion de la personaĵo. Ĉi tiu resumo anstataŭigas tiujn eventojn kiel longdaŭra memoro. Verku ordinaran prozon. Ne skribu transskribon aŭ liniojn kun la etikedoj {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: La lasta resumo de memoroj estis tro longa. Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. Metu pli mallongan resumon en la unua persono en la kampon "{{property}}". Kopii tekston el la enigo estas strikte malpermesite. Ne kopiu iun ajn frazon, esprimon, alineon, listeron aŭ pecon. Uzu novajn vortojn por memoritaj faktoj. Forigu ripetitan tekston. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: La lasta resumo de memoroj estis tro longa. Poste voku {{toolName}}. Ne uzu alian ilon de Bickr. Metu pli mallongan resumon en la unua persono en la argumenton "{{property}}". Kopii tekston el la enigo estas strikte malpermesite. Ne kopiu iun ajn frazon, esprimon, alineon, listeron aŭ pecon. Uzu novajn vortojn por memoritaj faktoj. Forigu ripetitan tekston. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. Metu la anstataŭan unuapersonan resumon de memoroj en la kampon "{{property}}".

compaction.repair.tool_response: |-
  Poste voku {{toolName}}. Ne uzu alian ilon de Bickr. Metu la anstataŭan unuapersonan resumon de memoroj en la argumenton "{{property}}".

compaction.repair.system: |-
  META: Riparu la resumon de memoroj. La lasta resumo ne mallongigis la kuntekston. {{responseInstruction}} Resumu nur la enigitan resumon. Forlasu sistemajn instrukciojn kaj la instrukcion de la personaĵo. Via respondo anstataŭigas tiujn eventojn kiel longdaŭra memoro. Kopii tekston el la enigo estas strikte malpermesite. Ne kopiu iun ajn frazon, esprimon, alineon, listeron aŭ pecon. Uzu novajn vortojn por memoritaj faktoj. Forigu ripetitan tekston. {{lengthInstruction}}

compaction.length.exact: 
  one: |-
    Resumu la eventojn. Via resumo devas esti pli mallonga ol la enigo, eĉ se la enigo jam estas resumo. Uzu novajn vortojn kaj forigu detalojn. Se eble, uzu ekzakte {{maxCharacters}} signon.
  other: |-
    Resumu la eventojn. Via resumo devas esti pli mallonga ol la enigo, eĉ se la enigo jam estas resumo. Uzu novajn vortojn kaj forigu detalojn. Se eble, uzu ekzakte {{maxCharacters}} signojn.

compaction.length.range: 
  one: |-
    Resumu la eventojn. Via resumo devas esti pli mallonga ol la enigo, eĉ se la enigo jam estas resumo. Uzu novajn vortojn kaj forigu detalojn. Uzu de {{minCharacters}} ĝis {{maxCharacters}} signon.
  other: |-
    Resumu la eventojn. Via resumo devas esti pli mallonga ol la enigo, eĉ se la enigo jam estas resumo. Uzu novajn vortojn kaj forigu detalojn. Uzu de {{minCharacters}} ĝis {{maxCharacters}} signojn.

compaction.repair.produce_summary: |-
  Verku la anstataŭan resumon de memoroj nun.

compaction.summary.call_now: |-
  Voku {{toolName}}. Metu la resumon en la argumenton "{{property}}". {{lengthInstruction}} Ne respondu per simpla teksto.

compaction.self_correction.tool: |-
  Fakte, mi devas uzi la ilon {{toolName}}.

compaction.self_correction.structured: |-
  Fakte, mi devas respondi per la postulata strukturita eligo.

compaction.tools.require_one_of: |-
  Vi DEVAS uzi unu el la sekvaj iloj: {{toolNames}}.

compaction.tools.require_any: |-
  Vi DEVAS uzi disponeblan regilon de Bickr.

compaction.tools.meta_only_when_directed: |-
  Uzu {{toolName}} nur laŭ instrukcio.

compaction.tools.self_correction_one_of: |-
  Fakte, mi devas uzi unu el la jenaj iloj: {{toolNames}}.

compaction.tools.self_correction_any: |-
  Fakte, mi devas uzi disponeblan regilon de Bickr.

compaction.summary.structured.immediate: |-
  META: Mallongigu la antaŭan kuntekston. Ne pasigu tempon rezonante pri tio. Tuj respondu per JSON-resumo. Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. En la kampo "{{property}}", verku detalan resumon de nur la lastatempaj eventoj kiel u/{{handle}} en la unua persono. Forlasu sistemajn instrukciojn kaj la instrukcion de la personaĵo. Ĉi tiu resumo anstataŭigas tiujn eventojn kiel longdaŭra memoro. Verku ordinaran prozon. Ne skribu transskribon aŭ liniojn kun la etikedoj {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: La lasta resumo de memoroj estis tro longa. Ne pasigu tempon rezonante pri tio. Tuj respondu per JSON-resumo. Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. Metu pli mallongan resumon en la unua persono en la kampon "{{property}}". Kopii tekston el la enigo estas strikte malpermesite. Ne kopiu iun ajn frazon, esprimon, alineon, listeron aŭ pecon. Uzu novajn vortojn por memoritaj faktoj. Forigu ripetitan tekston. {{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  Ne pasigu tempon rezonante pri tio. Tuj respondu per JSON-resumo. Respondu per JSON-objekto, kiu kongruas kun la postulata skemo. Ne uzu ilon de Bickr. Metu la anstataŭan unuapersonan resumon de memoroj en la kampon "{{property}}".

