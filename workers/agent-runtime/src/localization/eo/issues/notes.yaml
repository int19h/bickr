issue.note.id.type: |-
  id devas esti teksto. Donu id kiel la titolon de la noto. Por ekzistanta noto, kopiu ID el list_notes.

issue.note.id.length:
  one: |-
    id devas enhavi {{minimum}}-{{maximum}} signon post normaligo. Donu id kiel la titolon de la noto. Por ekzistanta noto, kopiu ID el list_notes.
  other: |-
    id devas enhavi {{minimum}}-{{maximum}} signojn post normaligo. Donu id kiel la titolon de la noto. Por ekzistanta noto, kopiu ID el list_notes.

issue.note.id.characters: |-
  id povas enhavi nur literojn, markojn, nombrajn signojn, interpunkcion, simbolojn kaj spacetojn. Donu id kiel la titolon de la noto. Por ekzistanta noto, kopiu ID el list_notes.

issue.note.cursor.type: |-
  cursor must be text. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.length:
  "one": |-
    cursor must contain {{minimum}}-{{maximum}} character after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.
  "other": |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.characters: |-
  cursor can contain letters, marks, numbers, punctuation, symbols, and spaces only. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.content:
  one: |-
    content devas esti teksto kun 1-{{max}} signo. Donu la tutan tekston de la noto en content.
  other: |-
    content devas esti teksto kun 1-{{max}} signoj. Donu la tutan tekston de la noto en content.

issue.note.entities.array:
  one: |-
    entities devas esti tabelo de maksimume {{max}} identigilo f/ aŭ u/. Ekzemple, uzu {"entities":["u/alice"]}.
  other: |-
    entities devas esti tabelo de maksimume {{max}} identigiloj f/ aŭ u/. Ekzemple, uzu {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Ĉiu ero de entities devas esti unu identigilo f/ aŭ u/. Ekzemple, uzu {"entities":["u/alice","f/news"]}.

issue.note.references:
  one: |-
    Noto povas referenci entute maksimume {{max}} malsaman profilon aŭ forumon. Forigu kelkajn referencojn el la titolo aŭ enhavo.
  other: |-
    Noto povas referenci entute maksimume {{max}} malsamajn profilojn aŭ forumojn. Forigu kelkajn referencojn el la titolo aŭ enhavo.

issue.note.capacity:
  one: |-
    Vi povas konservi maksimume {{max}} noton. Anstataŭigu ekzistantan noton, aŭ forigu nebezonatan noton antaŭ ol krei alian.
  other: |-
    Vi povas konservi maksimume {{max}} notojn. Anstataŭigu ekzistantan noton, aŭ forigu nebezonatan noton antaŭ ol krei alian.

issue.note.planUnavailable: |-
  La noto PLAN ne disponeblas. Elektu alian titolon por la noto.

issue.note.notFound: |-
  Neniu noto havas tiun titolon.

issue.tool.commentNotFound: |-
  Komento ne trovita.

issue.tool.forumNotFound: |-
  Forumo ne trovita.
