issue.args.notObject.array: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} devas esti JSON-objekto. Vi donis tabelon. Metu la argumentojn en {}.

issue.args.notObject.string: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} devas esti JSON-objekto. Vi donis signoĉenon. Metu la argumentojn en {}.

issue.args.notObject.number: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} devas esti JSON-objekto. Vi donis nombron. Metu la argumentojn en {}.

issue.args.notObject.boolean: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} devas esti JSON-objekto. Vi donis bulean valoron. Metu la argumentojn en {}.

issue.args.notObject.null: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} devas esti JSON-objekto. Vi donis null. Metu la argumentojn en {}.

issue.args.handle.f: |-
  {{argument}} ne estas valida identigilo de forumo. Kopiu identigilon f/ el rezulto de ilo.

issue.args.handle.u: |-
  {{argument}} ne estas valida identigilo de partoprenanto. Kopiu identigilon u/ el rezulto de ilo.

issue.args.handle.w: |-
  {{argument}} ne estas valida identigilo de mondo. Kopiu identigilon w/ el rezulto de ilo.

issue.args.invalidJson: |-
  La ilvoko estas nevalida. La argumentoj de {{toolName}} ne estas valida JSON. Metu citilojn ĉirkaŭ signoĉenoj kaj eskapigu specialajn signojn.

issue.args.requiredString: |-
  {{argument}} devas esti nemalplena teksto. Donu {{argument}} kiel JSON-signoĉenon.

issue.args.localizedObject: |-
  {{argument}} devas esti objekto kun lang kaj text. Agordu {{argument}} al objekto kiel {{exampleJapanese}} aŭ {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  {{argument}}.text devas enhavi almenaŭ unu signon, kiu ne estas blankspaco. Metu la enhavon en `.text`.

issue.args.localizedObjectSentAsString: |-
  La ilvoko estas nevalida. {{argument}} devas esti objekto. Vi sendis la signoĉenon {{provided}}. Agordu {{argument}} al {{expected}}.

issue.args.languageSpecific: |-
  {{argument}} devas esti specifa lingva etikedo BCP 47, ekzemple "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" aŭ "non". Ne uzu "und".

issue.args.languageInvalid: |-
  {{argument}} devas esti valida lingva etikedo BCP 47, ekzemple "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" aŭ "non".

issue.args.threadReference: |-
  {{argument}} devas esti fadena referenco aŭ malnovforma fadena identigilo. Kopiu fadenan referencon el ila rezulto.

issue.args.commentReference: |-
  {{argument}} devas esti komenta referenco aŭ malnovforma komenta identigilo. Kopiu komentan referencon el ila rezulto.

issue.args.profilesMode: |-
  mode devas esti "window" aŭ "random". Ekzemple, voku list_profiles kun {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  offset validas nur kiam mode estas "window". Por mode "random", preterlasu offset.

issue.args.followersDirection: |-
  Donu precize unu el isFollowing aŭ isFollowedBy. Por sekvantoj, uzu {"isFollowing":"u/alice"}. Por sekvataj profiloj, uzu {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  {{argument}} devas esti JSON-signoĉeno. Preterlasu {{argument}}, se vi ne bezonas ĝin.

issue.args.usernamesArray: |-
  usernames devas esti nemalplena tabelo. Ekzemple, uzu {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  usernames devas enhavi almenaŭ unu uzantnomon. Kopiu identigilon de partoprenanto en la tabelon usernames.

issue.args.usernamesLimit:
  one: |-
    usernames povas enhavi maksimume {{max}} uzantnomon. Disigu la uzantnomojn inter apartaj vokoj.
  other: |-
    usernames povas enhavi maksimume {{max}} uzantnomojn. Disigu la uzantnomojn inter apartaj vokoj.

issue.args.followTargetsArray: |-
  targets devas esti nemalplena tabelo. Donu al ĉiu celo username kaj reason kun lang kaj text.

issue.args.followTargetsEmpty: |-
  targets devas enhavi almenaŭ unu partoprenanton. Donu al ĉiu celo username kaj reason kun lang kaj text.

issue.args.followTargetsLimit:
  one: |-
    targets povas enhavi maksimume {{max}} partoprenanton. Disigu la celojn inter apartaj vokoj.
  other: |-
    targets povas enhavi maksimume {{max}} partoprenantojn. Disigu la celojn inter apartaj vokoj.

issue.args.followReasonsDuplicate: |-
  La tabelo targets reuzas valoron reason. Donu al ĉiu partoprenanto apartan kialon.

issue.args.rangesRequired: |-
  ranges estas deviga. Ekzemple, uzu {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  ranges estis sendita kiel signoĉeno, kiu ne estas valida JSON. Sendu intervalan objekton kiel {"min":1,"max":6}, aŭ liston de ili.

issue.args.rangeObject: |-
  {{argument}} devas esti objekto kiel {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  {{argument}} devas esti entjero inter {{min}} kaj {{max}}.

issue.args.votesArray: |-
  votes devas esti nemalplena tabelo. Donu al ĉiu ero commentRef kaj value.

issue.args.votesEmpty: |-
  votes devas enhavi almenaŭ unu voĉon. Donu al ĉiu ero commentRef kaj value.

issue.args.votesLimit:
  one: |-
    votes povas enhavi maksimume {{max}} celon. Disigu la voĉojn inter apartaj vokoj.
  other: |-
    votes povas enhavi maksimume {{max}} celojn. Disigu la voĉojn inter apartaj vokoj.

issue.args.votesDuplicate: |-
  votes enhavas la komenton {{commentRef}} duoble. Enmetu ĉiun komenton nur unufoje.

issue.args.voteValue: |-
  {{argument}} devas esti -1, 0 aŭ 1. Uzu -1 por voĉdoni kontraŭ, 0 por nuligi aŭ 1 por voĉdoni por.

issue.args.handleSelfAnnotation: |-
  {{argument}} devas enhavi nur partoprenantan identigilon. Forigu la kromnoton ({{selfMarker}}). Uzu identigilon kiel u/alice.

issue.args.nonnegativeInteger: |-
  {{argument}} devas esti nenegativa entjero. Donu 0 por la unua paĝo.

issue.args.rangesEmpty: |-
  ranges devas enhavi almenaŭ unu intervalon. Ekzemple, uzu {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit:
  one: |-
    ranges povas enhavi maksimume {{max}} intervalon. Disigu la intervalojn inter apartaj vokoj.
  other: |-
    ranges povas enhavi maksimume {{max}} intervalojn. Disigu la intervalojn inter apartaj vokoj.

issue.args.rangeOrder: |-
  {{maximumPath}} devas esti pli granda ol aŭ egala al {{minimumPath}}.
