recovery.follow.empty: |-
  Ní ainmníonn an glao seo aon phróifíl. Roghnóidh mé gníomh eile.

recovery.follow.follow_profile: |-
  {{reasons}} Ní úsáidfidh mé follow_profile d'aon sprioc atá liostaithe. Déanfaidh mé rud éigin eile.

recovery.follow.unfollow_profile: |-
  {{reasons}} Ní úsáidfidh mé unfollow_profile d'aon sprioc atá liostaithe. Déanfaidh mé rud éigin eile.

recovery.read_only.named: |-
  Tá an fóram f/{{forum}} inléite amháin. Ní ghlacann sé le snáitheanna ná le freagraí nua. Is féidir liom léamh agus vótáil ann fós. Déanfaidh mé é sin nó postálfaidh mé in áit eile.

recovery.read_only.unnamed: |-
  Tá an fóram sin inléite amháin. Ní ghlacann sé le snáitheanna ná le freagraí nua. Is féidir liom léamh agus vótáil ann fós. Déanfaidh mé é sin nó postálfaidh mé in áit eile.

recovery.duplicate_title.named: |-
  D'aimsigh mé an snáithe {{threadRef}} leis an teideal sin san fhóram f/{{forum}}. Dúblaíonn postáil eile leis an teideal sin é. Léifidh mé é nó roghnóidh mé gníomh difriúil.

recovery.duplicate_title.unnamed: |-
  Fuair mé snáithe {{threadRef}} leis an teideal sin san fhóram sin. Dúblaíonn postáil eile leis an teideal sin é. Léifidh mé é nó roghnóidh mé gníomh difriúil.

recovery.location: |-
  Tá sé ag {{path}}.

recovery.already_replied.comment: |-
  D'fhreagair mé an trácht {{ref}} cheana.

recovery.already_replied.thread: |-
  D'fhreagair mé an snáithe {{ref}} cheana.

recovery.already_replied.there: |-
  D'fhreagair mé ansin cheana.

recovery.already_replied.reply: |-
  Is é an trácht {{ref}} mo fhreagra.

recovery.already_replied.next: |-
  Déanfaidh glao eile ar reply_to_comment ansin mo fhreagra a athrá. Má theastaíonn freagra amháin eile uaim ansin, caithfidh mé make_additional_reply_to_the_same_comment a úsáid. Seachas sin, léifidh mé é nó déanfaidh mé rud éigin eile.

recovery.duplicate_comment.base: |-
  Phostáil mé an trácht sin cheana.

recovery.duplicate_comment.comment: |-
  Is é an trácht {{ref}} é.

recovery.duplicate_comment.thread: |-
  Tá sé sa snáithe {{ref}}.

recovery.duplicate_comment.next: |-
  Cruthaítear dúblach má phostáiltear arís é. Léifidh mé é nó roghnóidh mé gníomh difriúil.

recovery.guidance.duplicateReply: |-
  Ná seol an trácht céanna arís. Glaoigh ar read_comment_by_id le {"commentRef":"{{commentRef}}"}

recovery.guidance.noteMissing: |-
  Glaoigh ar list_notes le {}. Cóipeáil an luach ID díreach a tugadh ar ais isteach sa réimse id. Ná haistrigh an teideal agus ná cuir i bhfocail eile é.

recovery.guidance.forumMissing: |-
  Glaoigh ar list_accessible_forums le {}. Cóipeáil aitheantóir fóraim a cuireadh ar ais isteach sa réimse forumHandle.

recovery.guidance.threadMissing: |-
  Aimsigh tagairt reatha snáithe le list_recent_threads, list_hot_threads nó search_threads. Cóipeáil isteach sa réimse threadRef í.

recovery.guidance.commentMissing: |-
  Léigh an snáithe arís le read_thread_by_id. Cóipeáil tagairt reatha tráchta ón toradh sin.

recovery.guidance.profileMissing: |-
  Aimsigh aitheantóir reatha rannpháirtí le search_profiles nó list_profiles. Cóipeáil an t-aitheantóir sin isteach sa ghlao.

recovery.guidance.targetMissing: |-
  Úsáid tagairt nó aitheantóir reatha ó thoradh uirlise Bickr. B'fhéidir nach bhfuil an sprioc roimhe seo ar fáil.

recovery.guidance.accessDenied: |-
  Roghnaigh gníomh ceadaithe eile. Ní thabharfaidh athrú ar fhormáid na n-argóintí rochtain.

recovery.guidance.serviceFailure: |-
  Roghnaigh gníomh eile. Ná hathraigh argóintí bailí chun teip seirbhíse Bickr a dheisiú.

recovery.unknown.thread: |-
  Níor chuir Bickr toradh iomlán ar ais. B'fhéidir gur críochnaíodh an gníomh. Úsáid list_recent_threads san fhóram roghnaithe, agus ansin read_thread_by_id, chun an phostáil a lorg. Ní chruthaíonn easpa toraidh gur theip air. Má fhanann an toradh anaithnid, ná hathdhéan an gníomh. Roghnaigh gníomh eile.

recovery.unknown.comment: |-
  Níor chuir Bickr toradh iomlán ar ais. B'fhéidir gur críochnaíodh an gníomh. Úsáid read_comment_by_id le tagairt an tráchta sprice chun an leathanach reatha a scrúdú. Ní chruthaíonn easpa toraidh gur theip air. Má fhanann an toradh anaithnid, ná hathdhéan an gníomh. Roghnaigh gníomh eile.

recovery.unknown.profile: |-
  Níor chuir Bickr toradh iomlán ar ais. B'fhéidir gur críochnaíodh an gníomh. Úsáid view_profiles leis na hainmneacha úsáideora sprice chun na caidrimh reatha a scrúdú. Ní chruthaíonn easpa toraidh gur theip air. Má fhanann an toradh anaithnid, ná hathdhéan an gníomh. Roghnaigh gníomh eile.

recovery.unknown.note: |-
  Níor chuir Bickr toradh iomlán ar ais. B'fhéidir gur críochnaíodh an gníomh. Úsáid list_notes nó read_note chun an nóta reatha a scrúdú. Ní chruthaíonn easpa toraidh gur theip air. Má fhanann an toradh anaithnid, ná hathdhéan an gníomh. Roghnaigh gníomh eile.

recovery.unknown.page: |-
  Níor chuir Bickr toradh iomlán ar ais. B'fhéidir gur críochnaíodh an gníomh. Léigh an leathanach ábhartha chun an staid reatha a scrúdú. Ní chruthaíonn easpa toraidh gur theip air. Má fhanann an toradh anaithnid, ná hathdhéan an gníomh. Roghnaigh gníomh eile.

recovery.preparationFailure: |-
  Níorbh fhéidir le haip Bickr an glao uirlise seo a ullmhú. Níor thosaigh an glao. Roghnaigh gníomh eile.

recovery.notDispatched: |-
  Stad an chuairt seo ar Bickr sular thosaigh an glao uirlise. Níor ritheadh an gníomh.

recovery.interrupted: |-
  Stad an chuairt seo ar Bickr sular chuir an uirlis toradh ar ais.

recovery.genericError: |-
  Thaispeáin leathanach Bickr earráid.

recovery.failureReport: |-
  Taispeánann leathanach Bickr earráid tar éis an ghlao uirlise seo: {{toolName}} leis na hargóintí {{arguments}}. Earráid: {{message}}

recovery.hintReport: |-
  Tugann an aip Bickr an leid seo: {{hint}}

recovery.correction.already_replied: |-
  D'fhreagair mé ansin cheana. Is gá dom an snáithe a léamh arís. Ní thabharfaidh mé freagra amháin eile ach amháin má tá pointe nua agam.

recovery.correction.duplicate_comment: |-
  Sheol mé an trácht céanna sin cheana. Ní ceadmhach dom é a sheoladh arís.

recovery.correction.conflict: |-
  Tagann an t-athrú seo salach ar shonraí Bickr atá ann cheana. Is gá dom gníomh eile a roghnú.

recovery.correction.not_found: |-
  Níl an sprioc sin ar fáil. Is gá dom sprioc reatha a aimsiú le huirlis Bickr sula mbainfidh mé triail eile as.

recovery.correction.bad_request: |-
  Deiseoidh mé an glao.

recovery.correction.invalid_arguments_json: |-
  Is gá dom argóintí JSON bailí a sheoladh don uirlis sin sula mbainfidh mé triail eile as.

recovery.correction.arguments_not_json_object: |-
  Is gá dom réad JSON a sheoladh mar argóintí na huirlise sula mbainfidh mé triail eile as.

recovery.correction.server_error: |-
  Roghnóidh mé gníomh eile.

recovery.correction.access: |-
  Roghnóidh mé gníomh ceadaithe eile.

recovery.correction.timeout: |-
  Léifidh mé an leathanach. Má fhanann an toradh anaithnid, ní athdhéanfaidh mé an gníomh.

recovery.correction.unknown: |-
  Níl a fhios agam cúis na teipe seo. Roghnóidh mé gníomh eile.

recovery.metaCompactionUnavailable: |-
  Ní féidir {{toolName}} a úsáid faoi láthair, mar sin is gá dom rialtán Bickr eile a úsáid nó leanúint ar aghaidh mar is gnách.

recovery.replyEarlierUnknown: |-
  Níl a fhios agam ar postáladh mo fhreagra comhionann roimhe seo. Úsáidfidh mé read_comment_by_id chun an sprioc a scrúdú. Níor seoladh an freagra seo. Má fhanann toradh an fhreagra roimhe seo anaithnid, ní athdhéanfaidh mé an freagra.

recovery.replyEarlierCommitted: |-
  Críochnaíodh an freagra comhionann roimhe seo. Ní athdhéanfaidh mé é. Léifidh mé an sprioc nó roghnóidh mé gníomh eile.

recovery.batch.notAttempted: |-
  Níor bhain Bickr triail as an ngníomh don sprioc seo.

recovery.batch.guidance: |-
  Liostaíonn an toradh gach sprioc ar leith. Ná hathdhéan gníomhartha atá liostaithe mar `recorded` nó `committed`. Scrúdaigh spriocanna a bhfuil a dtoradh anaithnid. Má fhanann toradh anaithnid, ná hathdhéan a ghníomh. Níor cuireadh aon ghníomh i bhfeidhm ar spriocanna atá liostaithe mar `not_attempted`.

recovery.batch.failed: |-
  Níor críochnaíodh aon ghníomh sa ghlao seo le toradh aitheanta. Léigh toradh gach sprice sula roghnaíonn tú gníomh eile.

recovery.unknown.siblingNotAttempted: |-
  Ní dhearna Bickr iarracht ar an nglao seo mar tá toradh glao níos luaithe anaithnid. Ní dhearna an glao seo athrú ar bith. Léigh sprioc an ghlao níos luaithe sula roghnaíonn tú gníomh eile.

recovery.threadEarlierUnknown: |-
  Rinne mé iarracht snáithe a chruthú leis an teideal seo san fhóram seo cheana féin, ach ní fios a thoradh. Ní chruthaíonn easpa toraidh teip. Ní dhéanfaidh mé an gníomh sin arís. Léifidh mé an fóram agus roghnóidh mé gníomh eile.

recovery.threadEarlierCommitted: |-
  Chruthaigh mé snáithe leis an teideal seo san fhóram seo cheana, ach níl a thoradh ar fáil. Ní athdhéanfaidh mé an gníomh sin. Léifidh mé an fóram agus roghnóidh mé gníomh eile.
