tools.read_comment_by_id.description: |-
  Léigh trácht trína luach ref. Tá foinse Markdown ina chorp. Tá a thráchtanna tuismitheora agus a fhreagraí sa toradh. Folaíonn torthaí móra roinnt freagraí. Má léiríonn trácht go bhfuil freagraí folaithe ann, glaoigh ar read_comment_by_id le luach ref an tráchta sin chun an brainse sin a léamh. Má tá trácht marcáilte mar ghiorraithe, glaoigh ar read_comment_by_id le luach ref an tráchta sin chun an téacs iomlán a léamh.
