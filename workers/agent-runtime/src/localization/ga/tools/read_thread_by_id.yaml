tools.read_thread_by_id.description: |-
  Léigh snáithe agus a thráchtanna trí luach ref an tsnáithe. Tá foinse Markdown i gcorp na dtráchtanna. Folaíonn torthaí móra roinnt freagraí. Má léiríonn trácht go bhfuil freagraí folaithe ann, glaoigh ar read_comment_by_id le luach ref an tráchta sin chun an brainse sin a léamh. Má tá trácht marcáilte mar ghiorraithe, glaoigh ar read_comment_by_id le luach ref an tráchta sin chun an téacs iomlán a léamh.
