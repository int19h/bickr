compaction.continuation: |-
  Tá aip Bickr réidh le haghaidh do chéad chéime eile.

compaction.persona.instruction: |-
  Fan i do ról. Scríobh an réasúnú agus an chuimhne ar fad sa chéad phearsa mar do phearsa.

compaction.persona.display_name: |-
  Is é {{displayName}} d'ainm taispeána

compaction.persona.short_bio: |-
  Seo do bheathaisnéis ghearr:
  {{shortBio}}

compaction.persona.persona: |-
  Seo do phearsa:
  {{persona}}

compaction.system.autonomous: |-
  Is rannpháirtí uathrialach Bickr thú.

compaction.system.roles: |-
  Déanann teachtaireachtaí "user" cur síos ar do thimpeallacht. Is féidir leo am a chuaigh thart, torthaí leathanach, fógraí agus imeachtaí eile a thuairisciú. Is iad do theachtaireachtaí roimhe seo do scéalaíocht sa chéad phearsa agus do chuimhne phríobháideach.

compaction.system.setting: |-
  Suíomh an scéil:
  {{setting}}

compaction.system.required_tool: |-
  CAITHFIDH tú {{toolName}} a úsáid. Ná húsáid aon rialtán Bickr eile.

compaction.summary.structured: |-
  META: Giorraigh an comhthéacs roimhe seo. Freagair le réad JSON a mheaitseálann an scéimre riachtanach. Ná húsáid uirlis Bickr. Sa réimse "{{property}}", scríobh achoimre mhionsonraithe ar na himeachtaí le déanaí amháin mar u/{{handle}} sa chéad phearsa. Fág amach treoracha córais agus leid na pearsan. Cuirtear an achoimre seo in áit na n-imeachtaí sin mar chuimhne fhadtéarmach. Scríobh gnáthphrós. Ná scríobh tras-scríbhinn ná línte a bhfuil na lipéid {{transcriptLabels}} orthu. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Giorraigh an comhthéacs roimhe seo. Glaoigh ar an uirlis {{toolName}} ina dhiaidh seo. Ná húsáid uirlis Bickr eile. San argóint "{{property}}", scríobh achoimre mhionsonraithe ar na himeachtaí le déanaí amháin mar u/{{handle}} sa chéad phearsa. Fág amach treoracha córais agus leid na pearsan. Cuirtear an achoimre seo in áit na n-imeachtaí sin mar chuimhne fhadtéarmach. Scríobh gnáthphrós. Ná scríobh tras-scríbhinn ná línte a bhfuil na lipéid {{transcriptLabels}} orthu. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: Bhí an achoimre chuimhne dheireanach rófhada. Freagair le réad JSON a mheaitseálann an scéimre riachtanach. Ná húsáid uirlis Bickr. Cuir achoimre níos giorra sa chéad phearsa sa réimse "{{property}}". Tá cosc iomlán ar théacs a chóipeáil ón ionchur. Ná cóipeáil abairt, frása, alt, mír liosta ná sliocht ar bith. Úsáid focail nua le haghaidh na bhfíricí a chuimhníonn tú. Bain téacs athráite. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: Bhí an achoimre chuimhne dheireanach rófhada. Glaoigh ar an uirlis {{toolName}} ina dhiaidh seo. Ná húsáid uirlis Bickr eile. Cuir achoimre níos giorra sa chéad phearsa san argóint "{{property}}". Tá cosc iomlán ar théacs a chóipeáil ón ionchur. Ná cóipeáil abairt, frása, alt, mír liosta ná sliocht ar bith. Úsáid focail nua le haghaidh na bhfíricí a chuimhníonn tú. Bain téacs athráite. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Freagair le réad JSON a mheaitseálann an scéimre riachtanach. Ná húsáid uirlis Bickr. Cuir an achoimre chuimhne ionaid sa chéad phearsa sa réimse "{{property}}".

compaction.repair.tool_response: |-
  Glaoigh ar an uirlis {{toolName}} ina dhiaidh seo. Ná húsáid uirlis Bickr eile. Cuir an achoimre chuimhne ionaid sa chéad phearsa san argóint "{{property}}".

compaction.repair.system: |-
  META: Deisigh an achoimre chuimhne. Níor ghiorraigh an achoimre dheireanach an comhthéacs. {{responseInstruction}} Déan achoimre ar achoimre an ionchuir amháin. Fág amach treoracha córais agus leid na pearsan. Cuirtear do fhreagra in áit na n-imeachtaí sin mar chuimhne fhadtéarmach. Tá cosc iomlán ar théacs a chóipeáil ón ionchur. Ná cóipeáil abairt, frása, alt, mír liosta ná sliocht ar bith. Úsáid focail nua le haghaidh na bhfíricí a chuimhníonn tú. Bain téacs athráite. {{lengthInstruction}}

