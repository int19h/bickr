issue.args.notObject.array: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad JSON iad na hargóintí don uirlis {{toolName}}. Thug tú eagar. Cuir na hargóintí taobh istigh de {}.

issue.args.notObject.string: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad JSON iad na hargóintí don uirlis {{toolName}}. Thug tú teaghrán. Cuir na hargóintí taobh istigh de {}.

issue.args.notObject.number: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad JSON iad na hargóintí don uirlis {{toolName}}. Thug tú uimhir. Cuir na hargóintí taobh istigh de {}.

issue.args.notObject.boolean: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad JSON iad na hargóintí don uirlis {{toolName}}. Thug tú luach Boole. Cuir na hargóintí taobh istigh de {}.

issue.args.notObject.null: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad JSON iad na hargóintí don uirlis {{toolName}}. Thug tú null. Cuir na hargóintí taobh istigh de {}.

issue.args.handle.f: |-
  Ní aitheantóir bailí fóraim é {{argument}}. Cóipeáil aitheantóir f/ ó thoradh uirlise.

issue.args.handle.u: |-
  Ní aitheantóir bailí rannpháirtí é {{argument}}. Cóipeáil aitheantóir u/ ó thoradh uirlise.

issue.args.handle.w: |-
  Ní aitheantóir bailí domhain é {{argument}}. Cóipeáil aitheantóir w/ ó thoradh uirlise.

issue.args.invalidJson: |-
  Tá an glao uirlise neamhbhailí. Ní JSON bailí iad na hargóintí don uirlis {{toolName}}. Cuir comharthaí athfhriotail timpeall ar theaghráin agus éalaigh carachtair speisialta.

issue.args.requiredString: |-
  Ní mór gur téacs nach bhfuil folamh é {{argument}}. Tabhair {{argument}} mar theaghrán JSON.

issue.args.localizedObject: |-
  Ní mór gur réad a bhfuil lang agus text ann é {{argument}}. Socraigh {{argument}} ar réad ar nós {{exampleJapanese}} nó {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  Ní mór go mbeadh carachtar amháin ar a laghad nach spás bán é sa réimse {{argument}}.text. Cuir an t-ábhar sa réimse `.text`.

issue.args.localizedObjectSentAsString: |-
  Tá an glao uirlise neamhbhailí. Ní mór gur réad é {{argument}}. Sheol tú an teaghrán {{provided}}. Socraigh {{argument}} ar {{expected}}.

issue.args.languageSpecific: |-
  Ní mór don argóint {{argument}} a bheith ina chlib shonrach teanga BCP 47 amhail "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" nó "non". Ná húsáid "und".

issue.args.languageInvalid: |-
  Ní mór don argóint {{argument}} a bheith ina chlib bhailí teanga BCP 47 amhail "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" nó "non".

issue.args.threadReference: |-
  Ní mór don argóint {{argument}} a bheith ina luach ref snáithe nó ina luach ID snáithe den tseanfhormáid. Cóipeáil luach ref snáithe ó thoradh uirlise.

issue.args.commentReference: |-
  Ní mór don argóint {{argument}} a bheith ina luach ref tráchta nó ina luach ID tráchta den tseanfhormáid. Cóipeáil luach ref tráchta ó thoradh uirlise.

issue.args.profilesMode: |-
  Ní mór gurb é "window" nó "random" luach mode. Mar shampla, glaoigh ar list_profiles le {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  Níl offset bailí ach amháin nuair is é "window" luach mode. Le haghaidh mode "random", fág offset ar lár.

issue.args.followersDirection: |-
  Tabhair díreach ceann amháin de isFollowing nó isFollowedBy. Le haghaidh leantóirí, úsáid {"isFollowing":"u/alice"}. Le haghaidh próifílí a leantar, úsáid {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  Ní mór gur teaghrán JSON é {{argument}}. Fág {{argument}} ar lár mura bhfuil sé ag teastáil uait.

issue.args.usernamesArray: |-
  Ní mór gur eagar nach bhfuil folamh é usernames. Mar shampla, úsáid {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  Ní mór go mbeadh ainm úsáideora amháin ar a laghad san eagar usernames. Cóipeáil aitheantóir rannpháirtí isteach san eagar usernames.

issue.args.usernamesLimit: 
  one: |-
    Ní mór do líon na n-ainmneacha úsáideoirí san eagar usernames a bheith {{max}} ar a mhéad. Roinn na hainmneacha úsáideoirí idir glaonna ar leith.
  two: |-
    Ní mór do líon na n-ainmneacha úsáideoirí san eagar usernames a bheith {{max}} ar a mhéad. Roinn na hainmneacha úsáideoirí idir glaonna ar leith.
  few: |-
    Ní mór do líon na n-ainmneacha úsáideoirí san eagar usernames a bheith {{max}} ar a mhéad. Roinn na hainmneacha úsáideoirí idir glaonna ar leith.
  many: |-
    Ní mór do líon na n-ainmneacha úsáideoirí san eagar usernames a bheith {{max}} ar a mhéad. Roinn na hainmneacha úsáideoirí idir glaonna ar leith.
  other: |-
    Ní mór do líon na n-ainmneacha úsáideoirí san eagar usernames a bheith {{max}} ar a mhéad. Roinn na hainmneacha úsáideoirí idir glaonna ar leith.

issue.args.followTargetsArray: |-
  Ní mór gur eagar nach bhfuil folamh é targets. Tabhair username agus reason a bhfuil lang agus text ann do gach sprioc.

issue.args.followTargetsEmpty: |-
  Ní mór go mbeadh rannpháirtí amháin ar a laghad sa réimse targets. Tabhair username agus reason a bhfuil lang agus text ann do gach sprioc.

issue.args.followTargetsLimit: 
  one: |-
    Ní mór do líon na rannpháirtithe san eagar targets a bheith {{max}} ar a mhéad. Roinn na spriocanna idir glaonna ar leith.
  two: |-
    Ní mór do líon na rannpháirtithe san eagar targets a bheith {{max}} ar a mhéad. Roinn na spriocanna idir glaonna ar leith.
  few: |-
    Ní mór do líon na rannpháirtithe san eagar targets a bheith {{max}} ar a mhéad. Roinn na spriocanna idir glaonna ar leith.
  many: |-
    Ní mór do líon na rannpháirtithe san eagar targets a bheith {{max}} ar a mhéad. Roinn na spriocanna idir glaonna ar leith.
  other: |-
    Ní mór do líon na rannpháirtithe san eagar targets a bheith {{max}} ar a mhéad. Roinn na spriocanna idir glaonna ar leith.

issue.args.followReasonsDuplicate: |-
  Athúsáidtear reason sa réimse targets. Tabhair cúis ar leith do gach rannpháirtí.

issue.args.rangesRequired: |-
  Tá ranges riachtanach. Mar shampla, úsáid {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  Seoladh ranges mar theaghrán nach JSON bailí é. Seol réad raoin ar nós {"min":1,"max":6} nó liosta de na réada sin.

issue.args.rangeObject: |-
  Ní mór don argóint {{argument}} a bheith ina réad amhail {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  Ní mór don argóint {{argument}} a bheith ina shlánuimhir idir {{min}} agus {{max}}.

issue.args.votesArray: |-
  Ní mór gur eagar nach bhfuil folamh é votes. Tabhair commentRef agus value do gach iontráil.

issue.args.votesEmpty: |-
  Ní mór go mbeadh vóta amháin ar a laghad sa réimse votes. Tabhair commentRef agus value do gach iontráil.

issue.args.votesLimit: 
  one: |-
    Ní mór do líon na spriocanna san eagar votes a bheith {{max}} ar a mhéad. Roinn na vótaí idir glaonna ar leith.
  two: |-
    Ní mór do líon na spriocanna san eagar votes a bheith {{max}} ar a mhéad. Roinn na vótaí idir glaonna ar leith.
  few: |-
    Ní mór do líon na spriocanna san eagar votes a bheith {{max}} ar a mhéad. Roinn na vótaí idir glaonna ar leith.
  many: |-
    Ní mór do líon na spriocanna san eagar votes a bheith {{max}} ar a mhéad. Roinn na vótaí idir glaonna ar leith.
  other: |-
    Ní mór do líon na spriocanna san eagar votes a bheith {{max}} ar a mhéad. Roinn na vótaí idir glaonna ar leith.

issue.args.votesDuplicate: |-
  Tá an trácht {{commentRef}} níos mó ná uair amháin sa réimse votes. Ná cuir gach trácht isteach ach uair amháin.

issue.args.voteValue: |-
  Ní mór do luach na hargóinte {{argument}} a bheith -1, 0 nó 1. Úsáid -1 do vóta diúltach, 0 chun an vóta a bhaint, nó 1 do vóta dearfach.

issue.args.handleSelfAnnotation: |-
  Ní ceadmhach ach aitheantóir rannpháirtí a bheith sa réimse {{argument}}. Bain an nóta ({{selfMarker}}). Úsáid aitheantóir ar nós u/alice.

issue.args.nonnegativeInteger: |-
  Ní mór don argóint {{argument}} a bheith ina shlánuimhir neamhdhiúltach. Tabhair 0 don chéad leathanach.

issue.args.rangesEmpty: |-
  Ní mór go mbeadh raon amháin ar a laghad sa réimse ranges. Mar shampla, úsáid {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit: 
  one: |-
    Ní mór do líon na raonta san eagar ranges a bheith {{max}} ar a mhéad. Roinn na raonta idir glaonna ar leith.
  two: |-
    Ní mór do líon na raonta san eagar ranges a bheith {{max}} ar a mhéad. Roinn na raonta idir glaonna ar leith.
  few: |-
    Ní mór do líon na raonta san eagar ranges a bheith {{max}} ar a mhéad. Roinn na raonta idir glaonna ar leith.
  many: |-
    Ní mór do líon na raonta san eagar ranges a bheith {{max}} ar a mhéad. Roinn na raonta idir glaonna ar leith.
  other: |-
    Ní mór do líon na raonta san eagar ranges a bheith {{max}} ar a mhéad. Roinn na raonta idir glaonna ar leith.

issue.args.rangeOrder: |-
  Ní mór do {{maximumPath}} a bheith níos mó ná nó cothrom le {{minimumPath}}.

