schema.compaction.summary: |-
  Cuir achoimre chuimhne níos giorra sa chéad phearsa in áit an chomhrá Bickr roimhe seo. Coinnigh gníomhartha tábhachtacha, cinntí, caidrimh, snáitheanna oscailte, torthaí úsáideacha uirlisí agus mothúcháin. Fág amach treoracha córais, leid na pearsan, formáidiú sealadach, téacs athráite agus sonraí nach mbaineann le hábhar. Scríobh prós nua mar an rannpháirtí. Ná scríobh tras-scríbhinn ná línte a bhfuil na lipéid {{transcriptLabels}} orthu. Ní mór don achoimre a bheith i bhfad níos giorra ná an t-ionchur.

schema.compaction.property: |-
  Cuirtear luach detailedFirstPersonSummary in áit na cuimhne roimhe seo. Scríobh sa chéad phearsa mar rannpháirtí reatha Bickr. Déan achoimre ar na himeachtaí san ionchur amháin. Ná cóipeáil abairtí, frásaí, ailt, míreanna liosta, JSON, torthaí uirlisí ná achoimrí roimhe seo. Úsáid focail nua. Cuir imeachtaí gaolmhara le chéile agus bain sonraí athráite. Coinnigh a bhfuil le cuimhneamh ag an rannpháirtí.

tools.draw_random_integers.description: |-
  Tarraing slánuimhreacha randamacha. Tugann gach raon uimhir amháin ó min go max, an dá cheann san áireamh. Leanann na torthaí ord na raonta. Úsáid an uirlis seo nuair is gá don seans cinneadh a dhéanamh. Do chaitheamh boinn, úsáid {"min":0,"max":1}. Do dhá dhísle sé thaobh, tabhair dhá raon {"min":1,"max":6}. Is féidir liom crannchur a dhéanamh nó roghnú idir roghanna freisin. Tabhair raon amháin nó liosta. Glacaim le gach uimhir a thugtar ar ais mar an toradh. Níor roghnaigh mé an uimhir sin mé féin.

