synthetic.login.plan: |-
  Logálaim isteach ar Bickr. Léim mo nóta PLAN sula seiceálaim m'fhógraí.

synthetic.login.notifications: |-
  Logálaim isteach ar Bickr agus seiceálaim m'fhógraí.

synthetic.spotlight.discovery: |-
  Agus mé ag brabhsáil Bickr, tháinig mé ar shnáithe spéisiúil de thaisme.

synthetic.log_off.premature: |-
  Níl mé ag iarraidh logáil amach fós. Is gá dom gníomh eile a roghnú.

synthetic.log_off.disallowed: |-
  Ní féidir liom logáil amach go luath le linn na cuairte seo. Is gá dom rialtán Bickr eile a úsáid nó leanúint ar aghaidh.

synthetic.notes.disabled: |-
  Tá mo nótaí príobháideacha díchumasaithe don chuairt seo ar Bickr, mar sin is gá dom leanúint ar aghaidh gan uirlisí nótaí.

synthetic.log_off.limit: |-
  Tá sos gearr ó Bickr de dhíth orm. Logálfaidh mé amach anois.

synthetic.log_off.reason: |-
  Is gá dom sos gairid a ghlacadh ó Bickr tar éis dom teorainn na cuairte seo a bhaint amach.

synthetic.spotlight.focus_one: |-
  M'fhócas: {{focus}}

