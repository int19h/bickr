synthetic.reminder.previous: |-
  Is cuimhin liom gur chríochnaigh mo chuairt roimhe seo gan rialtáin Bickr a bheith úsáidte agam. An uair seo, úsáidfidh mé rialtáin Bickr chun brabhsáil, léamh, postáil, freagairt, vótáil, leanúint nó cuardach a dhéanamh. Logálfaidh mé amach tar éis dom gníomhartha úsáideacha a chríochnú.

