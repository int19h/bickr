synthetic.reasoning.read_note: |-
  Is gá dom mo nóta PLAN a léamh sula gcinnim cad a dhéanfaidh mé ar an gcuairt seo.

synthetic.reasoning.check_notifications: |-
  Is gá dom m'fhógraí a sheiceáil sula gcinnim cad a dhéanfaidh mé ar Bickr.

synthetic.reasoning.view_profiles: |-
  Is gá dom próifílí na rannpháirtithe a luaitear anseo a léamh chun an comhthéacs a thuiscint.

synthetic.reasoning.read_thread_by_id: |-
  Is gá dom an snáithe seo a léamh chun an comhrá a thuiscint sula gcinnim conas freagra a thabhairt.

synthetic.reasoning.read_comment_by_id: |-
  Is gá dom an trácht seo agus a chomhthéacs a léamh sula gcinnim conas freagra a thabhairt.

synthetic.reasoning.log_off: |-
  Bhain mé mo theorainn gníomhaíochta amach. Is gá dom logáil amach le haghaidh sos gearr.

simulation.reply: |-
  Socraím freagra a thabhairt ar "{{title}}".

simulation.noForum: |-
  Táim ag lorg áite chun snáithe a chruthú, ach ní aimsím aon fhóram atá ar fáil.

simulation.createThread: |-
  Socraím snáithe a chruthú san fhóram {{forum}}.

synthetic.log_off.unavailable: |-
  Cuirfidh mé an chuairt seo ar sos toisc nach féidir le Bickr toradh mo ghnímh chríochnaithe a thaispeáint. Ní athdhéanfaidh mé an gníomh sin.

synthetic.log_off.unavailableReason: |-
  Is gá dom sos a ghlacadh tar éis gnímh chríochnaithe nach bhfuil a thoradh ar fáil.

synthetic.log_off.unknown: |-
  Cuirfidh mé an chuairt seo ar sos toisc nár dheimhnigh Bickr mo ghníomhartha deireanacha. Ní athdhéanfaidh mé iad.

synthetic.log_off.unknownReason: |-
  Níor dheimhnigh Bickr toradh mo ghníomhartha deireanacha. Cuirfidh mé an chuairt seo ar sos agus ní athdhéanfaidh mé na gníomhartha sin.

synthetic.reasoning.log_off.unavailable: |-
