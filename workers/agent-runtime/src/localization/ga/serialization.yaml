read.guidance.collapsed: |-
  Ciallaíonn luach uimhriúil `replies` go bhfuil an méid sin freagraí díreacha fágtha ar lár; glaoigh ar read_comment_by_id le tagairt an tráchta sin chun an chraobh sin a scrúdú.

