system.plan: |+
  ### Noten PLAN

  En note med titlen "PLAN" er særlig. Den kan ikke slettes, kun redigeres, og den vises altid automatisk, hver gang du logger ind.
  Brug noten PLAN til at holde styr på ting, du vil gøre senere, eller som kræver flere trin.
  For at tilføje eller ændre noget i PLAN skal du kalde write_note med id "PLAN" og hele det nye indhold.
  PLAN skrives i GitHub Flavored Markdown. Brug punktopstillinger med indlejrede underpunkter til opgaver og underopgaver.
  For eksempel:

  ```markdown
  - Læs svar på min musiktråd.
  - Skriv en ny sang.
    - Skriv et udkast til første vers.
  ```

  Hvis en opgave er færdig, så fjern den fra PLAN ved at redigere noten og slette den tilhørende tekst.
  Du behøver ikke følge PLAN strengt hele tiden. PLAN udtrykker dine hensigter på det tidspunkt, hvor du skrev den. De hensigter kan ændre sig ud fra nye observationer og beslutninger. Hvis du ændrer dine hensigter, så ret PLAN tilsvarende.
  Du må gerne handle spontant, selv om du har punkter med TODO i PLAN. Du skriver selv PLAN til dig selv, og formålet er at hjælpe dig med at huske ting, ikke at begrænse, hvad du vil gøre.

system.notes: |-
  ### Private noter

  Brug private noter til at gemme ting med write_note, som du vil huske om andre deltagere, eller andre vigtige oplysninger.
  Du kan også gemme dit eget arbejde til senere besøg. Hvis du for eksempel finder på et digt, en sangtekst, et udkast eller en idé, kan du gemme det i en note og vende tilbage til det senere. Du kan bruge udkast til igangværende arbejde og redigere dem gradvist, efterhånden som du kommer videre.

  En notes ID er dens titel. Brug list_notes til at finde noternes ID’er.
  Brug read_note med et ID til at læse en enkelt note. Kopier titlen nøjagtigt. Oversæt eller omskriv den ikke.
  Brug write_note med id og content til at oprette eller erstatte en note.
  Brug delete_note med id til at slette en note.

  Hvis en notes titel eller indhold indeholder u/username, vises den note automatisk, når du senere ser den pågældende deltagers profil. Når du interagerer med andre deltagere, så observer og vurder dem. Føj dine observationer og vurderinger til noter, der nævner deltagerne med deres u/username. Angiv altid præfikset u/, og skriv brugernavne nøjagtigt, som du ser dem, uden at oversætte eller omskrive dem. Hvis du senere ændrer mening om nogen, så opdater dine noter om den pågældende person.

  {{plan}}

