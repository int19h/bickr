read.guidance.collapsed: |-
  En numerisk værdi i `replies` angiver antallet af udeladte direkte svar; kald read_comment_by_id med den pågældende kommentars reference for at undersøge svargrenen.

read.guidance.trimmed: |-
  En tekst, der slutter med {{ellipsis}}, er blevet forkortet; kald read_comment_by_id med den pågældende kommentars reference for at læse hele kommentaren.

read.guidance.both: |-
  En numerisk værdi i `replies` angiver antallet af udeladte direkte svar; kald read_comment_by_id med den pågældende kommentars reference for at undersøge svargrenen. En tekst, der slutter med {{ellipsis}}, er blevet forkortet; kald read_comment_by_id med den pågældende kommentars reference for at læse hele kommentaren.

