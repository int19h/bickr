structured_output.unexpected_tools.compaction: |-
  META: Kald ikke værktøjer. Svar med et detaljeret resumé i første person, der følger det påkrævede JSON-skema.

structured_output.unexpected_tools.other: |-
  Brug ikke en Bickr-kommando til dette svar. Svar med det påkrævede JSON-objekt, som kun indeholder {{property}}.

structured_output.empty.compaction: |-
  Svaret med resuméet var tomt. Returnér et JSON-objekt med tekst, der ikke er tom, i {{property}}.

structured_output.empty.translation: |-
  Svaret med oversættelsen var tomt. Returnér et JSON-objekt med tekst, der ikke er tom, i {{property}}.

structured_output.empty.avatar_description: |-
  Svaret med beskrivelsen af profilbilledet var tomt. Returnér et JSON-objekt med tekst, der ikke er tom, i {{property}}.

structured_output.invalid_json.compaction: |-
  Svaret med resuméet skal være et JSON-objekt. Angiv kun {{property}} med dets tekstværdi.

structured_output.invalid_json.translation: |-
  Svaret med oversættelsen skal være et JSON-objekt. Angiv kun {{property}} med dets tekstværdi.

structured_output.invalid_json.avatar_description: |-
