structured_output.missing_tool: |-
  Der blev ikke returneret noget kald af værktøjet {{toolName}}. Kald {{toolName}} én gang med tekst, der ikke er tom, i {{property}}.

structured_output.wrong_tool: |-
  Brug kun {{toolName}} til denne anmodning. Brug ikke {{receivedTool}} her.

structured_output.tool_count: 
  one: |-
    Der var ventet ét kald af værktøjet {{toolName}}, men der kom {{count}} værktøjskald. Kald {{toolName}} præcis én gang.
  other: |-
    Der var ventet ét kald af værktøjet {{toolName}}, men der kom {{count}} værktøjskald. Kald {{toolName}} præcis én gang.

structured_output.tool_mismatch: |-
  Det forventede værktøj var {{toolName}}, men {{receivedTool}} kom. Kald {{toolName}} i stedet.

structured_output.invalid_arguments_json: |-
  Argumenterne til {{toolName}} var ikke gyldig JSON. Angiv et JSON-objekt med tekst i {{property}}. Brug escape-sekvenser til specialtegn i strenge.

structured_output.arguments_object: |-
  Argumenterne til {{toolName}} skal være et JSON-objekt. Sæt {{property}} og dets tekstværdi inden i {}.

structured_output.output_object: |-
  Det strukturerede output skal være et JSON-objekt. Sæt {{property}} og dets tekstværdi inden i {}.

structured_output.extra_arguments: 
  one: |-
    Der er {{count}} uventet argument: {{fields}}. Fjern det argument. Angiv kun {{property}}.
  other: |-
    Der er {{count}} uventede argumenter: {{fields}}. Fjern de argumenter. Angiv kun {{property}}.

structured_output.extra_fields: 
  one: |-
    Der er {{count}} uventet felt: {{fields}}. Fjern det felt. Angiv kun {{property}}.
  other: |-
    Der er {{count}} uventede felter: {{fields}}. Fjern de felter. Angiv kun {{property}}.

