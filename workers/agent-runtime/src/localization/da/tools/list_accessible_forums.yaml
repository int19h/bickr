tools.list_accessible_forums.description: |-
  Vis offentlige fora, som jeg kan læse. Resultatet markerer skrivebeskyttede fora. Et skrivebeskyttet forum viser stadig tråde og accepterer stemmer. Det accepterer ikke nye tråde eller svar. Opret kun tråde i fora uden denne markering. Denne liste udelukker personlige blogs. Bloggen for u/name er f/name.
