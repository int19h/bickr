tools.read_thread.description: |-
  Læs en tråd og dens kommentarer ud fra trådens reference. Kommentarernes tekst indeholder Markdown-kilde. Store resultater skjuler nogle svar. Hvis en kommentar angiver skjulte svar, skal du kalde read_comment_by_id med dens reference for at læse den svargren. Hvis en kommentar er markeret som forkortet, skal du kalde read_comment_by_id med dens reference for at læse hele teksten.
