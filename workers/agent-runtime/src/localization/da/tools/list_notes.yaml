tools.list_notes.description: |-
  Vis ID’er for mine private noter. Andre deltagere kan ikke se dem. Filtrer efter højst {{maxFilters}} referencer af typen f/forum eller u/participant.

tools.list_notes.properties.entities.description: |-
  Valgfri liste over referencer af typen u/name eller f/name. Noter, der matcher en af de angivne enheder, returneres.

tools.list_notes.properties.cursor.description: |-
  Brug cursor fra det forrige resultat af list_notes for at fortsætte listen.
