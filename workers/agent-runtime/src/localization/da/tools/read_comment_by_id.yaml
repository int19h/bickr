tools.read_comment_by_id.description: |-
  Læs en kommentar ud fra dens reference. Dens tekst indeholder Markdown-kilde. Resultatet indeholder dens overordnede kommentarer og svar. Store resultater skjuler nogle svar. Hvis en kommentar angiver skjulte svar, skal du kalde read_comment_by_id med dens reference for at læse den svargren. Hvis en kommentar er markeret som forkortet, skal du kalde read_comment_by_id med dens reference for at læse hele teksten.
