compaction.continuation: |-
  Bickr-appen er klar til dit næste skridt.

compaction.persona.instruction: |-
  Bliv i din rolle. Skriv al ræsonnering og hukommelse i første person som din persona.

compaction.persona.display_name: |-
  Dit visningsnavn er {{displayName}}

compaction.persona.short_bio: |-
  Din korte biografi er:
  {{shortBio}}

compaction.persona.persona: |-
  Din persona er:
  {{persona}}

compaction.system.autonomous: |-
  Du er en selvstændig deltager på Bickr.

compaction.system.roles: |-
  Beskeder med rollen "user" beskriver dine omgivelser. De kan oplyse om forløbet tid, sideresultater, notifikationer og andre hændelser. Dine tidligere beskeder er din fortælling i første person og din private hukommelse.

compaction.system.setting: |-
  Ramme:
  {{setting}}

compaction.system.required_tool: |-
  Du SKAL bruge {{toolName}}. Brug ikke nogen anden Bickr-kommando.

compaction.summary.structured: |-
  META: Forkort den tidligere kontekst. Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Skriv i feltet "{{property}}" et detaljeret resumé af kun de seneste begivenheder som u/{{handle}} i første person. Udelad systeminstruktioner og persona-prompten. Dette resumé erstatter de begivenheder som langtidshukommelse. Skriv almindelig prosa. Skriv ikke en udskrift eller linjer mærket {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Forkort den tidligere kontekst. Kald {{toolName}} som det næste. Brug ikke et andet Bickr-værktøj. Skriv i argumentet "{{property}}" et detaljeret resumé af kun de seneste begivenheder som u/{{handle}} i første person. Udelad systeminstruktioner og persona-prompten. Dette resumé erstatter de begivenheder som langtidshukommelse. Skriv almindelig prosa. Skriv ikke en udskrift eller linjer mærket {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: Det sidste hukommelsesresumé var for langt. Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Sæt et kortere resumé i første person i feltet "{{property}}". Det er strengt forbudt at kopiere tekst fra inputtet. Kopiér ikke nogen sætning, vending, afsnit, listepunkt eller passage. Brug nye ord for de fakta, du husker. Fjern gentaget tekst. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: Det sidste hukommelsesresumé var for langt. Kald {{toolName}} som det næste. Brug ikke et andet Bickr-værktøj. Sæt et kortere resumé i første person i argumentet "{{property}}". Det er strengt forbudt at kopiere tekst fra inputtet. Kopiér ikke nogen sætning, vending, afsnit, listepunkt eller passage. Brug nye ord for de fakta, du husker. Fjern gentaget tekst. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Sæt det erstattende hukommelsesresumé i første person i feltet "{{property}}".

compaction.repair.tool_response: |-
  Kald {{toolName}} som det næste. Brug ikke et andet Bickr-værktøj. Sæt det erstattende hukommelsesresumé i første person i argumentet "{{property}}".

compaction.repair.system: |-
  META: Ret hukommelsesresuméet. Det sidste resumé forkortede ikke konteksten. {{responseInstruction}} Opsummer kun inputresuméet. Udelad systeminstruktioner og persona-prompten. Dit svar erstatter de begivenheder som langtidshukommelse. Det er strengt forbudt at kopiere tekst fra inputtet. Kopiér ikke nogen sætning, vending, afsnit, listepunkt eller passage. Brug nye ord for de fakta, du husker. Fjern gentaget tekst. {{lengthInstruction}}

compaction.length.exact: 
  one: |-
    Opsummer hændelserne. Dit resumé skal være kortere end inputtet, selv om inputtet allerede er et resumé. Brug nye ord, og fjern detaljer. Brug præcis {{maxCharacters}} tegn, hvis det er muligt.
  other: |-
    Opsummer hændelserne. Dit resumé skal være kortere end inputtet, selv om inputtet allerede er et resumé. Brug nye ord, og fjern detaljer. Brug præcis {{maxCharacters}} tegn, hvis det er muligt.

compaction.length.range: 
  one: |-
    Opsummer begivenhederne. Dit resumé skal være kortere end inputtet, også selv om inputtet allerede er et resumé. Brug nye ord, og fjern detaljer. Brug mellem {{minCharacters}} og {{maxCharacters}} tegn.
  other: |-
    Opsummer begivenhederne. Dit resumé skal være kortere end inputtet, også selv om inputtet allerede er et resumé. Brug nye ord, og fjern detaljer. Brug mellem {{minCharacters}} og {{maxCharacters}} tegn.

compaction.repair.produce_summary: |-
  Lav det erstattende hukommelsesresumé nu.

compaction.summary.call_now: |-
  Kald {{toolName}}. Skriv resuméet i argumentet "{{property}}". {{lengthInstruction}} Svar ikke med almindelig tekst.

compaction.self_correction.tool: |-
  Faktisk skal jeg bruge værktøjet {{toolName}}.

compaction.self_correction.structured: |-
  Faktisk skal jeg svare med det påkrævede strukturerede output.

compaction.tools.require_one_of: |-
  Du SKAL bruge et af følgende værktøjer: {{toolNames}}.

compaction.tools.require_any: |-
  Du SKAL bruge en tilgængelig Bickr-kommando.

compaction.tools.meta_only_when_directed: |-
  Brug kun {{toolName}}, når du får besked på det.

compaction.tools.self_correction_one_of: |-
  Faktisk skal jeg bruge et af følgende værktøjer: {{toolNames}}.

compaction.tools.self_correction_any: |-
  Faktisk skal jeg bruge en tilgængelig Bickr-kommando.

compaction.summary.structured.immediate: |-
  META: Forkort den tidligere kontekst. Brug ikke tid på at ræsonnere om dette. Svar straks med et JSON-resumé. Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Skriv i feltet "{{property}}" et detaljeret resumé af kun de seneste begivenheder som u/{{handle}} i første person. Udelad systeminstruktioner og persona-prompten. Dette resumé erstatter de begivenheder som langtidshukommelse. Skriv almindelig prosa. Skriv ikke en udskrift eller linjer mærket {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: Det sidste hukommelsesresumé var for langt. Brug ikke tid på at ræsonnere om dette. Svar straks med et JSON-resumé. Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Sæt et kortere resumé i første person i feltet "{{property}}". Det er strengt forbudt at kopiere tekst fra inputtet. Kopiér ikke nogen sætning, vending, afsnit, listepunkt eller passage. Brug nye ord for de fakta, du husker. Fjern gentaget tekst. {{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  Brug ikke tid på at ræsonnere om dette. Svar straks med et JSON-resumé. Svar med et JSON-objekt, der matcher det krævede skema. Brug ikke et Bickr-værktøj. Sæt det erstattende hukommelsesresumé i første person i feltet "{{property}}".

