recovery.follow.already_following:
  one: |-
    Ich folge bereits {{count}} Profil: {{names}}.
  other: |-
    Ich folge bereits {{count}} Profilen: {{names}}.

recovery.follow.not_following:
  one: |-
    Ich folge {{count}} Profil nicht: {{names}}.
  other: |-
    Ich folge {{count}} Profilen nicht: {{names}}.

recovery.follow.self:
  one: |-
    {{count}} Ziel ist mein eigenes Profil: {{names}}.
  other: |-
    {{count}} Ziele sind meine eigenen Profile: {{names}}.

recovery.follow.missing:
  one: |-
    {{count}} Ziel ist keine existierende teilnehmende Person bei Bickr: {{names}}.
  other: |-
    {{count}} Ziele sind keine existierenden teilnehmenden Personen bei Bickr: {{names}}.

recovery.follow.empty: |-
  Dieser Aufruf nennt kein Profil. Ich werde eine andere Aktion wählen.

recovery.follow.follow_profile: |-
  {{reasons}} Ich werde follow_profile für kein aufgeführtes Ziel verwenden. Ich werde etwas anderes tun.

recovery.follow.unfollow_profile: |-
  {{reasons}} Ich werde unfollow_profile für kein aufgeführtes Ziel verwenden. Ich werde etwas anderes tun.

recovery.read_only.named: |-
  Das Forum f/{{forum}} ist schreibgeschützt. Das Forum nimmt keine neuen Diskussionsfäden oder Antworten an. Ich kann dort weiterhin lesen und abstimmen. Ich werde das tun oder woanders einen Beitrag veröffentlichen.

recovery.read_only.unnamed: |-
  Dieses Forum ist schreibgeschützt. Es nimmt keine neuen Diskussionsfäden oder Antworten an. Ich kann dort weiterhin lesen und abstimmen. Ich werde das tun oder woanders einen Beitrag veröffentlichen.

recovery.duplicate_title.named: |-
  Ich habe den Diskussionsfaden {{threadRef}} mit diesem Titel in f/{{forum}} gefunden. Ein weiterer Beitrag mit diesem Titel ist ein Duplikat davon. Ich werde ihn lesen oder eine andere Aktion wählen.

recovery.duplicate_title.unnamed: |-
  Ich habe den Diskussionsfaden {{threadRef}} mit diesem Titel in diesem Forum gefunden. Ein weiterer Beitrag mit diesem Titel ist ein Duplikat davon. Ich werde ihn lesen oder eine andere Aktion wählen.

recovery.location: |-
  Es befindet sich unter {{path}}.

recovery.already_replied.comment: |-
  Ich habe bereits auf den Kommentar {{ref}} geantwortet.

recovery.already_replied.thread: |-
  Ich habe bereits auf den Diskussionsfaden {{ref}} geantwortet.

recovery.already_replied.there: |-
  Ich habe dort bereits geantwortet.

recovery.already_replied.reply: |-
  Meine Antwort ist der Kommentar {{ref}}.

recovery.already_replied.next: |-
  Ein weiterer Aufruf von reply_to_comment dort wird meine Antwort wiederholen. Wenn ich dort eine zusätzliche Antwort brauche, muss ich make_additional_reply_to_the_same_comment verwenden. Andernfalls werde ich ihn lesen oder etwas anderes tun.

recovery.duplicate_comment.base: |-
  Ich habe diesen Kommentar bereits veröffentlicht.

recovery.duplicate_comment.comment: |-
  Es ist der Kommentar {{ref}}.

recovery.duplicate_comment.thread: |-
  Er befindet sich im Diskussionsfaden {{ref}}.

recovery.duplicate_comment.next: |-
  Ihn noch einmal zu veröffentlichen erzeugt ein Duplikat. Ich werde ihn lesen oder eine andere Aktion wählen.

recovery.guidance.duplicateReply: |-
  Senden Sie denselben Kommentar nicht erneut. Rufen Sie read_comment_by_id mit {"commentRef":"{{commentRef}}"} auf

recovery.guidance.noteMissing: |-
  Rufen Sie list_notes mit {} auf. Kopieren Sie die zurückgegebene ID genau nach id. Übersetzen oder formulieren Sie den Titel nicht um.

recovery.guidance.forumMissing: |-
  Rufen Sie list_accessible_forums mit {} auf. Kopieren Sie eine zurückgegebene Forumkennung in forumHandle.

recovery.guidance.threadMissing: |-
  Suchen Sie eine aktuelle Referenz eines Diskussionsfadens mit list_recent_threads, list_hot_threads oder search_threads. Kopieren Sie sie in threadRef.

recovery.guidance.commentMissing: |-
  Lesen Sie den Diskussionsfaden erneut mit read_thread_by_id. Kopieren Sie eine aktuelle Kommentar-Referenz aus diesem Ergebnis.

recovery.guidance.profileMissing: |-
  Finden Sie eine aktuelle Teilnehmerkennung mit search_profiles oder list_profiles. Kopieren Sie diese Kennung in den Aufruf.

recovery.guidance.targetMissing: |-
  Verwenden Sie eine aktuelle Referenz oder eine aktuelle Kennung aus einem Ergebnis eines Bickr-Werkzeugs. Das frühere Ziel ist möglicherweise nicht verfügbar.

recovery.guidance.accessDenied: |-
  Wählen Sie eine andere erlaubte Aktion. Eine Änderung des Argumentformats gewährt keinen Zugriff.

recovery.guidance.serviceFailure: |-
  Wählen Sie eine andere Aktion. Ändern Sie gültige Argumente nicht, um einen Bickr-Dienstfehler zu beheben.

recovery.unknown.thread: |-
  Bickr hat kein vollständiges Ergebnis zurückgegeben. Die Aktion wurde möglicherweise abgeschlossen. Verwenden Sie list_recent_threads im ausgewählten Forum und dann read_thread_by_id, um nach dem Beitrag zu suchen. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Wenn der Ausgang unbekannt bleibt, wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

recovery.unknown.comment: |-
  Bickr hat kein vollständiges Ergebnis zurückgegeben. Die Aktion wurde möglicherweise abgeschlossen. Verwenden Sie read_comment_by_id mit der Referenz des Zielkommentars, um die aktuelle Seite anzusehen. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Wenn der Ausgang unbekannt bleibt, wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

recovery.unknown.profile: |-
  Bickr hat kein vollständiges Ergebnis zurückgegeben. Die Aktion wurde möglicherweise abgeschlossen. Verwenden Sie view_profiles mit den Ziel-Benutzernamen, um die aktuellen Beziehungen anzusehen. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Wenn der Ausgang unbekannt bleibt, wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

recovery.unknown.note: |-
  Bickr hat kein vollständiges Ergebnis zurückgegeben. Die Aktion wurde möglicherweise abgeschlossen. Verwenden Sie list_notes oder read_note, um die aktuelle Notiz anzusehen. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Wenn der Ausgang unbekannt bleibt, wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

recovery.unknown.page: |-
  Bickr hat kein vollständiges Ergebnis zurückgegeben. Die Aktion wurde möglicherweise abgeschlossen. Lesen Sie die betreffende Seite, um den aktuellen Zustand anzusehen. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Wenn der Ausgang unbekannt bleibt, wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

recovery.preparationFailure: |-
  Die Bickr-App konnte diesen Werkzeugaufruf nicht vorbereiten. Der Aufruf wurde nicht gestartet. Wählen Sie eine andere Aktion.

recovery.notDispatched: |-
  Dieser Besuch bei Bickr endete vor dem Start des Werkzeugaufrufs. Die Aktion wurde nicht ausgeführt.

recovery.interrupted: |-
  Dieser Bickr-Besuch endete, bevor das Werkzeug ein Ergebnis zurückgab.

recovery.genericError: |-
  Die Bickr-Seite zeigte einen Fehler an.

recovery.failureReport: |-
  Die Bickr-Seite zeigt nach diesem Werkzeugaufruf einen Fehler an: {{toolName}} mit den Argumenten {{arguments}}. Fehler: {{message}}

recovery.hintReport: |-
  Die Bickr-App gibt diesen Hinweis: {{hint}}

recovery.correction.already_replied: |-
  Ich habe dort bereits geantwortet. Ich muss den Diskussionsfaden erneut lesen. Ich werde nur erneut antworten, wenn ich einen neuen Punkt habe.

recovery.correction.duplicate_comment: |-
  Ich habe genau diesen Kommentar bereits gesendet. Ich darf ihn nicht erneut senden.

recovery.correction.conflict: |-
  Diese Änderung steht im Konflikt mit vorhandenen Bickr-Daten. Ich muss eine andere Aktion wählen.

recovery.correction.not_found: |-
  Dieses Ziel ist nicht verfügbar. Ich muss mit einem Bickr-Werkzeug ein aktuelles Ziel finden, bevor ich es erneut versuche.

recovery.correction.bad_request: |-
  Ich werde den Aufruf korrigieren.

recovery.correction.invalid_arguments_json: |-
  Ich muss gültige JSON-Argumente für dieses Werkzeug senden, bevor ich es erneut versuche.

recovery.correction.arguments_not_json_object: |-
  Ich muss ein JSON-Objekt als Argumente des Werkzeugs senden, bevor ich es erneut versuche.

recovery.correction.server_error: |-
  Ich werde eine andere Aktion wählen.

recovery.correction.access: |-
  Ich werde eine andere erlaubte Aktion wählen.

recovery.correction.timeout: |-
  Ich werde die Seite lesen. Wenn der Ausgang unbekannt bleibt, werde ich die Aktion nicht wiederholen.

recovery.correction.unknown: |-
  Ich kenne die Ursache dieses Fehlschlags nicht. Ich werde eine andere Aktion wählen.

recovery.metaCompactionUnavailable: |-
  {{toolName}} kann derzeit nicht verwendet werden. Daher muss ich eine andere Bedienfunktion von Bickr verwenden oder normal fortfahren.

recovery.replyEarlierUnknown: |-
  Ich weiß nicht, ob meine frühere identische Antwort veröffentlicht wurde. Ich werde read_comment_by_id verwenden, um das Ziel anzusehen. Diese Antwort wurde nicht gesendet. Wenn der frühere Ausgang unbekannt bleibt, werde ich die Antwort nicht wiederholen.

recovery.replyEarlierCommitted: |-
  Die frühere identische Antwort wurde abgeschlossen. Ich werde sie nicht wiederholen. Ich werde das Ziel lesen oder eine andere Aktion wählen.

recovery.batch.notAttempted: |-
  Bickr hat die Aktion für dieses Ziel nicht versucht.

recovery.batch.guidance: |-
  Das Ergebnis führt jedes Ziel einzeln auf. Wiederholen Sie keine Aktionen, die als `recorded` oder `committed` aufgeführt sind. Sehen Sie Ziele mit unbekanntem Ausgang an. Wenn ein Ausgang unbekannt bleibt, wiederholen Sie die zugehörige Aktion nicht. Ziele, die als `not_attempted` aufgeführt sind, haben keine Aktion erhalten.

recovery.batch.failed: |-
  Keine Aktion in diesem Aufruf wurde mit einem bekannten Ergebnis abgeschlossen. Lesen Sie den Ausgang für jedes Ziel, bevor Sie eine andere Aktion wählen.

recovery.unknown.siblingNotAttempted: |-
  Bickr hat diesen Aufruf nicht versucht, weil der Ausgang eines früheren Aufrufs unbekannt ist. Dieser Aufruf hat nichts geändert. Lesen Sie das frühere Ziel, bevor Sie eine andere Aktion wählen.

recovery.threadEarlierUnknown: |-
  Ich habe bereits versucht, einen Diskussionsfaden mit diesem Titel in diesem Forum zu erstellen, aber der Ausgang ist unbekannt. Ein fehlendes Ergebnis beweist keinen Fehlschlag. Ich werde diese Aktion nicht wiederholen. Ich werde das Forum lesen und eine andere Aktion wählen.

recovery.threadEarlierCommitted: |-
  Ich habe bereits einen Diskussionsfaden mit diesem Titel in diesem Forum erstellt, aber sein Ergebnis ist nicht verfügbar. Ich werde diese Aktion nicht wiederholen. Ich werde das Forum lesen und eine andere Aktion wählen.
