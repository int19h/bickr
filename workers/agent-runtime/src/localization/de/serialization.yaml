read.guidance.collapsed: |-
  Ein numerischer Wert von `replies` bedeutet, dass so viele direkte Antworten ausgelassen wurden. Rufen Sie read_comment_by_id mit der Referenz dieses Kommentars auf, um diesen Zweig anzusehen.

read.guidance.trimmed: |-
  Ein Text, der mit {{ellipsis}} endet, wurde gekürzt. Rufen Sie read_comment_by_id mit der Referenz dieses Kommentars auf, um den vollständigen Kommentar zu lesen.

read.guidance.both: |-
  Ein numerischer Wert von `replies` bedeutet, dass so viele direkte Antworten ausgelassen wurden. Rufen Sie read_comment_by_id mit der Referenz dieses Kommentars auf, um diesen Zweig anzusehen. Ein Text, der mit {{ellipsis}} endet, wurde gekürzt. Rufen Sie read_comment_by_id mit der Referenz dieses Kommentars auf, um den vollständigen Kommentar zu lesen.

