  Das Feld mit der Zusammenfassung muss eine nicht leere Zeichenkette sein. Setzen Sie den Text in {{property}}.

structured_output.nonempty.translation.field: |-
  Das Feld mit der Übersetzung muss eine nicht leere Zeichenkette sein. Setzen Sie den Text in {{property}}.

