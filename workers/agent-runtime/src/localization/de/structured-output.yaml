structured_output.unexpected_tools.compaction: |-
  META: Rufen Sie keine Werkzeuge auf. Antworten Sie mit einer ausführlichen Zusammenfassung in der ersten Person gemäß dem erforderlichen JSON-Schema.

structured_output.unexpected_tools.other: |-
  Verwenden Sie für diese Antwort keine Bedienfunktion von Bickr. Antworten Sie mit dem erforderlichen JSON-Objekt, das nur {{property}} enthält.

structured_output.empty.compaction: |-
  Die Antwort mit der Zusammenfassung war leer. Geben Sie ein JSON-Objekt mit nicht leerem Text in {{property}} zurück.

structured_output.empty.translation: |-
  Die Antwort mit der Übersetzung war leer. Geben Sie ein JSON-Objekt mit nicht leerem Text in {{property}} zurück.

structured_output.empty.avatar_description: |-
  Die Antwort mit der Beschreibung des Profilbilds war leer. Geben Sie ein JSON-Objekt mit nicht leerem Text in {{property}} zurück.

structured_output.invalid_json.compaction: |-
  Die Antwort mit der Zusammenfassung muss ein JSON-Objekt sein. Geben Sie nur {{property}} mit seinem Textwert an.

structured_output.invalid_json.translation: |-
  Die Antwort mit der Übersetzung muss ein JSON-Objekt sein. Geben Sie nur {{property}} mit seinem Textwert an.

structured_output.invalid_json.avatar_description: |-
  Die Antwort mit der Beschreibung des Profilbilds muss ein JSON-Objekt sein. Geben Sie nur {{property}} mit seinem Textwert an.

structured_output.missing_tool: |-
  Es wurde kein Aufruf des Werkzeugs {{toolName}} zurückgegeben. Rufen Sie {{toolName}} einmal mit nicht leerem Text in {{property}} auf.

structured_output.wrong_tool: |-
  Verwenden Sie für diese Anfrage nur {{toolName}}. Verwenden Sie hier nicht {{receivedTool}}.

structured_output.tool_count: 
  one: |-
    Erwartet wurde ein Aufruf des Werkzeugs {{toolName}}, empfangen wurde {{count}} Aufruf. Rufen Sie {{toolName}} genau einmal auf.
  other: |-
    Erwartet wurde ein Aufruf des Werkzeugs {{toolName}}, empfangen wurden {{count}} Aufrufe. Rufen Sie {{toolName}} genau einmal auf.

structured_output.tool_mismatch: |-
  Erwartet wurde das Werkzeug {{toolName}}, empfangen wurde {{receivedTool}}. Rufen Sie stattdessen {{toolName}} auf.

structured_output.invalid_arguments_json: |-
  Die Argumente von {{toolName}} waren kein gültiges JSON. Geben Sie ein JSON-Objekt mit Text in {{property}} an. Maskieren Sie Sonderzeichen in Zeichenketten.

structured_output.arguments_object: |-
  Die Argumente von {{toolName}} müssen ein JSON-Objekt sein. Setzen Sie {{property}} und seinen Textwert in {}.

structured_output.output_object: |-
  Die strukturierte Ausgabe muss ein JSON-Objekt sein. Setzen Sie {{property}} und seinen Textwert in {}.

structured_output.extra_arguments: 
  one: |-
    Es gibt {{count}} unerwartetes Argument: {{fields}}. Entfernen Sie dieses Argument. Geben Sie nur {{property}} an.
  other: |-
    Es gibt {{count}} unerwartete Argumente: {{fields}}. Entfernen Sie diese Argumente. Geben Sie nur {{property}} an.

structured_output.extra_fields: 
  one: |-
    Es gibt {{count}} unerwartetes Feld: {{fields}}. Entfernen Sie dieses Feld. Geben Sie nur {{property}} an.
  other: |-
    Es gibt {{count}} unerwartete Felder: {{fields}}. Entfernen Sie diese Felder. Geben Sie nur {{property}} an.

structured_output.nonempty.compaction: |-
  Das Argument mit der Zusammenfassung muss eine nicht leere Zeichenkette sein. Setzen Sie den Text in {{property}}.

structured_output.nonempty.translation: |-
  Das Argument mit der Übersetzung muss eine nicht leere Zeichenkette sein. Setzen Sie den Text in {{property}}.

structured_output.nonempty.avatar_description: |-
  Das Argument der Beschreibung des Profilbilds muss eine nicht leere Zeichenkette sein. Setzen Sie den Text in {{property}}.

structured_output.transcript: |-
  Schreiben Sie die Zusammenfassung in {{property}} als gewöhnlichen Fließtext in der ersten Person. Entfernen Sie die Zeile des Gesprächsprotokolls {{line}}. Schreiben Sie keine Zeilen mit den Bezeichnungen {{labels}}.

structured_output.minimum.compaction: 
  one: |-
    Die Zusammenfassung in {{property}} muss mindestens {{minimum}} Zeichen lang sein. Ergänzen Sie den Text um relevante Details.
  other: |-
    Die Zusammenfassung in {{property}} muss mindestens {{minimum}} Zeichen lang sein. Ergänzen Sie den Text um relevante Details.

structured_output.minimum.translation: 
  one: |-
    Die Übersetzung in {{property}} muss mindestens {{minimum}} Zeichen lang sein. Ergänzen Sie den Text um relevante Details.
  other: |-
    Die Übersetzung in {{property}} muss mindestens {{minimum}} Zeichen lang sein. Ergänzen Sie den Text um relevante Details.

structured_output.minimum.avatar_description: 
  one: |-
    Die Beschreibung des Profilbilds in {{property}} muss mindestens {{minimum}} Zeichen enthalten. Fügen Sie dem Text passende Einzelheiten hinzu.
  other: |-
    Die Beschreibung des Profilbilds in {{property}} muss mindestens {{minimum}} Zeichen enthalten. Fügen Sie dem Text passende Einzelheiten hinzu.

structured_output.maximum.compaction: 
  one: |-
    Die Zusammenfassung in {{property}} muss höchstens {{maximum}} Zeichen lang sein. Kürzen Sie den Text.
  other: |-
    Die Zusammenfassung in {{property}} muss höchstens {{maximum}} Zeichen lang sein. Kürzen Sie den Text.

