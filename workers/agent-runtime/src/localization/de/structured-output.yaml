structured_output.wrong_tool.unnamed: |-
  Verwenden Sie für diese Anfrage nur {{toolName}}. Senden Sie keinen Werkzeugaufruf ohne Namen.

structured_output.tool_mismatch.unnamed: |-
  Erwartet wurde das Werkzeug {{toolName}}, empfangen wurde ein Werkzeugaufruf ohne Namen. Rufen Sie stattdessen {{toolName}} auf.

structured_output.nonreducing.estimate: 
  one: |-
    Die Zusammenfassung in {{property}} hat den Kontext nicht verkleinert. Ihre geschätzte Länge beträgt {{replacementTokens}} Token.
  other: |-
    Die Zusammenfassung in {{property}} hat den Kontext nicht verkleinert. Ihre geschätzte Länge beträgt {{replacementTokens}} Token.

structured_output.nonreducing.before: 
  one: |-
    Der Kontext hatte vor dem Ersetzen {{compactedTokens}} Token. Kürzen Sie die Zusammenfassung und behalten Sie dabei die erforderlichen Fakten.
  other: |-
    Der Kontext hatte vor dem Ersetzen {{compactedTokens}} Token. Kürzen Sie die Zusammenfassung und behalten Sie dabei die erforderlichen Fakten.

