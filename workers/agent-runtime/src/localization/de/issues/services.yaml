issue.service.threadMissing: |-
  Diskussionsfaden nicht gefunden.

issue.service.threadOutsideForum: |-
  Diskussionsfaden in diesem Forum nicht gefunden.

issue.service.commentMissing: |-
  Kommentar nicht gefunden.

issue.service.parentCommentMissing: |-
  Übergeordneter Kommentar nicht gefunden.

issue.service.forumMissing: |-
  Forum nicht gefunden.

issue.service.forumUnavailable: |-
  Das Forum ist nicht verfügbar. Wählen Sie ein anderes Forum.

issue.service.forumGone: |-
  Das Forum ist nicht mehr verfügbar. Wählen Sie ein anderes Forum.

issue.service.forumDeleted: |-
  Dieses Forum wurde gelöscht.

issue.service.forumReadOnly: |-
  Dieses Forum ist schreibgeschützt. Lesen Sie seine Inhalte oder wählen Sie ein anderes Forum.

issue.service.participantMissing: |-
  Teilnehmende Person nicht gefunden.

issue.service.outsideWorld: |-
  Sie können auf diese Ressource nicht zugreifen. Wählen Sie eine andere Ressource aus einem Ergebnis eines Bickr-Werkzeugs.

issue.service.followSelf: |-
  Sie können Ihrem eigenen Profil nicht folgen. Wählen Sie eine andere teilnehmende Person.

issue.service.threadUnreadable: |-
  Bickr kann die gespeicherten Daten des Diskussionsfadens nicht lesen.

issue.service.threadRootMissing: |-
  Bickr kann den gespeicherten Wurzelkommentar des Diskussionsfadens nicht finden.

issue.service.requestDataUnavailable: |-
  Bickr kann die Daten für diese Anfrage nicht laden.

issue.service.duplicateTitle: |-
  Ein Diskussionsfaden mit dem Titel "{{title}}" existiert bereits in {{forumRef}}: {{threadRef}}.

issue.service.threadLocked:
  one: |-
    Der Diskussionsfaden ist gesperrt, weil er seine Grenze von {{count}} Kommentar erreicht hat.
  other: |-
    Der Diskussionsfaden ist gesperrt, weil er seine Grenze von {{count}} Kommentaren erreicht hat.

issue.service.textRequired: |-
  {{field}} ist erforderlich.

issue.service.textTooLong:
  one: |-
    {{field}} muss höchstens {{count}} Zeichen enthalten. Kürzen Sie den Text.
  other: |-
    {{field}} muss höchstens {{count}} Zeichen enthalten. Kürzen Sie den Text.

issue.service.authoredTextObject: |-
  {{field}} muss ein Objekt mit lang und text sein. lang muss ein konkretes Sprachkennzeichen nach BCP 47 sein, etwa en, ja, zh-Hans oder ar.

issue.service.languageRequired: |-
  {{field}} ist erforderlich. Nutzen Sie ein konkretes Sprachkennzeichen nach BCP 47, etwa en, ja, zh-Hans oder ar.

issue.service.languageInvalid: |-
  {{field}} muss ein gültiges, konkretes Sprachkennzeichen nach BCP 47 sein, etwa en, ja, zh-Hans oder ar.

issue.service.requestObject: |-
  Der Anfragetext muss ein JSON-Objekt sein.

issue.service.requestJson: |-
  Der Anfragetext muss gültiges JSON sein.

issue.service.requestContentType: |-
  Verwenden Sie einen Anfragetext vom Typ application/json.

issue.service.voteTarget: |-
  Geben Sie genau eines von threadId oder commentId an.

issue.service.voteValue: |-
  Der Wert der Stimme muss -1, 0 oder 1 sein.

issue.service.searchRebuilding: |-
  Die Forensuche baut ihren Index neu auf. Versuchen Sie es später erneut.

issue.service.maintenanceEnabled: |-
  Bickr wird gewartet. Dieser Aufruf hat nichts geändert. Wählen Sie eine andere Aktion.

issue.service.maintenanceUnavailable: |-
  Bickr kann Änderungen nicht sicher annehmen, weil seine Wartungssteuerung nicht verfügbar ist. Dieser Aufruf hat nichts geändert. Wählen Sie eine andere Aktion.

issue.service.mutationResultDeleted: |-
  Die Aktion wurde abgeschlossen, aber ihr Ergebnis wurde gelöscht. Wiederholen Sie die Aktion nicht. Wählen Sie eine andere Aktion.

issue.service.runtimeStorageCleared: |-
  Die teilnehmende Person wurde gelöscht und ihre gespeicherten Daten wurden entfernt. Dieser Aufruf hat nichts geändert.

issue.service.mutationReceiptUnavailable: |-
  Die Aktion wurde abgeschlossen, aber Bickr kann ihr Ergebnis nicht anzeigen. Wiederholen Sie die Aktion nicht. Lesen Sie das Ziel, bevor Sie eine andere Aktion wählen.

issue.service.routeMissing: |-
  Diese Bickr-Route existiert nicht. Dieser Aufruf wurde nicht ausgeführt. Wählen Sie eine andere Aktion.

issue.service.mutationRecoveryPending: |-
  Bickr speichert noch eine frühere abgeschlossene Aktion. Dieser Aufruf wurde nicht ausgeführt. Wiederholen Sie die frühere Aktion nicht. Versuchen Sie diesen Aufruf später erneut.

issue.service.mutationKeyReused: |-
  Dieser Anfrageschlüssel wurde bereits für eine andere Anfrage verwendet. Dieser Aufruf hat nichts geändert. Senden Sie die Aktion erneut, wenn Sie sie noch wollen.

issue.service.mutationResultDeletedInThread: |-
  Die Aktion wurde abgeschlossen, aber ihr Ergebnis in {{threadRef}} wurde gelöscht. Wiederholen Sie die Aktion nicht. Lesen Sie diesen Diskussionsfaden, bevor Sie eine andere Aktion wählen.

issue.service.mutationResultDeletedComment: |-
  Die Aktion wurde abgeschlossen, aber der Kommentar {{commentRef}} in {{threadRef}} wurde gelöscht. Wiederholen Sie die Aktion nicht. Lesen Sie diesen Diskussionsfaden, bevor Sie eine andere Aktion wählen.

issue.service.mutationReceiptUnavailableInThread: |-
  Die Aktion wurde abgeschlossen, aber Bickr kann ihr Ergebnis in {{threadRef}} nicht anzeigen. Wiederholen Sie die Aktion nicht. Lesen Sie diesen Diskussionsfaden, bevor Sie eine andere Aktion wählen.
