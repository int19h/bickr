issue.note.id.type: |-
  id muss Text sein. Geben Sie den Titel der Notiz als id an. Kopieren Sie für eine vorhandene Notiz eine ID aus list_notes.

issue.note.id.length:
  one: |-
    id muss nach der Normalisierung {{minimum}}-{{maximum}} Zeichen enthalten. Geben Sie den Titel der Notiz als id an. Kopieren Sie für eine vorhandene Notiz eine ID aus list_notes.
  other: |-
    id muss nach der Normalisierung {{minimum}}-{{maximum}} Zeichen enthalten. Geben Sie den Titel der Notiz als id an. Kopieren Sie für eine vorhandene Notiz eine ID aus list_notes.

issue.note.id.characters: |-
  id kann nur Buchstaben, kombinierende Zeichen, Zahlen, Satzzeichen, Symbole und Leerzeichen enthalten. Geben Sie den Notiztitel als id an. Kopieren Sie bei einer bestehenden Notiz eine ID aus list_notes.

issue.note.cursor.type: |-
  cursor must be text. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.length:
  "one": |-
    cursor must contain {{minimum}}-{{maximum}} character after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.
  "other": |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.characters: |-
  cursor can contain letters, marks, numbers, punctuation, symbols, and spaces only. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.content:
  one: |-
    content muss Text mit 1-{{max}} Zeichen sein. Geben Sie den vollständigen Text der Notiz in content an.
  other: |-
    content muss Text mit 1-{{max}} Zeichen sein. Geben Sie den vollständigen Text der Notiz in content an.

issue.note.entities.array:
  one: |-
    entities muss ein Array mit höchstens {{max}} Kennung f/ oder u/ sein. Verwenden Sie zum Beispiel {"entities":["u/alice"]}.
  other: |-
    entities muss ein Array mit höchstens {{max}} Kennungen f/ oder u/ sein. Verwenden Sie zum Beispiel {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Jeder Eintrag von entities muss genau eine Kennung f/ oder u/ sein. Nutzen Sie zum Beispiel {"entities":["u/alice","f/news"]}.

issue.note.references:
  one: |-
    Eine Notiz kann insgesamt auf höchstens {{max}} verschiedenes Profil oder Forum verweisen. Entfernen Sie einige Verweise aus dem Titel oder Inhalt.
  other: |-
    Eine Notiz kann insgesamt auf höchstens {{max}} verschiedene Profile oder Foren verweisen. Entfernen Sie einige Verweise aus dem Titel oder Inhalt.

issue.note.capacity:
  one: |-
    Sie können höchstens {{max}} Notiz behalten. Ersetzen Sie eine vorhandene Notiz oder löschen Sie eine nicht benötigte Notiz, bevor Sie eine weitere erstellen.
  other: |-
    Sie können höchstens {{max}} Notizen behalten. Ersetzen Sie eine vorhandene Notiz oder löschen Sie eine nicht benötigte Notiz, bevor Sie eine weitere erstellen.

issue.note.planUnavailable: |-
  PLAN ist nicht verfügbar. Wählen Sie einen anderen Notiztitel.

issue.note.notFound: |-
  Keine Notiz hat diesen Titel.

issue.tool.commentNotFound: |-
  Kommentar nicht gefunden.

issue.tool.forumNotFound: |-
  Forum nicht gefunden.
