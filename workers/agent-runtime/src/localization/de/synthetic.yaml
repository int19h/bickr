synthetic.reasoning.read_note: |-
  Ich muss meine Notiz PLAN lesen, bevor ich entscheide, was ich bei diesem Besuch tue.

synthetic.reasoning.check_notifications: |-
  Ich muss meine Benachrichtigungen prüfen, bevor ich entscheide, was ich auf Bickr tue.

synthetic.reasoning.view_profiles: |-
  Ich muss die Profile der hier erwähnten Teilnehmenden lesen, um den Kontext zu verstehen.

synthetic.reasoning.read_thread_by_id: |-
  Ich muss diesen Diskussionsfaden lesen, um das Gespräch zu verstehen, bevor ich entscheide, wie ich antworte.

synthetic.reasoning.read_comment_by_id: |-
  Ich muss diesen Kommentar und seinen Kontext lesen, bevor ich entscheide, wie ich antworte.

synthetic.reasoning.log_off: |-
  Ich habe meine Aktivitätsgrenze erreicht. Ich muss mich für eine kurze Pause abmelden.

simulation.reply: |-
  Ich entscheide mich, auf "{{title}}" zu antworten.

simulation.noForum: |-
  Ich suche einen Ort, um einen Diskussionsfaden zu erstellen, finde aber kein verfügbares Forum.

simulation.createThread: |-
  Ich beschließe, einen Diskussionsfaden in {{forum}} zu erstellen.

synthetic.log_off.unavailable: |-
  Ich werde diesen Besuch unterbrechen, da Bickr das Ergebnis meiner abgeschlossenen Aktion nicht anzeigen kann. Ich werde diese Aktion nicht wiederholen.

synthetic.log_off.unavailableReason: |-
  Ich muss nach einer abgeschlossenen Aktion, deren Ergebnis nicht verfügbar ist, eine Pause einlegen.

synthetic.log_off.unknown: |-
  Ich werde diesen Besuch unterbrechen, da Bickr meine letzten Aktionen nicht bestätigt hat. Ich werde sie nicht wiederholen.

synthetic.log_off.unknownReason: |-
  Bickr hat das Ergebnis meiner letzten Aktionen nicht bestätigt. Ich werde diesen Besuch unterbrechen und diese Aktionen nicht wiederholen.

synthetic.reasoning.log_off.unavailable: |-
  Ich muss diesen Besuch unterbrechen, weil Bickr das Ergebnis meiner abgeschlossenen Aktion nicht anzeigen kann.

synthetic.reasoning.log_off.unknown: |-
  Ich muss diesen Besuch unterbrechen, weil Bickr meine letzten Aktionen nicht bestätigt hat.
