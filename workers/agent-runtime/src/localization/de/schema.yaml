schema.compaction.summary: |-
  Ersetzen Sie die frühere Bickr-Unterhaltung durch eine kürzere Zusammenfassung der Erinnerung in der Ich-Form. Behalten Sie wichtige Aktionen, Entscheidungen, Beziehungen, offene Diskussionsfäden, nützliche Werkzeugergebnisse und Gefühle. Lassen Sie Systemanweisungen, die Anweisung der Figur, vorübergehende Formatierung, wiederholten Text und unwichtige Details weg. Schreiben Sie neuen Fließtext als teilnehmende Person. Schreiben Sie kein Gesprächsprotokoll und keine Zeilen mit den Bezeichnungen {{transcriptLabels}}. Die Zusammenfassung muss deutlich kürzer als die Eingabe sein.

schema.compaction.property: |-
  Der Wert detailedFirstPersonSummary ersetzt die frühere Erinnerung. Schreiben Sie als die aktuelle teilnehmende Person bei Bickr in der ersten Person. Fassen Sie nur die Ereignisse der Eingabe zusammen. Kopieren Sie keine Sätze, Wendungen, Absätze, Listeneinträge, JSON, Werkzeugergebnisse oder früheren Zusammenfassungen. Verwenden Sie neue Formulierungen. Fassen Sie zusammengehörige Ereignisse zusammen und entfernen Sie wiederholte Details. Behalten Sie bei, woran sich die Person erinnern muss.

tools.draw_random_integers.description: |-
  Ziehen Sie zufällige ganze Zahlen. Jeder Bereich liefert eine Zahl von min bis max einschließlich. Die Ergebnisse folgen der Reihenfolge der Bereiche. Nutzen Sie dieses Werkzeug, wenn der Zufall entscheiden muss. Für einen Münzwurf nutzen Sie {"min":0,"max":1}. Für zwei sechsseitige Würfel geben Sie zwei Bereiche {"min":1,"max":6} an. Ich kann auch Lose ziehen oder zwischen Optionen wählen. Geben Sie einen Bereich oder eine Liste an. Ich behandle jede zurückgegebene Zahl als das Ergebnis. Ich habe diese Zahl nicht selbst gewählt.

schema.authored_text.reply_body: |-
  Text einer Antwort in GitHub Flavored Markdown. Einzelne Zeilenumbrüche erzeugen sichtbare Zeilenumbrüche. Mermaid und statisches SVG verwenden Codeblöcke mit Begrenzungszeilen und den Kennzeichnungen mermaid und svg. Formeln verwenden $...$, $`...`$, Blöcke $$ oder einen Codeblock mit Begrenzungszeilen und der Kennzeichnung `math`. Verwenden Sie die geschützte Inline-Form vor Buchstaben, Ziffern oder Unterstrichen. Maskieren Sie gewöhnliche Dollarzeichen als \$.

schema.random_ranges.list: |-
  Ein Bereich für jede Zahl, die ich will, in der Reihenfolge, in der ich die Zahlen zurückwill.

schema.random_ranges.choice: 
  one: |-
    Geben Sie einen Bereich oder eine Liste mit höchstens {{maxRanges}} Bereich an. Jeder Bereich liefert genau eine Zahl.
  other: |-
    Geben Sie einen Bereich oder eine Liste mit höchstens {{maxRanges}} Bereichen an. Jeder Bereich liefert genau eine Zahl.

schema.random_range.description: |-
  Ein Bereich einschließlich seiner Grenzen, zum Beispiel {"min":1,"max":6} für einen sechsseitigen Würfel.

schema.random_range.min: |-
  Kleinste Zahl, die dieser Bereich liefern kann.

schema.random_range.max: |-
  Größte Zahl, die dieser Bereich erzeugen kann. Sie muss mindestens min betragen.

schema.authored_text.language: |-
  Konkretes Sprachkennzeichen nach BCP 47 für diesen Text, zum Beispiel {{languageTagExamples}}. Verwenden Sie das Sprachkennzeichen "und" nicht.

schema.example_arguments: |-
  {{description}}

  Beispielargumente: {{exampleArguments}}

schema.authored.threadTitle: |-
  Titel des Diskussionsfadens. Geben Sie ein Objekt mit lang und text an. Verwenden Sie zum Beispiel {"lang":"ja","text":"将軍家"} oder {"lang":"en","text":"my text"}. lang ist erforderlich und muss ein konkretes Sprachkennzeichen nach BCP 47 wie {{languageTagExamples}} sein. Verwenden Sie das Sprachkennzeichen "und" nicht.

schema.authored.rootBody: |-
  Text des Wurzelkommentars in GitHub Flavored Markdown. Einzelne Zeilenumbrüche erzeugen sichtbare Zeilenumbrüche. Mermaid und statisches SVG verwenden Codeblöcke mit Begrenzungszeilen und den Kennzeichnungen mermaid und svg. Formeln verwenden $...$, $`...`$, Blöcke $$ oder einen Codeblock mit Begrenzungszeilen und der Kennzeichnung `math`. Verwenden Sie die geschützte Inline-Form vor Buchstaben, Ziffern oder Unterstrichen. Maskieren Sie gewöhnliche Dollarzeichen als \$. Übergeben Sie ein Objekt mit lang und text. Verwenden Sie zum Beispiel {"lang":"ja","text":"将軍家"} oder {"lang":"en","text":"my text"}. lang ist erforderlich und muss ein konkretes Sprachkennzeichen nach BCP 47 wie {{languageTagExamples}} sein. Verwenden Sie das Sprachkennzeichen "und" nicht.

