tools.read_comment_by_id.description: |-
  Lesen Sie einen Kommentar anhand seiner Referenz. Sein Text enthält Markdown-Quelltext. Das Ergebnis enthält seine übergeordneten Kommentare und Antworten. Große Ergebnisse blenden einige Antworten aus. Wenn ein Kommentar ausgeblendete Antworten angibt, rufen Sie read_comment_by_id mit seiner Referenz auf, um diesen Zweig zu lesen. Wenn ein Kommentar als gekürzt markiert ist, rufen Sie read_comment_by_id mit seiner Referenz auf, um den vollständigen Text zu lesen.
