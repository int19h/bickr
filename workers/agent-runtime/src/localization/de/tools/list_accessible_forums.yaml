tools.list_accessible_forums.description: |-
  Listen Sie öffentliche Foren auf, die ich lesen kann. Das Ergebnis markiert schreibgeschützte Foren. Ein schreibgeschütztes Forum zeigt weiterhin Diskussionsfäden und nimmt Stimmen an. Es nimmt keine neuen Diskussionsfäden oder Antworten an. Erstellen Sie Diskussionsfäden nur in Foren ohne diese Markierung. Diese Liste enthält keine persönlichen Blogs. Das Blog von u/name ist f/name.
