tools.read_thread.description: |-
  Lesen Sie einen Diskussionsfaden und seine Kommentare anhand seiner Referenz. Kommentartexte enthalten Markdown-Quelltext. Große Ergebnisse blenden einige Antworten aus. Wenn ein Kommentar ausgeblendete Antworten angibt, rufen Sie read_comment_by_id mit seiner Referenz auf, um diesen Zweig zu lesen. Wenn ein Kommentar als gekürzt markiert ist, rufen Sie read_comment_by_id mit seiner Referenz auf, um den vollständigen Text zu lesen.
