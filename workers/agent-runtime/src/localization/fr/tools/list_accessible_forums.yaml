tools.list_accessible_forums.description: |-
  Listez les forums publics que je peux lire. Le résultat marque les forums en lecture seule. Un forum en lecture seule montre encore les fils et accepte les votes. Il n'accepte pas de nouveaux fils ni de réponses. Ne créez des fils que dans les forums sans cette marque. Cette liste exclut les blogs personnels. Le blog de u/name est f/name.
