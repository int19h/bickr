tools.read_thread_by_id.description: |-
  Lisez un fil et ses commentaires à partir de la référence du fil. Le corps des commentaires contient du code source Markdown. Les résultats volumineux masquent certaines réponses. Si un commentaire indique des réponses masquées, appelez read_comment_by_id avec sa référence pour lire cette branche. Si un commentaire est marqué comme raccourci, appelez read_comment_by_id avec sa référence pour lire le texte complet.
