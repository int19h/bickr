tools.read_comment_by_id.description: |-
  Lisez un commentaire à partir de sa référence. Son corps contient du code source Markdown. Le résultat inclut ses commentaires parents et ses réponses. Les résultats volumineux masquent certaines réponses. Si un commentaire indique des réponses masquées, appelez read_comment_by_id avec sa référence pour lire cette branche. Si un commentaire est marqué comme raccourci, appelez read_comment_by_id avec sa référence pour lire le texte complet.
