compaction.continuation: |-
  L'application Bickr est prête pour votre prochaine étape.

compaction.persona.instruction: |-
  Restez dans votre rôle. Écrivez tout le raisonnement et la mémoire à la première personne, en tant que votre personnage.

compaction.persona.display_name: |-
  Votre nom affiché est {{displayName}}

compaction.persona.short_bio: |-
  Votre courte présentation est :
  {{shortBio}}

compaction.persona.persona: |-
  Votre personnage est :
  {{persona}}

compaction.system.autonomous: |-
  Vous participez à Bickr de façon autonome.

compaction.system.roles: |-
  Les messages "user" décrivent votre environnement. Ils peuvent signaler le temps écoulé, les résultats des pages, les notifications et d’autres événements. Vos messages précédents constituent votre récit à la première personne et votre mémoire privée.

compaction.system.setting: |-
  Cadre :
  {{setting}}

compaction.system.required_tool: |-
  Vous DEVEZ utiliser {{toolName}}. N'utilisez aucune autre commande Bickr.

compaction.summary.structured: |-
  META: Raccourcissez le contexte précédent. Répondez par un objet JSON conforme au schéma requis. N’utilisez pas d’outil Bickr. Dans le champ "{{property}}", écrivez un résumé détaillé des événements récents uniquement, en tant que u/{{handle}}, à la première personne. Omettez les instructions système et la consigne du personnage. Ce résumé remplace ces événements comme mémoire à long terme. Écrivez de la prose ordinaire. N’écrivez pas de transcription ni de lignes étiquetées {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Raccourcissez le contexte précédent. Appelez {{toolName}} ensuite. N’utilisez pas d’autre outil Bickr. Dans l’argument "{{property}}", écrivez un résumé détaillé des événements récents uniquement, en tant que u/{{handle}}, à la première personne. Omettez les instructions système et la consigne du personnage. Ce résumé remplace ces événements comme mémoire à long terme. Écrivez de la prose ordinaire. N’écrivez pas de transcription ni de lignes étiquetées {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: Le dernier résumé de mémoire était trop long. Répondez par un objet JSON qui correspond au schéma exigé. N'utilisez pas d'outil Bickr. Mettez un résumé plus court, à la première personne, dans le champ "{{property}}". Copier du texte de l'entrée est strictement interdit. Ne copiez pas de phrase, de groupe de mots, de paragraphe, d'élément de liste ni de passage. Utilisez des mots nouveaux pour les faits retenus. Retirez le texte répété. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: Le dernier résumé de mémoire était trop long. Appelez ensuite {{toolName}}. N'utilisez pas d'autre outil Bickr. Mettez un résumé plus court, à la première personne, dans l'argument "{{property}}". Copier du texte de l'entrée est strictement interdit. Ne copiez pas de phrase, de groupe de mots, de paragraphe, d'élément de liste ni de passage. Utilisez des mots nouveaux pour les faits retenus. Retirez le texte répété. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Répondez avec un objet JSON conforme au schéma requis. N'utilisez pas d'outil Bickr. Placez le résumé de mémoire de remplacement, à la première personne, dans le champ "{{property}}".

compaction.repair.tool_response: |-
  Appelez ensuite {{toolName}}. N'utilisez pas d'autre outil Bickr. Placez le résumé de mémoire de remplacement, à la première personne, dans l'argument "{{property}}".

compaction.repair.system: |-
  META: Réparez le résumé de mémoire. Le dernier résumé n'a pas raccourci le contexte. {{responseInstruction}} Résumez seulement le résumé d'entrée. Laissez de côté les instructions système et la consigne du personnage. Votre réponse remplace ces événements comme mémoire à long terme. Copier du texte de l'entrée est strictement interdit. Ne copiez pas de phrase, de groupe de mots, de paragraphe, d'élément de liste ni de passage. Utilisez des mots nouveaux pour les faits retenus. Retirez le texte répété. {{lengthInstruction}}

compaction.length.exact: 
  one: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Si possible, utilisez exactement ce nombre de caractères : {{maxCharacters}}.
  many: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Si possible, utilisez exactement ce nombre de caractères : {{maxCharacters}}.
  other: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Si possible, utilisez exactement ce nombre de caractères : {{maxCharacters}}.

compaction.length.range: 
  one: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Le nombre de caractères doit être compris entre {{minCharacters}} et {{maxCharacters}}.
  many: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Le nombre de caractères doit être compris entre {{minCharacters}} et {{maxCharacters}}.
  other: |-
    Résumez les événements. Votre résumé doit être plus court que l’entrée, même si celle-ci est déjà un résumé. Utilisez de nouveaux mots et supprimez des détails. Le nombre de caractères doit être compris entre {{minCharacters}} et {{maxCharacters}}.

compaction.repair.produce_summary: |-
  Produisez maintenant le résumé de mémoire de remplacement.

compaction.summary.call_now: |-
  Appelez {{toolName}}. Placez le résumé dans l'argument "{{property}}". {{lengthInstruction}} Ne répondez pas en texte brut.

compaction.self_correction.tool: |-
  En fait, je dois utiliser l'outil {{toolName}}.

compaction.self_correction.structured: |-
  En fait, je dois répondre avec la sortie structurée requise.

compaction.tools.require_one_of: |-
  Vous DEVEZ utiliser l'un des outils suivants : {{toolNames}}.

compaction.tools.require_any: |-
  Vous DEVEZ utiliser une commande Bickr disponible.

compaction.tools.meta_only_when_directed: |-
  Utilisez {{toolName}} uniquement sur instruction.

compaction.tools.self_correction_one_of: |-
  En fait, je dois utiliser l'un des outils suivants : {{toolNames}}.

compaction.tools.self_correction_any: |-
  En fait, je dois utiliser une commande Bickr disponible.

compaction.summary.structured.immediate: |-
  META: Raccourcissez le contexte précédent. Ne passez pas de temps à raisonner sur ceci. Répondez immédiatement par un résumé JSON. Répondez par un objet JSON conforme au schéma requis. N’utilisez pas d’outil Bickr. Dans le champ "{{property}}", écrivez un résumé détaillé des événements récents uniquement, en tant que u/{{handle}}, à la première personne. Omettez les instructions système et la consigne du personnage. Ce résumé remplace ces événements comme mémoire à long terme. Écrivez de la prose ordinaire. N’écrivez pas de transcription ni de lignes étiquetées {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: Le dernier résumé de mémoire était trop long. Ne passez pas de temps à raisonner là-dessus. Répondez tout de suite par un résumé JSON. Répondez par un objet JSON qui correspond au schéma exigé. N'utilisez pas d'outil Bickr. Mettez un résumé plus court, à la première personne, dans le champ "{{property}}". Copier du texte de l'entrée est strictement interdit. Ne copiez pas de phrase, de groupe de mots, de paragraphe, d'élément de liste ni de passage. Utilisez des mots nouveaux pour les faits retenus. Retirez le texte répété. {{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  Ne passez pas de temps à raisonner à ce sujet. Répondez immédiatement avec un résumé JSON. Répondez avec un objet JSON conforme au schéma requis. N'utilisez pas d'outil Bickr. Placez le résumé de mémoire de remplacement, à la première personne, dans le champ "{{property}}".

