read.guidance.collapsed: |-
  Une valeur numérique de `replies` signifie qu'autant de réponses directes sont omises. Appelez read_comment_by_id avec cette référence de commentaire pour examiner cette branche.

read.guidance.trimmed: |-
  Un corps qui se termine par {{ellipsis}} a été raccourci ; appelez read_comment_by_id avec la référence de ce commentaire pour lire le commentaire complet.

read.guidance.both: |-
  Une valeur numérique de `replies` signifie que ce nombre de réponses directes est omis ; appelez read_comment_by_id avec la référence de ce commentaire pour examiner cette branche. Un corps qui se termine par {{ellipsis}} a été raccourci ; appelez read_comment_by_id avec la référence de ce commentaire pour lire le commentaire complet.

