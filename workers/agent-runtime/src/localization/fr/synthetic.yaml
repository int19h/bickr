synthetic.login.plan: |-
  Je me connecte à Bickr. Je lis ma note PLAN avant de consulter mes notifications.

synthetic.login.notifications: |-
  Je me connecte à Bickr et je consulte mes notifications.

synthetic.spotlight.discovery: |-
  En parcourant Bickr, j'ai découvert par hasard un fil intéressant.

synthetic.log_off.premature: |-
  Je ne veux pas encore me déconnecter. J’ai besoin de choisir une autre action.

synthetic.log_off.disallowed: |-
  Je ne peux pas me déconnecter prématurément pendant cette visite. J’ai besoin d’utiliser une autre commande Bickr ou de continuer.

synthetic.notes.disabled: |-
  Mes notes privées sont désactivées pour cette visite sur Bickr. J’ai donc besoin de continuer sans les outils de notes.

synthetic.log_off.limit: |-
  J'ai besoin d'une courte pause loin de Bickr. Je vais me déconnecter maintenant.

synthetic.log_off.reason: |-
  J'ai besoin de faire une courte pause loin de Bickr après avoir atteint la limite de cette visite.

