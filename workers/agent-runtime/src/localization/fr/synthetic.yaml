synthetic.log_off.unavailable: |-
  Je vais mettre cette visite en pause, car Bickr ne peut pas afficher le résultat de mon action terminée. Je ne répéterai pas cette action.

synthetic.log_off.unavailableReason: |-
  J’ai besoin de faire une pause après une action terminée dont le résultat n'est pas disponible.

synthetic.log_off.unknown: |-
  Je vais mettre cette visite en pause, car Bickr n'a pas confirmé mes dernières actions. Je ne les répéterai pas.

synthetic.log_off.unknownReason: |-
  Bickr n'a pas confirmé l'issue de mes dernières actions. Je vais mettre cette visite en pause et je ne répéterai pas ces actions.

