structured_output.unexpected_tools.compaction: |-
  META: N’appelez pas d’outils. Répondez par un résumé détaillé à la première personne conforme au schéma JSON requis.

structured_output.unexpected_tools.other: |-
  N'utilisez pas de commande Bickr pour cette réponse. Répondez avec l'objet JSON requis contenant uniquement {{property}}.

structured_output.empty.compaction: |-
  La réponse de résumé était vide. Renvoyez un objet JSON avec un texte non vide dans {{property}}.

structured_output.empty.translation: |-
  La réponse de traduction était vide. Renvoyez un objet JSON avec un texte non vide dans {{property}}.

structured_output.empty.avatar_description: |-
  La réponse de description de l'image de profil était vide. Renvoyez un objet JSON avec un texte non vide dans {{property}}.

structured_output.invalid_json.compaction: |-
  La réponse de résumé doit être un objet JSON. Donnez uniquement {{property}} avec sa valeur textuelle.

structured_output.invalid_json.translation: |-
  La réponse de traduction doit être un objet JSON. Donnez uniquement {{property}} avec sa valeur textuelle.

structured_output.invalid_json.avatar_description: |-
  La réponse de description de l'image de profil doit être un objet JSON. Donnez uniquement {{property}} avec sa valeur textuelle.

structured_output.missing_tool: |-
  Aucun appel à l’outil {{toolName}} n’a été renvoyé. Appelez {{toolName}} une fois avec un texte non vide dans {{property}}.

structured_output.wrong_tool: |-
  Utilisez uniquement {{toolName}} pour cette requête. N'utilisez pas {{receivedTool}} ici.

structured_output.tool_count: 
  one: |-
    Un appel à l’outil {{toolName}} était attendu, mais le nombre d’appels reçus est {{count}}. Appelez {{toolName}} exactement une fois.
  many: |-
    Un appel à l’outil {{toolName}} était attendu, mais le nombre d’appels reçus est {{count}}. Appelez {{toolName}} exactement une fois.
  other: |-
    Un appel à l’outil {{toolName}} était attendu, mais le nombre d’appels reçus est {{count}}. Appelez {{toolName}} exactement une fois.

structured_output.tool_mismatch: |-
  L'outil {{toolName}} était attendu, mais {{receivedTool}} a été reçu. Appelez plutôt {{toolName}}.

structured_output.invalid_arguments_json: |-
  Les arguments de {{toolName}} n'étaient pas du JSON valide. Donnez un objet JSON avec du texte dans {{property}}. Échappez les caractères spéciaux dans les chaînes.

structured_output.arguments_object: |-
  Les arguments de {{toolName}} doivent être un objet JSON. Placez {{property}} et sa valeur textuelle à l'intérieur de {}.

structured_output.output_object: |-
  La sortie structurée doit être un objet JSON. Placez {{property}} et sa valeur textuelle à l'intérieur de {}.

