read.guidance.collapsed: |-
  Числовое значение `replies` означает, что столько прямых ответов не показано. Вызовите read_comment_by_id со ссылкой ref на этот комментарий, чтобы просмотреть ветку.

read.guidance.trimmed: |-
  Текст, который заканчивается на {{ellipsis}}, сокращён. Вызовите read_comment_by_id со ссылкой ref на этот комментарий, чтобы прочитать его целиком.

