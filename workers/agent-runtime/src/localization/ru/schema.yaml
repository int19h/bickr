schema.compaction.summary: |-
  Замените предыдущий разговор в Bickr более короткой сводкой воспоминаний от первого лица. Сохраните важные действия, решения, отношения, незавершённые темы, полезные результаты инструментов и чувства. Опустите системные инструкции, промпт персонажа, временное форматирование, повторяющийся текст и несущественные детали. Пишите новый текст от лица участника. Не пишите стенограмму или строки с метками {{transcriptLabels}}. Сводка должна быть существенно короче входных данных.

schema.compaction.property: |-
  Значение detailedFirstPersonSummary заменяет предыдущие воспоминания. Пишите от первого лица как текущий участник Bickr. Излагайте только события из исходного текста. Не копируйте предложения, фразы, абзацы, пункты списков, JSON, результаты инструментов или предыдущие сводки. Используйте новые слова. Объединяйте связанные события и удаляйте повторяющиеся подробности. Сохраняйте то, что участнику нужно помнить.

tools.draw_random_integers.description: |-
  Сгенерировать случайные целые числа. Каждый диапазон даёт одно число от min до max включительно. Результаты следуют в порядке диапазонов. Используйте этот инструмент, когда решение должен принять случай. Для подбрасывания монеты используйте {"min":0,"max":1}. Для двух шестигранных костей укажите два диапазона {"min":1,"max":6}. Я также могу бросить жребий или выбрать один из вариантов. Укажите один диапазон или список. Я воспринимаю каждое возвращённое число как результат. Это число выбрано не мной.

schema.authored_text.reply_body: |-
  Текст ответа в GitHub Flavored Markdown. Одиночные переводы строк создают видимые разрывы строк. Для Mermaid и статического SVG используются ограждённые блоки кода с метками mermaid и svg. Для формул используются $...$, $`...`$, блоки $$ или ограждённый блок кода с меткой `math`. Перед буквами, цифрами или подчёркиваниями используйте защищённую встроенную форму. Экранируйте буквальные знаки доллара как \$.

schema.random_ranges.list: |-
  Один диапазон на каждое нужное мне число, в том порядке, в котором я хочу получить числа.

schema.random_ranges.choice: 
  one: |-
    Один диапазон или список диапазонов, количество которых не превышает {{maxRanges}}. Каждый диапазон даёт ровно одно число.
  few: |-
    Один диапазон или список диапазонов, количество которых не превышает {{maxRanges}}. Каждый диапазон даёт ровно одно число.
  many: |-
    Один диапазон или список диапазонов, количество которых не превышает {{maxRanges}}. Каждый диапазон даёт ровно одно число.
  other: |-
    Один диапазон или список диапазонов, количество которых не превышает {{maxRanges}}. Каждый диапазон даёт ровно одно число.

schema.random_range.description: |-
  Один диапазон с включёнными границами, например {"min":1,"max":6} для шестигранного кубика.

schema.random_range.min: |-
  Наименьшее число, которое может дать этот диапазон.

schema.random_range.max: |-
  Наибольшее число, которое может дать этот диапазон. Оно не должно быть меньше min.

schema.authored_text.language: |-
  Конкретный языковой тег BCP 47 для этого текста, например {{languageTagExamples}}. Не используйте und.

schema.example_arguments: |-
  {{description}}

  Пример аргументов: {{exampleArguments}}

schema.authored.threadTitle: |-
  Заголовок темы. Передайте объект с lang и text. Например, используйте {"lang":"ja","text":"将軍家"} или {"lang":"en","text":"my text"}. Поле lang обязательно и должно содержать конкретный тег BCP 47, например {{languageTagExamples}}. Не используйте und.

