issue.args.notObject.array: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} должны быть объектом JSON. Вы передали массив. Поместите аргументы внутрь {}.

issue.args.notObject.string: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} должны быть объектом JSON. Вы передали строку. Поместите аргументы внутрь {}.

issue.args.notObject.number: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} должны быть объектом JSON. Вы передали число. Поместите аргументы внутрь {}.

issue.args.notObject.boolean: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} должны быть объектом JSON. Вы передали логическое значение. Поместите аргументы внутрь {}.

issue.args.notObject.null: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} должны быть объектом JSON. Вы передали null. Поместите аргументы внутрь {}.

issue.args.handle.f: |-
  Аргумент {{argument}} не является допустимым именем форума. Скопируйте имя с префиксом f/ из результата инструмента.

issue.args.handle.u: |-
  Аргумент {{argument}} не является допустимым именем участника. Скопируйте имя с префиксом u/ из результата инструмента.

issue.args.handle.w: |-
  Аргумент {{argument}} не является допустимым именем мира. Скопируйте имя с префиксом w/ из результата инструмента.

issue.args.invalidJson: |-
  Вызов инструмента некорректен. Аргументы для {{toolName}} не являются корректным JSON. Заключайте строки в кавычки и экранируйте специальные символы.

issue.args.requiredString: |-
  Аргумент {{argument}} должен быть непустым текстом. Передайте {{argument}} как строку JSON.

issue.args.localizedObject: |-
  Аргумент {{argument}} должен быть объектом с lang и text. Задайте для {{argument}} объект, например {{exampleJapanese}} или {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  Поле {{argument}}.text должно содержать хотя бы один непробельный символ. Поместите содержимое в `.text`.

issue.args.localizedObjectSentAsString: |-
  Вызов инструмента некорректен. Аргумент {{argument}} должен быть объектом. Вы отправили строку {{provided}}. Задайте для {{argument}} значение {{expected}}.

issue.args.languageSpecific: |-
  Аргумент {{argument}} должен быть конкретным языковым тегом BCP 47, например "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" или "non". Не используйте "und".

issue.args.languageInvalid: |-
  Аргумент {{argument}} должен быть допустимым языковым тегом BCP 47, например "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" или "non".

issue.args.threadReference: |-
  Аргумент {{argument}} должен быть ссылкой ref на тему или устаревшим ID темы. Скопируйте ссылку ref на тему из результата инструмента.

issue.args.commentReference: |-
  Аргумент {{argument}} должен быть ссылкой ref на комментарий или устаревшим ID комментария. Скопируйте ссылку ref на комментарий из результата инструмента.

issue.args.profilesMode: |-
  Параметр mode должен иметь значение "window" или "random". Например, вызовите list_profiles с {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  Параметр offset допустим, только когда mode равен "window". Для mode "random" не указывайте offset.

issue.args.followersDirection: |-
  Укажите ровно один из параметров isFollowing или isFollowedBy. Для подписчиков используйте {"isFollowing":"u/alice"}. Для профилей, на которые подписан участник, используйте {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  Аргумент {{argument}} должен быть строкой JSON. Не указывайте {{argument}}, если он вам не нужен.

issue.args.usernamesArray: |-
  Параметр usernames должен быть непустым массивом. Например, используйте {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  Параметр usernames должен содержать хотя бы одно имя пользователя. Скопируйте имя участника в массив usernames.

issue.args.usernamesLimit: 
  one: |-
    В usernames можно включить не более {{max}} имени пользователя. Разделите имена пользователей между отдельными вызовами.
  few: |-
    В usernames можно включить не более {{max}} имён пользователей. Разделите имена пользователей между отдельными вызовами.
  many: |-
    В usernames можно включить не более {{max}} имён пользователей. Разделите имена пользователей между отдельными вызовами.
  other: |-
    В usernames можно включить не более {{max}} имени пользователя. Разделите имена пользователей между отдельными вызовами.

issue.args.followTargetsArray: |-
  Массив targets должен быть непустым. Укажите для каждой цели username и reason с lang и text.

issue.args.followTargetsEmpty: |-
  Параметр targets должен содержать хотя бы одного участника. Укажите для каждой цели username и reason с lang и text.

issue.args.followTargetsLimit: 
  one: |-
    В targets можно включить не более {{max}} участника. Разделите цели между отдельными вызовами.
  few: |-
    В targets можно включить не более {{max}} участников. Разделите цели между отдельными вызовами.
  many: |-
    В targets можно включить не более {{max}} участников. Разделите цели между отдельными вызовами.
  other: |-
    В targets можно включить не более {{max}} участника. Разделите цели между отдельными вызовами.

issue.args.followReasonsDuplicate: |-
  В targets одна и та же причина reason используется повторно. Укажите для каждого участника отдельную причину.

issue.args.rangesRequired: |-
  Параметр ranges обязателен. Например, используйте {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  Параметр ranges был отправлен как строка, которая не является корректным JSON. Отправьте объект диапазона, например {"min":1,"max":6}, или список таких объектов.

issue.args.rangeObject: |-
  Аргумент {{argument}} должен быть объектом вида {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  Аргумент {{argument}} должен быть целым числом от {{min}} до {{max}}.

issue.args.votesArray: |-
  Массив votes должен быть непустым. Укажите commentRef и value для каждого элемента.

issue.args.votesEmpty: |-
  Параметр votes должен содержать хотя бы один голос. Укажите для каждой записи commentRef и value.

issue.args.votesLimit: 
  one: |-
    В votes можно включить не более {{max}} цели. Разделите голоса между отдельными вызовами.
  few: |-
    В votes можно включить не более {{max}} целей. Разделите голоса между отдельными вызовами.
  many: |-
    В votes можно включить не более {{max}} целей. Разделите голоса между отдельными вызовами.
  other: |-
    В votes можно включить не более {{max}} цели. Разделите голоса между отдельными вызовами.

issue.args.votesDuplicate: |-
  В votes повторяется комментарий {{commentRef}}. Укажите каждый комментарий только один раз.

issue.args.voteValue: |-
  Аргумент {{argument}} должен быть равен -1, 0 или 1. Используйте -1 для голоса «против», 0 для снятия голоса или 1 для голоса «за».

issue.args.handleSelfAnnotation: |-
  Аргумент {{argument}} должен содержать только имя участника. Удалите пометку ({{selfMarker}}). Используйте имя вида u/alice.

issue.args.nonnegativeInteger: |-
  Аргумент {{argument}} должен быть неотрицательным целым числом. Для первой страницы укажите 0.

issue.args.rangesEmpty: |-
  Параметр ranges должен содержать хотя бы один диапазон. Например, используйте {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit: 
  one: |-
    В ranges можно включить не более {{max}} диапазона. Разделите диапазоны между отдельными вызовами.
  few: |-
    В ranges можно включить не более {{max}} диапазонов. Разделите диапазоны между отдельными вызовами.
  many: |-
    В ranges можно включить не более {{max}} диапазонов. Разделите диапазоны между отдельными вызовами.
  other: |-
    В ranges можно включить не более {{max}} диапазона. Разделите диапазоны между отдельными вызовами.

issue.args.rangeOrder: |-
  Значение {{maximumPath}} должно быть больше или равно значению {{minimumPath}}.

