avatar.image.participant_system: |-
  Создайте общедоступный аватар для этого участника Bickr. Следуйте запрошенному визуальному направлению и используйте текущее изображение профиля, если оно предоставлено. Сделайте главный объект хорошо различимым в квадратном или кадрированном изображении профиля. Не размещайте на изображении подписи, водяные знаки, элементы интерфейса или поясняющий текст.

avatar.image.world_system: |-
  Создайте общедоступный аватар для этого мира Bickr. Следуйте запрошенному визуальному направлению и используйте текущее изображение мира, если оно предоставлено. Сделайте место действия хорошо различимым в квадратном или кадрированном изображении профиля. Не размещайте на изображении подписи, водяные знаки, элементы интерфейса или поясняющий текст.

avatar.describe_current.participant_system: |-
  Опишите предоставленное общедоступное изображение профиля для нового аватара участника Bickr. Включите конкретные подробности о внешности, выражении лица, позе, одежде, стиле, цветах, свете, фоне, кадрировании и расположении. Верните только описание.

avatar.describe_current.world_system: |-
  Опишите предоставленное общедоступное изображение мира для нового аватара мира Bickr. Включите конкретные подробности о пейзаже, зданиях, предметах, атмосфере, стиле, цветах, свете, фоне, кадрировании и расположении. Верните только описание.

avatar.world_source.system: |-
  Напишите визуальный промпт для общедоступного аватара мира Bickr. Используйте обстановку и профили участников, чтобы описать одно изображение мира. Включите конкретные подробности об ориентирах, пейзаже, атмосфере, свете, цветах, текстуре, расположении и ракурсе камеры. Не включайте подписи, наложенный текст, части интерфейса, водяные знаки или комментарии о процессе. Верните только промпт.

avatar.image.world_refresh: |-
  Используйте предоставленное текущее изображение мира как визуальный материал для обновлённого общедоступного аватара мира.

avatar.image.participant_refresh: |-
  Используйте предоставленное текущее изображение профиля как визуальный материал для обновлённого общедоступного аватара профиля.

avatar.describe_current.world: |-
  Дайте полное визуальное описание предоставленного текущего изображения мира для промпта обновлённого общедоступного аватара мира.

avatar.describe_current.participant: |-
  Дайте полное визуальное описание предоставленного текущего изображения профиля для промпта обновлённого общедоступного аватара.

avatar.persona_description.structured: |-
  Опишите изображение своего профиля. Верните требуемый объект JSON. Напишите описание в роли персонажа и от первого лица. Дайте много конкретных визуальных подробностей о внешности, стиле, сцене, свете и расположении. Описывайте только то, что видно.

avatar.persona_description.tool: |-
  Опишите изображение своего профиля. Вызовите {{toolName}}. Пишите в роли персонажа и от первого лица. Дайте много конкретных визуальных подробностей о внешности, стиле, сцене, свете и расположении. Описывайте только то, что видно.

avatar.persona_description.repair_structured: |-
  Верните объект JSON с ровно одним полем description. Пишите в нём в роли персонажа и от первого лица. Описывайте только видимую внешность, стиль, сцену, свет и расположение.

avatar.persona_description.repair_tool: |-
  Вызовите {{toolName}}. Пишите в роли персонажа и от первого лица. Описывайте только видимую внешность, стиль, сцену, свет и расположение.

