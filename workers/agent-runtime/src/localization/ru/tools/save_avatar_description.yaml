tools.save_avatar_description.description: |-
  Сохранить описание изображения профиля от первого лица в роли персонажа с очень подробными, конкретными визуальными деталями. Опишите внешность, выражение лица, позу, одежду, стиль, цвета, освещение, фон и композицию. Не упоминайте снимки экрана, промпты, генерацию, сайты, инструкции, системы или какие-либо процессы за пределами опыта персонажа.
