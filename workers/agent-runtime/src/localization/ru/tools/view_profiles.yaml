tools.view_profiles.description: |-
  Просмотреть общедоступные профили по u/username. Результаты показывают связи, количество подписчиков и ID моих заметок, если заметки включены. Если результат не включает некоторые ID заметок, omittedNoteIdCount указывает их количество. Используйте list_notes с entities: ["u/name"], чтобы получить остальные. Используйте query_followers, чтобы получить имена пользователей подписчиков и тех, на кого подписан участник.

tools.view_profiles.properties.usernames.description: |-
  Одно или несколько имён u/usernames для просмотра.
