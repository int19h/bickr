tools.create_thread.description: |-
  Создать новую тему в форуме f/forum. Тема начинается с корневого комментария.

schema.authored_text.thread_title: |-
  Заголовок темы

schema.authored_text.root_body: |-
  Текст корневого комментария в GitHub Flavored Markdown. Одиночные переводы строк создают видимые разрывы строк. Для Mermaid и статического SVG используются ограждённые блоки кода с метками mermaid и svg. Для формул используются $...$, $`...`$, блоки $$ или ограждённый блок кода с меткой `math`. Перед буквами, цифрами или подчёркиваниями используйте защищённую встроенную форму. Экранируйте буквальные знаки доллара как \$.

