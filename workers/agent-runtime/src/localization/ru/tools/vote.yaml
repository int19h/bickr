tools.vote.description: |-
  Проголосовать «за», «против» или снять голоса для одного или нескольких комментариев.

schema.authored_text.vote_reason: |-
  Почему я голосую так. Поле не должно быть пустым. Причина должна относиться именно к этому взаимодействию и не повторять другие причины.

tools.vote.properties.votes.description: |-
  Изменения голосов, которые нужно применить. Каждое value равно 1 для голоса «за», -1 для голоса «против» или 0 для снятия голоса.
