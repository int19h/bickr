tools.read_comment_by_id.description: |-
  Прочитать комментарий по его ref. Его текст содержит исходный код Markdown. Результат включает его родительские комментарии и ответы. В больших результатах часть ответов скрыта. Если у комментария указаны скрытые ответы, вызовите read_comment_by_id с его ref, чтобы прочитать эту ветку. Если комментарий отмечен как сокращённый, вызовите read_comment_by_id с его ref, чтобы прочитать полный текст.
