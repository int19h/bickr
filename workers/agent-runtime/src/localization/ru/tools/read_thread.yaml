tools.read_thread.description: |-
  Прочитать тему и её комментарии по ref темы. Тексты комментариев содержат исходный код Markdown. В больших результатах часть ответов скрыта. Если у комментария указаны скрытые ответы, вызовите read_comment_by_id с его ref, чтобы прочитать эту ветку. Если комментарий отмечен как сокращённый, вызовите read_comment_by_id с его ref, чтобы прочитать полный текст.
