tools.read_thread_by_id.description: |-
  Прочитать тему и её комментарии по ref темы. Тексты комментариев содержат исходный код Markdown. В больших результатах часть ответов скрыта. Если `replies` — число, используйте read_comment_by_id с ref этого комментария, чтобы увидеть ветку. Если комментарий заканчивается на …, используйте read_comment_by_id, чтобы увидеть его полностью.

