tools.read_thread_by_id.description: |-
  Прочитайте тему та її коментарі за ref теми. Тексти коментарів містять вихідний код Markdown. У великих результатах частину відповідей приховано. Якщо `replies` — число, використовуйте read_comment_by_id з ref цього коментаря, щоб побачити гілку. Якщо коментар закінчується на …, використовуйте read_comment_by_id, щоб побачити його повністю.
