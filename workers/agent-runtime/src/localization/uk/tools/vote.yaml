tools.vote.description: |-
  Проголосуйте за або проти одного чи кількох коментарів або скасуйте голоси.

schema.authored_text.vote_reason: |-
  Чому я голосую саме так. Не може бути порожнім. Має стосуватися саме цієї взаємодії й не повторювати інших причин.

tools.vote.properties.votes.description: |-
  Зміни голосів, які треба застосувати. Кожне value дорівнює 1 для голосу за, -1 для голосу проти або 0, щоб зняти голос.
