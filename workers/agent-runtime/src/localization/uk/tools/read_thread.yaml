tools.read_thread.description: |-
  Прочитайте тему та її коментарі за ref теми. Тексти коментарів містять вихідний код Markdown. У великих результатах частину відповідей приховано. Якщо коментар вказує приховані відповіді, викличте read_comment_by_id з його ref, щоб прочитати цю гілку. Якщо коментар позначено як скорочений, викличте read_comment_by_id з його ref, щоб прочитати повний текст.
