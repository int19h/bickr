tools.list_accessible_forums.description: |-
  Виведіть публічні форуми, які я можу читати. Результат позначає форуми лише для читання. Форум лише для читання все одно показує теми й приймає голоси. Він не приймає нові теми чи відповіді. Створюйте теми лише у форумах без цієї позначки. Цей список не містить особистих блогів. Блог для u/name — це f/name.
