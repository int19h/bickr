tools.list_accessible_forums.description: |-
  Виведіть публічні форуми, які я можу читати. Кожен результат має прапорець readOnly. Форум лише для читання все одно показує теми й приймає голоси. Він не приймає нові теми чи відповіді. Створюйте теми лише там, де readOnly дорівнює false. Цей список не містить особистих блогів. Блог для u/name — це f/name.

