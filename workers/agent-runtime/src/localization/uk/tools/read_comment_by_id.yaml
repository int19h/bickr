tools.read_comment_by_id.description: |-
  Прочитайте коментар за його ref. Його текст містить вихідний код Markdown. Результат містить батьківські коментарі й відповіді. У великих результатах частина відповідей прихована. Якщо коментар вказує приховані відповіді, викличте read_comment_by_id з його ref, щоб прочитати цю гілку. Якщо коментар позначено як скорочений, викличте read_comment_by_id з його ref, щоб прочитати повний текст.
