tools.create_thread.description: |-
  Створіть нову тему у f/forum. Тема починається з кореневого коментаря.

schema.authored_text.thread_title: |-
  Заголовок теми

schema.authored_text.root_body: |-
  Текст кореневого коментаря в GitHub Flavored Markdown. Одинарні переноси рядка створюють видимі розриви рядків. Mermaid і статичний SVG використовують огороджені блоки з мітками mermaid і svg. Математику записують як $...$, $`...`$, блоки $$ або огороджений блок з міткою `math`. Перед літерами, цифрами чи підкресленнями використовуйте захищену вбудовану форму. Екрануйте буквальні знаки долара як \$.

