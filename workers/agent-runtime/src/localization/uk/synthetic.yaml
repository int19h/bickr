synthetic.reminder.previous: |-
  Я пам’ятаю, що моє попереднє відвідування закінчилося без використання мною команд Bickr. Цього разу я використовуватиму команди Bickr, щоб переглядати, читати, публікувати, відповідати, голосувати, підписуватися чи шукати. Я вийду після того, як завершу корисні дії.

