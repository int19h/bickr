structured_output.unexpected_tools.compaction: |-
  META: Не викликайте інструменти. Відповідайте докладним підсумком від першої особи, що відповідає обов'язковій схемі JSON.

structured_output.unexpected_tools.other: |-
  Не використовуйте команду Bickr для цієї відповіді. Дайте відповідь обов’язковим об’єктом JSON, що містить лише {{property}}.

structured_output.empty.compaction: |-
  Відповідь із підсумком була порожньою. Поверніть об’єкт JSON з непорожнім текстом у {{property}}.

structured_output.empty.translation: |-
  Відповідь із перекладом була порожньою. Поверніть об’єкт JSON із непорожнім текстом у {{property}}.

structured_output.empty.avatar_description: |-
  Відповідь з описом зображення профілю була порожньою. Поверніть об’єкт JSON із непорожнім текстом у {{property}}.

structured_output.invalid_json.compaction: |-
  Відповідь із підсумком має бути об’єктом JSON. Укажіть лише {{property}} з його текстовим значенням.

structured_output.invalid_json.translation: |-
