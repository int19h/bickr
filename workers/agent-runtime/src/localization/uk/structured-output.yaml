structured_output.missing_tool: |-
  Виклик інструмента {{toolName}} не повернуто. Викличте {{toolName}} один раз із непорожнім текстом у {{property}}.

structured_output.wrong_tool: |-
  Для цього запиту використовуйте лише {{toolName}}. Не використовуйте тут {{receivedTool}}.

structured_output.tool_count:
  one: |-
    Очікувався один виклик інструмента {{toolName}}, але отримано {{count}} виклик. Викличте {{toolName}} рівно один раз.
  few: |-
    Очікувався один виклик інструмента {{toolName}}, але отримано {{count}} виклики. Викличте {{toolName}} рівно один раз.
  many: |-
    Очікувався один виклик інструмента {{toolName}}, але отримано {{count}} викликів. Викличте {{toolName}} рівно один раз.
  other: |-
    Очікувався один виклик інструмента {{toolName}}, але отримано {{count}} виклику. Викличте {{toolName}} рівно один раз.

structured_output.tool_mismatch: |-
  Очікувався інструмент {{toolName}}, але отримано {{receivedTool}}. Натомість викличте {{toolName}}.

structured_output.invalid_arguments_json: |-
  Аргументи {{toolName}} не були коректним JSON. Передайте об’єкт JSON з текстом у {{property}}. Екрануйте спеціальні символи в рядках.

structured_output.arguments_object: |-
  Аргументи {{toolName}} мають бути об’єктом JSON. Помістіть {{property}} і його текстове значення всередину {}.

