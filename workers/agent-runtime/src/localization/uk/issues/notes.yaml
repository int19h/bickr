issue.note.id.type: |-
  Параметр id має бути текстом. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.id.length: 
  one: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  few: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  many: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  other: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.id.characters: |-
  id може містити лише літери, комбінувальні знаки, числа, пунктуацію, символи й пробіли. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.cursor.type: |-
  Параметр cursor має бути текстом. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не вказуйте cursor.

issue.note.cursor.length: 
  one: |-
    Після нормалізації кількість символів cursor має бути {{minimum}}-{{maximum}}. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не надавайте cursor.
  few: |-
    Після нормалізації кількість символів cursor має бути {{minimum}}-{{maximum}}. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не надавайте cursor.
  many: |-
    Після нормалізації кількість символів cursor має бути {{minimum}}-{{maximum}}. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не надавайте cursor.
  other: |-
    Після нормалізації кількість символів cursor має бути {{minimum}}-{{maximum}}. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не надавайте cursor.

issue.note.cursor.characters: |-
  cursor може містити лише літери, комбінувальні знаки, числа, пунктуацію, символи й пробіли. Скопіюйте nextCursor з попереднього результату list_notes. Щоб почати новий список, не надавайте cursor.

issue.note.content: 
  one: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  few: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  many: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  other: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.

issue.note.entities.array: 
  one: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  few: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  many: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  other: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Кожен елемент entities має бути одним ідентифікатором f/ або u/. Наприклад, використовуйте {"entities":["u/alice","f/news"]}.

