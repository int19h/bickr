issue.note.planUnavailable: |-
  Нотатка PLAN недоступна. Виберіть інший заголовок нотатки.

issue.note.notFound: |-
  Нотатки з таким заголовком немає.

issue.tool.commentNotFound: |-
  Коментар не знайдено.

issue.tool.forumNotFound: |-
  Форум не знайдено.
