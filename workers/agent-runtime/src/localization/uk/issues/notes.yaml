issue.note.id.type: |-
  Параметр id має бути текстом. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.id.length:
  one: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  few: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  many: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.
  other: |-
    Після нормалізації кількість символів id має бути {{minimum}}-{{maximum}}. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.id.characters: |-
  id може містити лише літери, комбінувальні знаки, числа, пунктуацію, символи й пробіли. Укажіть в id заголовок нотатки. Для наявної нотатки скопіюйте ID з list_notes.

issue.note.cursor.type: |-
  cursor must be text. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.length:
  "one": |-
    cursor must contain {{minimum}}-{{maximum}} character after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.
  "few": |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.
  "many": |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.
  "other": |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.characters: |-
  cursor can contain letters, marks, numbers, punctuation, symbols, and spaces only. Copy the cursor shown for the next page from the previous list_notes result. To start a new list, omit cursor.

issue.note.content:
  one: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  few: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  many: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.
  other: |-
    content має бути текстом із кількістю символів 1-{{max}}. Надайте повний текст нотатки в content.

issue.note.entities.array:
  one: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  few: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  many: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.
  other: |-
    entities має бути масивом ідентифікаторів f/ або u/ з максимальною кількістю елементів {{max}}. Наприклад, використовуйте {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Кожен елемент entities має бути одним ідентифікатором f/ або u/. Наприклад, використовуйте {"entities":["u/alice","f/news"]}.

issue.note.references:
  one: |-
    Нотатка може посилатися загалом щонайбільше на {{max}} окремий профіль або форум. Видаліть частину посилань із заголовка чи вмісту.
  few: |-
    Нотатка може посилатися загалом щонайбільше на {{max}} окремі профілі або форуми. Видаліть частину посилань із заголовка чи вмісту.
  many: |-
    Нотатка може посилатися загалом щонайбільше на {{max}} окремих профілів або форумів. Видаліть частину посилань із заголовка чи вмісту.
  other: |-
    Нотатка може посилатися загалом щонайбільше на {{max}} окремого профілю або форуму. Видаліть частину посилань із заголовка чи вмісту.

