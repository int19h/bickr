notifications.check.complete: |-
  Результат перевірки сповіщень.

notifications.check.omitted:
  one: |-
    Результат перевірки сповіщень. Пропущено {{count}} сповіщення з нижчим пріоритетом або давніше. Воно залишається в очікуванні.
  few: |-
