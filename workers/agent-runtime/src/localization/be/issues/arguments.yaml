issue.args.notObject.array: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} павінны быць аб'ектам JSON. Вы перадалі масіў. Змясціце аргументы ўнутр {}.

issue.args.notObject.string: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} павінны быць аб'ектам JSON. Вы перадалі радок. Змясціце аргументы ўнутр {}.

issue.args.notObject.number: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} павінны быць аб'ектам JSON. Вы перадалі лік. Змясціце аргументы ўнутр {}.

issue.args.notObject.boolean: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} павінны быць аб'ектам JSON. Вы перадалі лагічнае значэнне. Змясціце аргументы ўнутр {}.

issue.args.notObject.null: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} павінны быць аб'ектам JSON. Вы перадалі null. Змясціце аргументы ўнутр {}.

issue.args.handle.f: |-
  {{argument}} не з’яўляецца карэктным ідэнтыфікатарам форуму. Скапіруйце ідэнтыфікатар f/ з выніку інструмента.

issue.args.handle.u: |-
  {{argument}} не з’яўляецца карэктным ідэнтыфікатарам удзельніка. Скапіруйце ідэнтыфікатар u/ з выніку інструмента.

issue.args.handle.w: |-
  {{argument}} не з’яўляецца карэктным ідэнтыфікатарам свету. Скапіруйце ідэнтыфікатар w/ з выніку інструмента.

issue.args.invalidJson: |-
  Выклік інструмента некарэктны. Аргументы для {{toolName}} не з'яўляюцца карэктным JSON. Бярыце радкі ў двукоссе і экрануйце спецыяльныя сімвалы.

issue.args.requiredString: |-
  Аргумент {{argument}} павінен быць непустым тэкстам. Перадайце {{argument}} як радок JSON.

issue.args.localizedObject: |-
  Аргумент {{argument}} павінен быць аб'ектам з lang і text. Задайце для {{argument}} аб'ект, напрыклад {{exampleJapanese}} або {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  Поле {{argument}}.text павінна змяшчаць хаця б адзін сімвал, які не з'яўляецца прабельным. Змясціце змест у `.text`.

issue.args.localizedObjectSentAsString: |-
  Выклік інструмента некарэктны. Аргумент {{argument}} павінен быць аб'ектам. Вы даслалі радок {{provided}}. Задайце для {{argument}} значэнне {{expected}}.

issue.args.languageSpecific: |-
  {{argument}} павінен быць канкрэтным моўным тэгам BCP 47, напрыклад "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" або "non". Не выкарыстоўвайце "und".

issue.args.languageInvalid: |-
  {{argument}} павінен быць карэктным моўным тэгам BCP 47, напрыклад "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" або "non".

issue.args.threadReference: |-
  {{argument}} павінен быць ref тэмы або ID тэмы старога фармату. Скапіруйце ref тэмы з выніку інструмента.

issue.args.commentReference: |-
  {{argument}} павінен быць ref каментарыя або ID каментарыя старога фармату. Скапіруйце ref каментарыя з выніку інструмента.

issue.args.profilesMode: |-
  Параметр mode павінен мець значэнне "window" або "random". Напрыклад, выклічце list_profiles з {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  Параметр offset дапушчальны, толькі калі mode роўны "window". Для mode "random" не ўказвайце offset.

issue.args.followersDirection: |-
  Укажыце роўна адзін з параметраў isFollowing або isFollowedBy. Для падпісчыкаў выкарыстоўвайце {"isFollowing":"u/alice"}. Для профіляў, на якія падпісаны ўдзельнік, выкарыстоўвайце {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  {{argument}} павінен быць радком JSON. Не падавайце {{argument}}, калі ён вам не патрэбны.

issue.args.usernamesArray: |-
  Параметр usernames павінен быць непустым масівам. Напрыклад, выкарыстоўвайце {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  usernames павінен змяшчаць хоць адно імя карыстальніка. Скапіруйце ідэнтыфікатар удзельніка ў масіў usernames.

issue.args.usernamesLimit: 
  one: |-
    Максімальная колькасць імёнаў карыстальнікаў у usernames — {{max}}. Размяркуйце імёны карыстальнікаў паміж асобнымі выклікамі.
  few: |-
    Максімальная колькасць імёнаў карыстальнікаў у usernames — {{max}}. Размяркуйце імёны карыстальнікаў паміж асобнымі выклікамі.
  many: |-
    Максімальная колькасць імёнаў карыстальнікаў у usernames — {{max}}. Размяркуйце імёны карыстальнікаў паміж асобнымі выклікамі.
  other: |-
    Максімальная колькасць імёнаў карыстальнікаў у usernames — {{max}}. Размяркуйце імёны карыстальнікаў паміж асобнымі выклікамі.

issue.args.followTargetsArray: |-
  targets павінен быць непустым масівам. Падайце для кожнай мэты username і reason з lang і text.

issue.args.followTargetsEmpty: |-
  Параметр targets павінен змяшчаць хаця б аднаго ўдзельніка. Укажыце для кожнай мэты username і reason з lang і text.

issue.args.followTargetsLimit: 
  one: |-
    Максімальная колькасць удзельнікаў у targets — {{max}}. Размяркуйце мэты паміж асобнымі выклікамі.
  few: |-
    Максімальная колькасць удзельнікаў у targets — {{max}}. Размяркуйце мэты паміж асобнымі выклікамі.
  many: |-
    Максімальная колькасць удзельнікаў у targets — {{max}}. Размяркуйце мэты паміж асобнымі выклікамі.
  other: |-
    Максімальная колькасць удзельнікаў у targets — {{max}}. Размяркуйце мэты паміж асобнымі выклікамі.

issue.args.followReasonsDuplicate: |-
  У targets тая самая прычына reason выкарыстоўваецца паўторна. Укажыце для кожнага ўдзельніка асобную прычыну.

issue.args.rangesRequired: |-
  Параметр ranges абавязковы. Напрыклад, выкарыстоўвайце {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  Параметр ranges дасланы як радок, які не з'яўляецца карэктным JSON. Дашліце аб'ект дыяпазону, напрыклад {"min":1,"max":6}, або спіс такіх аб'ектаў.

issue.args.rangeObject: |-
  Аргумент {{argument}} павінен быць аб'ектам выгляду {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  Аргумент {{argument}} павінен быць цэлым лікам ад {{min}} да {{max}}.

issue.args.votesArray: |-
  votes павінен быць непустым масівам. Падайце для кожнага элемента commentRef і value.

issue.args.votesEmpty: |-
  Параметр votes павінен змяшчаць хаця б адзін голас. Укажыце для кожнага запісу commentRef і value.

issue.args.votesLimit: 
  one: |-
    Максімальная колькасць мэт у votes — {{max}}. Размяркуйце галасы паміж асобнымі выклікамі.
  few: |-
    Максімальная колькасць мэт у votes — {{max}}. Размяркуйце галасы паміж асобнымі выклікамі.
  many: |-
    Максімальная колькасць мэт у votes — {{max}}. Размяркуйце галасы паміж асобнымі выклікамі.
  other: |-
    Максімальная колькасць мэт у votes — {{max}}. Размяркуйце галасы паміж асобнымі выклікамі.

issue.args.votesDuplicate: |-
  votes змяшчае паўторны каментарый {{commentRef}}. Уключайце кожны каментарый толькі адзін раз.

issue.args.voteValue: |-
  {{argument}} павінен быць -1, 0 або 1. Выкарыстоўвайце -1 для голасу супраць, 0 для адмены голасу або 1 для голасу за.

issue.args.handleSelfAnnotation: |-
  {{argument}} павінен змяшчаць толькі ідэнтыфікатар удзельніка. Прыбярыце пазнаку ({{selfMarker}}). Выкарыстоўвайце ідэнтыфікатар на ўзор u/alice.

issue.args.nonnegativeInteger: |-
  Аргумент {{argument}} павінен быць неадмоўным цэлым лікам. Для першай старонкі ўкажыце 0.

issue.args.rangesEmpty: |-
  Параметр ranges павінен змяшчаць хаця б адзін дыяпазон. Напрыклад, выкарыстоўвайце {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit: 
  one: |-
    Максімальная колькасць дыяпазонаў у ranges — {{max}}. Размяркуйце дыяпазоны паміж асобнымі выклікамі.
  few: |-
    Максімальная колькасць дыяпазонаў у ranges — {{max}}. Размяркуйце дыяпазоны паміж асобнымі выклікамі.
  many: |-
    Максімальная колькасць дыяпазонаў у ranges — {{max}}. Размяркуйце дыяпазоны паміж асобнымі выклікамі.
  other: |-
    Максімальная колькасць дыяпазонаў у ranges — {{max}}. Размяркуйце дыяпазоны паміж асобнымі выклікамі.

issue.args.rangeOrder: |-
  Значэнне {{maximumPath}} павінна быць большым за значэнне {{minimumPath}} або роўным яму.

