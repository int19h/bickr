avatar.image.participant_system: |-
  Стварыце публічны аватар для гэтага ўдзельніка Bickr. Трымайцеся запытанага візуальнага кірунку і выкарыстайце цяперашнюю выяву профілю, калі яе дадзена. Зрабіце аб'ект выразным у квадратным або абрэзаным выглядзе профілю. Не змяшчайце ў выяву подпісы, вадзяныя знакі, часткі інтэрфейсу ці тлумачальны тэкст.

avatar.image.world_system: |-
  Стварыце публічны аватар для гэтага свету Bickr. Выконвайце запытаны візуальны кірунак і выкарыстоўвайце любую пададзеную бягучую выяву свету. Выразна пакажыце асяроддзе ў квадратным або абрэзаным выглядзе профілю. Не дадавайце ў выяву подпісаў, вадзяных знакаў, частак інтэрфейсу або тлумачальнага тэксту.

avatar.describe_current.participant_system: |-
  Апішыце дадзеную публічную выяву профілю для новага аватара ўдзельніка Bickr. Дадайце канкрэтныя дэталі знешнасці, выразу твару, позы, адзення, стылю, колераў, святла, фону, кадравання і кампаноўкі. Вярніце толькі апісанне.

avatar.describe_current.world_system: |-
  Апішыце дадзеную публічную выяву свету для новага аватара свету Bickr. Дадайце канкрэтныя дэталі краявіду, будынкаў, прадметаў, атмасферы, стылю, колераў, святла, фону, кадравання і кампаноўкі. Вярніце толькі апісанне.

avatar.world_source.system: |-
  Напішыце візуальны промпт для публічнага аватара свету Bickr. Выкарыстайце абставіны і профілі ўдзельнікаў, каб апісаць адну выяву свету. Дадайце канкрэтныя дэталі арыенціраў, краявіду, атмасферы, святла, колераў, фактуры, кампаноўкі і ракурсу камеры. Не дадавайце подпісаў, накладзенага тэксту, элементаў інтэрфейсу, вадзяных знакаў ці каментарыяў пра працэс. Вярніце толькі промпт.

avatar.image.world_refresh: |-
  Выкарыстоўвайце пададзеную бягучую выяву свету як візуальныя ўваходныя даныя для абноўленага публічнага аватара свету.

avatar.image.participant_refresh: |-
  Выкарыстоўвайце пададзеную бягучую выяву профілю як візуальныя ўваходныя даныя для абноўленага публічнага аватара профілю.

avatar.describe_current.world: |-
  Дайце поўнае візуальнае апісанне дадзенай бягучай выявы свету для промпту абноўленага публічнага аватара свету.

avatar.describe_current.participant: |-
  Дайце поўнае візуальнае апісанне дадзенай бягучай выявы профілю для промпту абноўленага публічнага аватара.

avatar.persona_description.structured: |-
  Апішыце сваю выяву профілю. Вярніце патрэбны аб'ект JSON. Напішыце апісанне гэтай выявы ў ролі і ад першай асобы. Прывядзіце шмат канкрэтных візуальных дэталей пра знешнасць, стыль, сцэну, святло і кампаноўку. Апісвайце толькі тое, што бачна.

avatar.persona_description.tool: |-
  Апішыце сваю выяву профілю. Выклічце {{toolName}}. Пішыце ў ролі і ад першай асобы. Прывядзіце шмат канкрэтных візуальных дэталей пра знешнасць, стыль, сцэну, святло і кампаноўку. Апісвайце толькі тое, што бачна.

avatar.persona_description.repair_structured: |-
  Вярніце аб'ект JSON роўна з адным полем description. Напішыце яго ў ролі і ад першай асобы. Апісвайце толькі бачныя знешнасць, стыль, сцэну, святло і кампаноўку.

avatar.persona_description.repair_tool: |-
  Выклічце {{toolName}}. Пішыце ў ролі і ад першай асобы. Апісвайце толькі бачныя знешнасць, стыль, сцэну, святло і кампаноўку.

