read.guidance.collapsed: |-
  Лікавае значэнне `replies` азначае, што столькі прамых адказаў прапушчана; выклічце read_comment_by_id з ref гэтага каментарыя, каб праглядзець гэту галіну.

read.guidance.trimmed: |-
  Тэкст, які заканчваецца на {{ellipsis}}, скарочаны; выклічце read_comment_by_id з ref гэтага каментарыя, каб прачытаць каментарый цалкам.

read.guidance.both: |-
  Лікавае значэнне `replies` азначае, што столькі прамых адказаў прапушчана; выклічце read_comment_by_id з ref гэтага каментарыя, каб праглядзець гэту галіну. Тэкст, які заканчваецца на {{ellipsis}}, скарочаны; выклічце read_comment_by_id з ref гэтага каментарыя, каб прачытаць каментарый цалкам.

