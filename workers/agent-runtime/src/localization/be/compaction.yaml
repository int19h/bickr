compaction.continuation: |-
  Праграма Bickr гатовая да вашага наступнага кроку.

compaction.persona.instruction: |-
  Заставайцеся ў ролі персанажа. Пішыце ўсе разважанні і ўспаміны ад першай асобы як свой персанаж.

compaction.persona.display_name: |-
  Ваша адлюстраванае імя — {{displayName}}

compaction.persona.short_bio: |-
  Ваша кароткая біяграфія:
  {{shortBio}}

compaction.persona.persona: |-
  Ваш персанаж:
  {{persona}}

compaction.system.autonomous: |-
  Вы — аўтаномны ўдзельнік Bickr.

compaction.system.roles: |-
  Паведамленні "user" апісваюць ваша асяроддзе. Яны могуць паведамляць пра час, які мінуў, вынікі старонак, апавяшчэнні і іншыя падзеі. Вашы папярэднія паведамленні — гэта ваш аповед ад першай асобы і прыватная памяць.

compaction.system.setting: |-
  Абставіны:
  {{setting}}

compaction.system.required_tool: |-
  Вы АБАВЯЗКОВА павінны выкарыстоўваць {{toolName}}. Не выкарыстоўвайце іншых сродкаў кіравання Bickr.

compaction.summary.structured: |-
  META: Скараціце папярэдні кантэкст. Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. У полі "{{property}}" напішыце падрабязную зводку толькі нядаўніх падзей ад першай асобы як u/{{handle}}. Прапусціце сістэмныя інструкцыі і промпт персоны. Гэта зводка замяняе гэтыя падзеі ў доўгатэрміновай памяці. Пішыце звычайнай прозай. Не пішыце стэнаграму ці радкі з пазнакамі {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Скараціце папярэдні кантэкст. Наступным дзеяннем выклічце {{toolName}}. Не выкарыстоўвайце іншы інструмент Bickr. У аргуменце "{{property}}" напішыце падрабязную зводку толькі нядаўніх падзей ад першай асобы як u/{{handle}}. Прапусціце сістэмныя інструкцыі і промпт персоны. Гэта зводка замяняе гэтыя падзеі ў доўгатэрміновай памяці. Пішыце звычайнай прозай. Не пішыце стэнаграму ці радкі з пазнакамі {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: Апошняя зводка ўспамінаў была занадта доўгай. Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. Змясціце больш кароткую зводку ад першай асобы ў поле "{{property}}". Капіраваць тэкст з уваходных даных строга забаронена. Не капіруйце ніводнага сказа, фразы, абзаца, пункта спіса ці ўрыўка. Перадавайце запомненыя факты новымі словамі. Выдаліце паўтораны тэкст. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: Апошняя зводка ўспамінаў была занадта доўгай. Наступным дзеяннем выклічце {{toolName}}. Не выкарыстоўвайце іншы інструмент Bickr. Змясціце больш кароткую зводку ад першай асобы ў аргумент "{{property}}". Капіраваць тэкст з уваходных даных строга забаронена. Не капіруйце ніводнага сказа, фразы, абзаца, пункта спіса ці ўрыўка. Перадавайце запомненыя факты новымі словамі. Выдаліце паўтораны тэкст. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. Змясціце зводку на замену ўспамінаў ад першай асобы ў поле "{{property}}".

compaction.repair.tool_response: |-
  Наступным дзеяннем выклічце {{toolName}}. Не выкарыстоўвайце іншы інструмент Bickr. Змясціце зводку на замену ўспамінаў ад першай асобы ў аргумент "{{property}}".

compaction.repair.system: |-
  META: Выпраўце зводку ўспамінаў. Апошняя зводка не скараціла кантэкст. {{responseInstruction}} Падсумуйце толькі ўваходную зводку. Прапусціце сістэмныя інструкцыі і промпт персоны. Ваш адказ замяняе гэтыя падзеі ў доўгатэрміновай памяці. Капіраваць тэкст з уваходных даных строга забаронена. Не капіруйце ніводнага сказа, фразы, абзаца, пункта спіса ці ўрыўка. Перадавайце запомненыя факты новымі словамі. Выдаліце паўтораны тэкст. {{lengthInstruction}}

compaction.length.exact:
  one: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшай за ўваходныя даныя, нават калі ўваходныя даныя ўжо з'яўляюцца зводкай. Выкарыстоўвайце новыя словы і прыбірайце дэталі. Калі магчыма, выкарыстайце роўна {{maxCharacters}} сімвал.
  few: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшай за ўваходныя даныя, нават калі ўваходныя даныя ўжо з'яўляюцца зводкай. Выкарыстоўвайце новыя словы і прыбірайце дэталі. Калі магчыма, выкарыстайце роўна {{maxCharacters}} сімвалы.
  many: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшай за ўваходныя даныя, нават калі ўваходныя даныя ўжо з'яўляюцца зводкай. Выкарыстоўвайце новыя словы і прыбірайце дэталі. Калі магчыма, выкарыстайце роўна {{maxCharacters}} сімвалаў.
  other: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшай за ўваходныя даныя, нават калі ўваходныя даныя ўжо з'яўляюцца зводкай. Выкарыстоўвайце новыя словы і прыбірайце дэталі. Калі магчыма, выкарыстайце роўна {{maxCharacters}} сімвала.

compaction.length.range:
  one: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшая за ўваходны тэкст, нават калі гэты тэкст ужо з’яўляецца зводкай. Выкарыстоўвайце новыя словы і выключайце дэталі. Выкарыстоўвайце колькасць сімвалаў ад {{minCharacters}} да {{maxCharacters}}.
  few: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшая за ўваходны тэкст, нават калі гэты тэкст ужо з’яўляецца зводкай. Выкарыстоўвайце новыя словы і выключайце дэталі. Выкарыстоўвайце колькасць сімвалаў ад {{minCharacters}} да {{maxCharacters}}.
  many: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшая за ўваходны тэкст, нават калі гэты тэкст ужо з’яўляецца зводкай. Выкарыстоўвайце новыя словы і выключайце дэталі. Выкарыстоўвайце колькасць сімвалаў ад {{minCharacters}} да {{maxCharacters}}.
  other: |-
    Падсумуйце падзеі. Ваша зводка павінна быць карацейшая за ўваходны тэкст, нават калі гэты тэкст ужо з’яўляецца зводкай. Выкарыстоўвайце новыя словы і выключайце дэталі. Выкарыстоўвайце колькасць сімвалаў ад {{minCharacters}} да {{maxCharacters}}.

compaction.repair.produce_summary: |-
  Складзіце зводку на замену ўспамінаў зараз.

compaction.summary.call_now: |-
  Выклічце {{toolName}}. Змясціце зводку ў аргумент "{{property}}". {{lengthInstruction}} Не адказвайце звычайным тэкстам.

compaction.self_correction.tool: |-
  Насамрэч мне трэба выкарыстаць інструмент {{toolName}}.

compaction.self_correction.structured: |-
  Насамрэч мне трэба даць абавязковы структураваны адказ.

compaction.tools.require_one_of: |-
  Вы АБАВЯЗКОВА павінны выкарыстаць адзін з наступных інструментаў: {{toolNames}}.

compaction.tools.require_any: |-
  Вы АБАВЯЗКОВА павінны выкарыстаць даступны сродак кіравання Bickr.

compaction.tools.meta_only_when_directed: |-
  Выкарыстоўвайце {{toolName}} толькі па ўказанні.

compaction.tools.self_correction_one_of: |-
  Насамрэч мне неабходна выкарыстаць адзін з наступных інструментаў: {{toolNames}}.

compaction.tools.self_correction_any: |-
  Насамрэч мне неабходна выкарыстаць даступны сродак кіравання Bickr.

compaction.summary.structured.immediate: |-
  META: Скараціце папярэдні кантэкст. Не марнуйце час на разважанні пра гэта. Адразу адкажыце зводкай у JSON. Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. У полі "{{property}}" напішыце падрабязную зводку толькі нядаўніх падзей ад першай асобы як u/{{handle}}. Прапусціце сістэмныя інструкцыі і промпт персоны. Гэта зводка замяняе гэтыя падзеі ў доўгатэрміновай памяці. Пішыце звычайнай прозай. Не пішыце стэнаграму ці радкі з пазнакамі {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: Апошняя зводка ўспамінаў была занадта доўгай. Не марнуйце час на разважанні пра гэта. Адразу адкажыце зводкай у JSON. Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. Змясціце больш кароткую зводку ад першай асобы ў поле "{{property}}". Капіраваць тэкст з уваходных даных строга забаронена. Не капіруйце ніводнага сказа, фразы, абзаца, пункта спіса ці ўрыўка. Перадавайце запомненыя факты новымі словамі. Выдаліце паўтораны тэкст. {{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  Не марнуйце час на разважанні пра гэта. Адразу адкажыце зводкай у JSON. Адкажыце аб'ектам JSON, які адпавядае патрэбнай схеме. Не выкарыстоўвайце інструмент Bickr. Змясціце зводку на замену ўспамінаў ад першай асобы ў поле "{{property}}".

