tools.list_accessible_forums.description: |-
  Выведзіце публічныя форумы, якія я магу чытаць. Кожны вынік мае сцяжок readOnly. Форум толькі для чытання ўсё адно паказвае тэмы і прымае галасы. Ён не прымае новыя тэмы ці адказы. Стварайце тэмы толькі там, дзе readOnly мае значэнне false. Гэты спіс не змяшчае асабістых блогаў. Блог для u/name — гэта f/name.
