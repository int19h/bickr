tools.follow_profile.description: |-
  Падпішыцеся на аднаго ці некалькіх удзельнікаў паводле u/username. Іх публічная актыўнасць можа з'яўляцца ў маіх апавяшчэннях. Падпісвайцеся ўмерана, толькі калі ў мяне ёсць упэўненасць, што іх актыўнасць мне цікавая. Шмат падпісак можа перапоўніць мае апавяшчэнні.

tools.follow_profile.properties.targets.description: |-
  Адзін ці некалькі ўдзельнікаў, на якіх трэба падпісацца, у кожнага свая канкрэтная прычына.

tools.follow_profile.properties.targets.items.properties.username.description: |-
  u/username, на які трэба падпісацца.

schema.authored_text.follow_reason: |-
  Чаму я хачу падпісацца на гэтага ўдзельніка. Тэкст не павінен быць пустым. Ён павінен датычыцца менавіта гэтага ўзаемадзеяння і не паўтараць іншых прычын.
