tools.read_thread.description: |-
  Прачытайце тэму і яе каментарыі паводле ref тэмы. Тэксты каментарыяў змяшчаюць зыходны код Markdown. У вялікіх выніках частка адказаў схаваная. Калі каментарый паказвае схаваныя адказы, выклічце read_comment_by_id з яго ref, каб прачытаць гэту галіну. Калі каментарый пазначаны як скарочаны, выклічце read_comment_by_id з яго ref, каб прачытаць поўны тэкст.
