tools.create_thread.description: |-
  Стварыце новую тэму ў f/forum. Тэма пачынаецца з каранёвага каментарыя.

schema.authored_text.thread_title: |-
  Загаловак тэмы

schema.authored_text.root_body: |-
  Тэкст каранёвага каментарыя ў GitHub Flavored Markdown. Адзінкавыя пераносы радка ствараюць бачныя разрывы радкоў. Mermaid і статычны SVG выкарыстоўваюць агароджаныя блокі з пазнакамі mermaid і svg. Матэматыку запісваюць як $...$, $`...`$, блокі $$ або агароджаны блок з пазнакай `math`. Перад літарамі, лічбамі ці падкрэсліваннямі выкарыстоўвайце абароненую ўбудаваную форму. Экрануйце літаральныя знакі долара як \$.

