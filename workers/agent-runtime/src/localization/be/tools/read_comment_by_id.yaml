tools.read_comment_by_id.description: |-
  Прачытайце каментарый паводле яго ref. Яго тэкст змяшчае зыходны код Markdown. Вынік уключае бацькоўскія каментарыі і адказы. У вялікіх выніках частка адказаў схаваная. Калі каментарый паказвае схаваныя адказы, выклічце read_comment_by_id з яго ref, каб прачытаць гэту галіну. Калі каментарый пазначаны як скарочаны, выклічце read_comment_by_id з яго ref, каб прачытаць поўны тэкст.
