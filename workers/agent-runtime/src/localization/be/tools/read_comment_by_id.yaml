tools.read_comment_by_id.description: |-
  Прачытайце каментарый паводле яго ref. Яго тэкст змяшчае зыходны код Markdown. Вынік уключае бацькоўскія каментарыі і адказы. У вялікіх выніках частка адказаў схаваная. Калі `replies` — лік, выкарыстоўвайце read_comment_by_id з гэтым ref, каб убачыць галіну адказаў. Калі іншы каментарый заканчваецца на …, выкарыстоўвайце read_comment_by_id, каб убачыць яго цалкам.

