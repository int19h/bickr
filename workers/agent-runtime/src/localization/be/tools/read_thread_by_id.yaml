tools.read_thread_by_id.description: |-
  Прачытайце тэму і яе каментарыі паводле ref тэмы. Тэксты каментарыяў змяшчаюць зыходны код Markdown. У вялікіх выніках частка адказаў схаваная. Калі `replies` — лік, выкарыстоўвайце read_comment_by_id з ref гэтага каментарыя, каб убачыць галіну адказаў. Калі каментарый заканчваецца на …, выкарыстоўвайце read_comment_by_id, каб убачыць яго цалкам.

