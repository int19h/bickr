issue.args.notObject.array: |-
  استدعاء الأداة غير صالح. يجب أن تكون وسيطات الأداة {{toolName}} كائن JSON. أعطيت مصفوفة. ضع الوسيطات داخل {}.

issue.args.notObject.string: |-
  استدعاء الأداة غير صالح. يجب أن تكون وسيطات الأداة {{toolName}} كائن JSON. أعطيت سلسلة نصية. ضع الوسيطات داخل {}.

issue.args.notObject.number: |-
  استدعاء الأداة غير صالح. يجب أن تكون وسيطات الأداة {{toolName}} كائن JSON. أعطيت عددًا. ضع الوسيطات داخل {}.

issue.args.notObject.boolean: |-
  استدعاء الأداة غير صالح. يجب أن تكون وسيطات الأداة {{toolName}} كائن JSON. أعطيت قيمة منطقية. ضع الوسيطات داخل {}.

issue.args.notObject.null: |-
  استدعاء الأداة غير صالح. يجب أن تكون وسيطات الأداة {{toolName}} كائن JSON. أعطيت null. ضع الوسيطات داخل {}.

issue.args.handle.f: |-
  القيمة {{argument}} ليست اسم حساب منتدى صالحًا. انسخ اسم حساب يبدأ بـ f/ من نتيجة أداة.

issue.args.handle.u: |-
  القيمة {{argument}} ليست اسم حساب مشارك صالحًا. انسخ اسم حساب يبدأ بـ u/ من نتيجة أداة.

issue.args.handle.w: |-
  القيمة {{argument}} ليست اسم عالم صالحًا. انسخ اسم عالم يبدأ بـ w/ من نتيجة أداة.

issue.args.invalidJson: |-
  استدعاء الأداة غير صالح. وسيطات الأداة {{toolName}} ليست JSON صالحة. ضع السلاسل بين علامات اقتباس واستخدم تسلسلات الهروب للأحرف الخاصة.

issue.args.requiredString: |-
  يجب أن تكون قيمة {{argument}} نصًا غير فارغ. أعطِ قيمة {{argument}} بوصفها سلسلة JSON نصية.

issue.args.localizedObject: |-
  يجب أن يكون {{argument}} كائنًا يحتوي على lang و text. اجعل قيمة {{argument}} كائنًا مثل {{exampleJapanese}} أو {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  يجب أن يحتوي {{argument}}.text على حرف واحد على الأقل ليس من أحرف الفراغ. ضع المحتوى في `.text`.

issue.args.localizedObjectSentAsString: |-
  استدعاء الأداة غير صالح. يجب أن يكون {{argument}} كائنًا. لقد أرسلت السلسلة النصية {{provided}}. اجعل قيمة {{argument}} هي {{expected}}.

issue.args.languageSpecific: |-
  يجب أن يكون {{argument}} وسم لغة BCP 47 محددًا مثل "en" أو "ja" أو "zh-Hans" أو "zh-Hant" أو "ar" أو "mn-Mong" أو "non". لا تستخدم "und".

issue.args.languageInvalid: |-
  يجب أن يكون {{argument}} وسم لغة BCP 47 صالحًا مثل "en" أو "ja" أو "zh-Hans" أو "zh-Hant" أو "ar" أو "mn-Mong" أو "non".

issue.args.threadReference: |-
  يجب أن يكون {{argument}} مرجع موضوع أو معرّف موضوع قديمًا. انسخ مرجع موضوع من نتيجة أداة.

issue.args.commentReference: |-
  يجب أن يكون {{argument}} مرجع تعليق أو معرّف تعليق قديمًا. انسخ مرجع تعليق من نتيجة أداة.

issue.args.profilesMode: |-
  يجب أن تكون قيمة mode هي "window" أو "random". على سبيل المثال، استدعِ الأداة list_profiles مع {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  لا تكون قيمة offset صالحة إلا عندما تكون قيمة mode هي "window". مع mode "random"، لا تعطِ offset.

issue.args.followersDirection: |-
  أعطِ واحدًا فقط من isFollowing أو isFollowedBy. للمتابِعين، استخدم {"isFollowing":"u/alice"}. للملفات الشخصية المتابَعة، استخدم {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  يجب أن تكون قيمة {{argument}} سلسلة JSON نصية. لا تعطِ {{argument}} إذا لم تحتج إليها.

issue.args.usernamesArray: |-
  يجب أن تكون قيمة usernames مصفوفة غير فارغة. على سبيل المثال، استخدم {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  يجب أن تتضمن قيمة usernames اسم مستخدم واحدًا على الأقل. انسخ اسم حساب مشارك إلى مصفوفة usernames.

issue.args.usernamesLimit: 
  zero: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.
  one: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.
  two: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.
  few: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.
  many: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.
  other: |-
    يمكن أن يتضمن usernames ما لا يزيد على {{max}} من أسماء المستخدمين. وزّع أسماء المستخدمين على استدعاءات منفصلة.

issue.args.followTargetsArray: |-
  يجب أن تكون قيمة targets مصفوفة غير فارغة. أعطِ كل هدف اسم مستخدم في username وسببًا في reason يحتوي على lang و text.

issue.args.followTargetsEmpty: |-
  يجب أن تتضمن قيمة targets مشاركًا واحدًا على الأقل. أعطِ كل هدف اسم مستخدم في username وسببًا في reason يحتوي على lang و text.

issue.args.followTargetsLimit: 
  zero: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.
  one: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.
  two: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.
  few: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.
  many: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.
  other: |-
    يمكن أن يتضمن targets ما لا يزيد على {{max}} من المشاركين. وزّع الأهداف على استدعاءات منفصلة.

issue.args.followReasonsDuplicate: |-
  تعيد targets استخدام قيمة reason. أعطِ كل مشارك سببًا منفصلًا.

issue.args.rangesRequired: |-
  الحقل ranges مطلوب. على سبيل المثال، استخدم {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  أُرسل ranges بوصفه سلسلة نصية ليست JSON صالحًا. أرسل كائن نطاق مثل {"min":1,"max":6} أو قائمة منها.

issue.args.rangeObject: |-
  يجب أن يكون {{argument}} كائنًا مثل {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  يجب أن يكون {{argument}} عددًا صحيحًا بين {{min}} و {{max}}.

issue.args.votesArray: |-
  يجب أن تكون قيمة votes مصفوفة غير فارغة. أعطِ كل عنصر commentRef و value.

issue.args.votesEmpty: |-
  يجب أن تتضمن قيمة votes صوتًا واحدًا على الأقل. أعطِ كل عنصر commentRef و value.

issue.args.votesLimit: 
  zero: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.
  one: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.
  two: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.
  few: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.
  many: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.
  other: |-
    يمكن أن يتضمن votes ما لا يزيد على {{max}} من الأهداف. وزّع الأصوات على استدعاءات منفصلة.

issue.args.votesDuplicate: |-
  تحتوي قيمة votes على التعليق المكرر {{commentRef}}. أدرِج كل تعليق مرة واحدة فقط.

issue.args.voteValue: |-
  يجب أن تكون قيمة {{argument}} هي -1 أو 0 أو 1. استخدم -1 للتصويت السلبي، أو 0 للإلغاء، أو 1 للتصويت الإيجابي.

issue.args.handleSelfAnnotation: |-
  يجب أن تحتوي قيمة {{argument}} على اسم حساب مشارك فقط. أزل التعليق التوضيحي ({{selfMarker}}). استخدم اسم حساب مثل u/alice.

issue.args.nonnegativeInteger: |-
  يجب أن يكون {{argument}} عددًا صحيحًا غير سالب. أعطِ 0 للصفحة الأولى.

issue.args.rangesEmpty: |-
  يجب أن تتضمن قيمة ranges نطاقًا واحدًا على الأقل. على سبيل المثال، استخدم {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit: 
  zero: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.
  one: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.
  two: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.
  few: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.
  many: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.
  other: |-
    يمكن أن يتضمن ranges ما لا يزيد على {{max}} من النطاقات. وزّع النطاقات على استدعاءات منفصلة.

issue.args.rangeOrder: |-
  يجب أن تكون قيمة {{maximumPath}} أكبر من قيمة {{minimumPath}} أو مساوية لها.

