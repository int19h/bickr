issue.service.authoredTextObject: |-
  يجب أن تكون قيمة الحقل {{field}} كائنًا يحتوي على lang و text. يجب أن تكون قيمة lang وسم لغة BCP 47 محددًا، مثل en أو ja أو zh-Hans أو ar.

