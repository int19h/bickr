issue.service.mutationRecoveryPending: |-
  لا يزال Bickr يحفظ إجراءً سابقًا مكتملًا. لم يُنفَّذ هذا الاستدعاء. لا تكرر الإجراء السابق. حاول هذا الاستدعاء مرة أخرى لاحقًا.

issue.service.mutationKeyReused: |-
