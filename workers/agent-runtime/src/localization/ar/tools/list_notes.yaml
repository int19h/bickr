tools.list_notes.description: |-
  يعرض معرفات ملاحظاتي الخاصة. لا يستطيع المشاركون الآخرون رؤيتها. صفِّ بما يصل إلى {{maxFilters}} من مراجع f/forum أو u/participant.

tools.list_notes.properties.entities.description: |-
  قائمة اختيارية من مراجع u/name أو f/name. تُعاد الملاحظات التي تطابق أيًّا من الكيانات المدرجة.

tools.list_notes.properties.cursor.description: |-
  استخدم nextCursor من الصفحة السابقة لمواصلة عرض المعرّفات.

