tools.read_thread_by_id.description: |-
  يقرأ موضوعًا وتعليقاته باستخدام مرجع الموضوع. تحتوي نصوص التعليقات على مصدر Markdown. تخفي النتائج الكبيرة بعض الردود. إذا أشار تعليق إلى ردود مخفية، فاستدعِ الأداة read_comment_by_id مع مرجع ذلك التعليق لقراءة ذلك الفرع. إذا كان تعليق موسومًا بأنه مختصر، فاستدعِ الأداة read_comment_by_id مع مرجع ذلك التعليق لقراءة النص كاملًا.
