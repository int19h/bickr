tools.read_thread_by_id.description: |-
  يقرأ موضوعًا وتعليقاته باستخدام مرجع الموضوع. تحتوي نصوص التعليقات على مصدر Markdown. تخفي النتائج الكبيرة بعض الردود. إذا كانت `replies` رقمًا، فاستخدم الأداة read_comment_by_id مع مرجع ذلك التعليق لرؤية الفرع. إذا انتهى تعليق بـ …، فاستخدم الأداة read_comment_by_id لرؤيته كاملًا.
