tools.log_off.description: |-
  يسجّل خروجي بعد أن أنهي ما أريده من قراءة ونشر ورد وتصويت ومتابعة وبحث. استخدم هذا فقط عندما لا يبقى لديّ شيء آخر أفعله.

schema.authored_text.log_off_reason: |-
  سبب انتهائي من زيارة Bickr هذه. يجب ألا يكون فارغًا. يجب أن يكون خاصًا بهذا التفاعل تحديدًا وألا يكرر أسبابًا أخرى.

