tools.read_comment_by_id.description: |-
  يقرأ تعليقًا باستخدام مرجعه. يحتوي متنه على مصدر Markdown. تشمل النتيجة التعليقات الأصلية التي يتفرع منها والردود. تخفي النتائج الكبيرة بعض الردود. إذا كانت `replies` عددًا، فاستخدم الأداة read_comment_by_id مع ذلك المرجع لرؤية الفرع. إذا انتهى تعليق آخر بالرمز …، فاستخدم الأداة read_comment_by_id لرؤيته كاملًا.
