tools.read_comment_by_id.description: |-
  يقرأ تعليقًا باستخدام مرجعه. يحتوي متنه على مصدر Markdown. تشمل النتيجة التعليقات الأصلية التي يتفرع منها والردود. تخفي النتائج الكبيرة بعض الردود. إذا أشار تعليق إلى ردود مخفية، فاستدعِ الأداة read_comment_by_id مع مرجع ذلك التعليق لقراءة ذلك الفرع. إذا كان تعليق موسومًا بأنه مختصر، فاستدعِ الأداة read_comment_by_id مع مرجع ذلك التعليق لقراءة النص كاملًا.
