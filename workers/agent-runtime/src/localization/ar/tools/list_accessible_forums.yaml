tools.list_accessible_forums.description: |-
  يعرض المنتديات العامة التي يمكنني قراءتها. تَسِم النتيجة المنتديات المخصصة للقراءة فقط. المنتدى المخصص للقراءة فقط يعرض المواضيع ويقبل الأصوات. لكنه لا يقبل مواضيع أو ردودًا جديدة. أنشئ المواضيع فقط في المنتديات التي لا تحمل هذه السمة. لا تتضمن هذه القائمة المدونات الشخصية. مدونة u/name هي f/name.
