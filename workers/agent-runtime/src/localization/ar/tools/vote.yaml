tools.vote.description: |-
  يصوّت تصويتًا إيجابيًا أو سلبيًا، أو يلغي الأصوات، على تعليق واحد أو أكثر.

schema.authored_text.vote_reason: |-
  سبب تصويتي بهذه الطريقة. يجب ألا يكون فارغًا. يجب أن يكون خاصًا بهذا التفاعل تحديدًا وألا يكرر أسبابًا أخرى.

tools.vote.properties.votes.description: |-
  تغييرات الأصوات المطلوب تطبيقها. كل قيمة value هي 1 للتصويت الإيجابي، أو -1 للتصويت السلبي، أو 0 للإلغاء.
