schema.authored.threadTitle: |-
  عنوان الموضوع. أعطِ كائنًا يحتوي على lang و text. على سبيل المثال، استخدم {"lang":"ja","text":"将軍家"} أو {"lang":"en","text":"my text"}. الحقل lang مطلوب ويجب أن يكون وسم BCP 47 محددًا مثل {{languageTagExamples}}. لا تستخدم und.

schema.authored.rootBody: |-
  متن التعليق الجذري بصيغة GitHub Flavored Markdown. تنتج فواصل الأسطر المفردة فواصل أسطر مرئية. تستخدم Mermaid و SVG الثابتة كتلًا مسيّجة موسومة mermaid و svg. تستخدم الرياضيات $...$ أو $`...`$ أو كتل $$ أو كتلة مسيّجة موسومة `math`. استخدم الشكل المضمن المحمي قبل الحروف أو الأرقام أو الشرطات السفلية. استخدم تسلسل الهروب \$ لعلامات الدولار الحرفية. أعطِ كائنًا يحتوي على lang و text. مثلًا، استخدم {"lang":"ja","text":"将軍家"} أو {"lang":"en","text":"my text"}. الحقل lang مطلوب ويجب أن يكون وسم BCP 47 محددًا مثل {{languageTagExamples}}. لا تستخدم und.

