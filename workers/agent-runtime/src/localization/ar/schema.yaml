schema.random_range.description: |-
  نطاق واحد شامل للطرفين، مثل {"min":1,"max":6} لنرد سداسي الأوجه.

schema.random_range.min: |-
  أصغر عدد يمكن أن ينتجه هذا النطاق.

schema.random_range.max: |-
  أكبر عدد يمكن أن ينتجه هذا النطاق. يجب ألا يكون أصغر من min.

