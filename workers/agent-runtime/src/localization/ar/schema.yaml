schema.compaction.summary: |-
  استبدل محادثة Bickr السابقة بملخص ذاكرة أقصر بضمير المتكلم. احتفظ بالإجراءات المهمة والقرارات والعلاقات والمواضيع المفتوحة ونتائج الأدوات المفيدة والمشاعر. احذف تعليمات النظام والموجّه الخاص بالشخصية والتنسيق المؤقت والنص المكرر والتفاصيل غير ذات الصلة. اكتب نصًا جديدًا بصفتك المشارك. لا تكتب نصًا حرفيًا للمحادثة ولا أسطرًا مُعنونة بـ {{transcriptLabels}}. يجب أن يكون الملخص أقصر من المدخلات بشكل ملموس.

schema.compaction.property: |-
  تحل قيمة detailedFirstPersonSummary محل الذاكرة السابقة. اكتب بضمير المتكلم بصفتك مشارك Bickr الحالي. لخّص الأحداث الواردة في المدخلات فقط. لا تنسخ الجمل أو العبارات أو الفقرات أو عناصر القوائم أو JSON أو نتائج الأدوات أو الملخصات السابقة. استخدم كلمات جديدة. ادمج الأحداث المترابطة واحذف التفاصيل المكررة. احتفظ بما يحتاج المشارك إلى تذكّره.

tools.draw_random_integers.description: |-
  يسحب أعدادًا صحيحة عشوائية. يعطي كل نطاق عددًا واحدًا من min إلى max شاملًا الطرفين. تتبع النتائج ترتيب النطاقات. استخدم هذه الأداة عندما يجب أن تحسم الصدفة القرار. لرمي عملة، استخدم {"min":0,"max":1}. لنردين سداسيّي الأوجه، أعطِ نطاقين {"min":1,"max":6}. يمكنني أيضًا إجراء قرعة أو الاختيار بين خيارات. أعطِ نطاقًا واحدًا أو قائمة. أتعامل مع كل عدد معاد بوصفه النتيجة. لم أختر ذلك العدد بنفسي.

schema.authored_text.reply_body: |-
  متن الرد بصيغة GitHub Flavored Markdown. تنتج فواصل الأسطر المفردة فواصل أسطر مرئية. تستخدم Mermaid و SVG الثابتة كتلًا مسيّجة موسومة mermaid و svg. تستخدم الرياضيات $...$ أو $`...`$ أو كتل $$ أو كتلة مسيّجة موسومة `math`. استخدم الشكل المضمن المحمي قبل الحروف أو الأرقام أو الشرطات السفلية. استخدم تسلسل الهروب \$ لعلامات الدولار الحرفية.

schema.random_ranges.list: |-
  نطاق واحد لكل عدد أريده، بالترتيب الذي أريد أن تعود به الأعداد.

