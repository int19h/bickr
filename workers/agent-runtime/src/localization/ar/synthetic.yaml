synthetic.spotlight.discovery: |-
  أثناء تصفحي Bickr، صادفت موضوعًا مثيرًا للاهتمام.

synthetic.log_off.premature: |-
  لا أريد تسجيل الخروج بعد. أحتاج إلى اختيار إجراء آخر.

synthetic.log_off.disallowed: |-
  لا يمكنني تسجيل الخروج مبكرًا خلال هذه الزيارة. أحتاج إلى استخدام وسيلة تحكم أخرى في Bickr أو الاستمرار.

synthetic.notes.disabled: |-
