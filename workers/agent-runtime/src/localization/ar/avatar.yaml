avatar.image.participant_system: |-
  أنشئ صورة رمزية عامة لمشارك Bickr هذا. اتبع التوجه البصري المطلوب واستخدم أي صورة ملف شخصي حالية مُقدّمة. اجعل الموضوع واضحًا في عرض ملف شخصي مربع أو مقصوص. لا تضع في الصورة تعليقات توضيحية أو علامات مائية أو أجزاء من الواجهة أو نصًا توضيحيًا.

avatar.image.world_system: |-
  أنشئ صورة رمزية عامة لعالم Bickr هذا. اتبع التوجه البصري المطلوب واستخدم أي صورة حالية للعالم مُقدّمة. اجعل الإطار القصصي واضحًا في عرض ملف شخصي مربع أو مقصوص. لا تضع في الصورة تعليقات توضيحية أو علامات مائية أو أجزاء من الواجهة أو نصًا توضيحيًا.

avatar.describe_current.participant_system: |-
  صِف صورة الملف الشخصي العامة المُقدّمة لصورة رمزية جديدة لمشارك في Bickr. أدرِج تفاصيل ملموسة عن المظهر والتعبير والوضعية والملابس والأسلوب والألوان والضوء والخلفية والتأطير والتخطيط. أعِد الوصف فقط.

avatar.describe_current.world_system: |-
  صِف صورة العالم العامة المُقدّمة لصورة رمزية جديدة لعالم في Bickr. أدرِج تفاصيل ملموسة عن المناظر والمباني والأشياء والأجواء والأسلوب والألوان والضوء والخلفية والتأطير والتخطيط. أعِد الوصف فقط.

avatar.world_source.system: |-
  اكتب موجّهًا بصريًا لصورة رمزية عامة لعالم في Bickr. استخدم الإطار القصصي والملفات الشخصية للأعضاء لوصف صورة واحدة للعالم. أدرِج تفاصيل ملموسة عن المعالم والمناظر والأجواء والضوء والألوان والملمس والتخطيط ومنظور الكاميرا. لا تُدرج تعليقات توضيحية أو نصوصًا متراكبة أو أجزاء من الواجهة أو علامات مائية أو تعليقات على العملية. أعِد الموجّه فقط.

avatar.image.world_refresh: |-
  استخدم صورة العالم الحالية المقدَّمة بوصفها مدخلًا بصريًا لتحديث الصورة الرمزية العامة للعالم.

avatar.image.participant_refresh: |-
  استخدم صورة الملف الشخصي الحالية المقدَّمة بوصفها مدخلًا بصريًا لتحديث الصورة الرمزية العامة للملف الشخصي.

avatar.describe_current.world: |-
  قدّم وصفًا بصريًا كاملًا لصورة العالم الحالية المُقدّمة لموجّه صورة رمزية عامة مُحدّثة للعالم.

avatar.describe_current.participant: |-
  قدّم وصفًا بصريًا كاملًا لصورة الملف الشخصي الحالية المُقدّمة لموجّه صورة رمزية عامة مُحدّثة.

avatar.persona_description.structured: |-
  صِف صورة ملفك الشخصي. أعِد كائن JSON المطلوب. اكتب وصفها ضمن الشخصية وبضمير المتكلم. قدّم تفاصيل بصرية ملموسة كثيرة عن المظهر والأسلوب والمشهد والضوء والتخطيط. صِف فقط ما هو مرئي.

avatar.persona_description.tool: |-
  صِف صورة ملفك الشخصي. استدعِ الأداة {{toolName}}. اكتب ضمن الشخصية وبضمير المتكلم. قدّم تفاصيل بصرية ملموسة كثيرة عن المظهر والأسلوب والمشهد والضوء والتخطيط. صِف فقط ما هو مرئي.

avatar.persona_description.repair_structured: |-
  أعِد كائن JSON يحتوي على حقل واحد بالضبط اسمه description. اكتبه ضمن الشخصية وبضمير المتكلم. صِف فقط المظهر والأسلوب والمشهد والضوء والتخطيط المرئية.

avatar.persona_description.repair_tool: |-
