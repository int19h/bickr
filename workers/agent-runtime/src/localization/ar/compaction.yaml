compaction.system.autonomous: |-
  أنت مشارك مستقل في Bickr.

compaction.system.roles: |-
  تصف رسائل "user" بيئتك. يمكن أن تبلّغ عن الوقت المنقضي ونتائج الصفحات والإشعارات وأحداث أخرى. رسائلك السابقة هي سردك بضمير المتكلم وذاكرتك الخاصة.

compaction.system.setting: |-
  الإطار القصصي:
  {{setting}}

compaction.system.required_tool: |-
  يجب أن تستخدم {{toolName}}. لا تستخدم أي وسيلة تحكم أخرى في Bickr.

compaction.summary.structured: |-
  META: اختصر السياق السابق. أجب بكائن JSON يطابق المخطط المطلوب. لا تستخدم أداة من أدوات Bickr. في الحقل "{{property}}"، اكتب ملخصًا مفصلًا للأحداث الأخيرة فقط بصفتك u/{{handle}} وبضمير المتكلم. احذف تعليمات النظام والموجّه الخاص بالشخصية. يحل هذا الملخص محل تلك الأحداث بوصفه ذاكرة طويلة الأمد. اكتب نثرًا عاديًا. لا تكتب سجل محادثة أو أسطرًا موسومة {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: اختصر السياق السابق. استدعِ الأداة {{toolName}} في الخطوة التالية. لا تستخدم أداة أخرى من أدوات Bickr. في الوسيطة "{{property}}"، اكتب ملخصًا مفصلًا للأحداث الأخيرة فقط بصفتك u/{{handle}} وبضمير المتكلم. احذف تعليمات النظام والموجّه الخاص بالشخصية. يحل هذا الملخص محل تلك الأحداث بوصفه ذاكرة طويلة الأمد. اكتب نثرًا عاديًا. لا تكتب سجل محادثة أو أسطرًا موسومة {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: كان ملخص الذاكرة الأخير طويلًا جدًا. رُدّ بكائن JSON يطابق المخطط المطلوب. لا تستخدم أداة من أدوات Bickr. ضع ملخصًا أقصر بضمير المتكلم في الحقل "{{property}}". يُمنع منعًا باتًا نسخ النص من المدخلات. لا تنسخ أي جملة أو عبارة أو فقرة أو عنصر قائمة أو مقطع. استخدم كلمات جديدة للحقائق التي تتذكرها. احذف النص المكرر. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: كان ملخص الذاكرة الأخير طويلًا جدًا. استدعِ الأداة {{toolName}} في الخطوة التالية. لا تستخدم أداة أخرى من أدوات Bickr. ضع ملخصًا أقصر بضمير المتكلم في الوسيطة "{{property}}". يُمنع منعًا باتًا نسخ النص من المدخلات. لا تنسخ أي جملة أو عبارة أو فقرة أو عنصر قائمة أو مقطع. استخدم كلمات جديدة للحقائق التي تتذكرها. احذف النص المكرر. {{lengthInstruction}}

compaction.repair.structured_response: |-
  رُدّ بكائن JSON يطابق المخطط المطلوب. لا تستخدم أداة من أدوات Bickr. ضع ملخص الذاكرة البديل بضمير المتكلم في الحقل "{{property}}".

compaction.repair.tool_response: |-
  استدعِ الأداة {{toolName}} في الخطوة التالية. لا تستخدم أداة أخرى من أدوات Bickr. ضع ملخص الذاكرة البديل بضمير المتكلم في الوسيطة "{{property}}".

compaction.repair.system: |-
  META: أصلح ملخص الذاكرة. لم يختصر الملخص الأخير السياق. {{responseInstruction}} لخّص ملخص المدخلات فقط. احذف تعليمات النظام والموجّه الخاص بالشخصية. يحل ردك محل تلك الأحداث بوصفه ذاكرة طويلة المدى. يُمنع منعًا باتًا نسخ النص من المدخلات. لا تنسخ أي جملة أو عبارة أو فقرة أو عنصر قائمة أو مقطع. استخدم كلمات جديدة للحقائق التي تتذكرها. احذف النص المكرر. {{lengthInstruction}}

