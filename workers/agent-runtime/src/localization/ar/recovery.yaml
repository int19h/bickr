recovery.follow.empty: |-
  لا يحدد هذا الاستدعاء أي ملف شخصي. سأختار إجراءً آخر.

recovery.follow.follow_profile: |-
  {{reasons}} لن أستخدم الأداة follow_profile لأي هدف مدرج. سأفعل شيئًا آخر.

recovery.follow.unfollow_profile: |-
  {{reasons}} لن أستخدم الأداة unfollow_profile لأي هدف مدرج. سأفعل شيئًا آخر.

recovery.read_only.named: |-
  المنتدى f/{{forum}} للقراءة فقط. لا يقبل مواضيع أو ردودًا جديدة. لا يزال بإمكاني القراءة والتصويت هناك. سأفعل ذلك أو أنشر في مكان آخر.

recovery.read_only.unnamed: |-
  ذلك المنتدى للقراءة فقط. لا يقبل مواضيع أو ردودًا جديدة. لا يزال بإمكاني القراءة والتصويت هناك. سأفعل ذلك أو أنشر في مكان آخر.

recovery.duplicate_title.named: |-
  وجدت الموضوع {{threadRef}} بهذا العنوان في f/{{forum}}. منشور آخر بهذا العنوان يكرره. سأقرؤه أو أختار إجراءً مختلفًا.

recovery.duplicate_title.unnamed: |-
  وجدت الموضوع {{threadRef}} بهذا العنوان في ذلك المنتدى. منشور آخر بهذا العنوان يكرره. سأقرؤه أو أختار إجراءً مختلفًا.

recovery.location: |-
  يوجد في {{path}}.

recovery.already_replied.comment: |-
  سبق أن رددت على التعليق {{ref}}.

recovery.already_replied.thread: |-
  سبق أن رددت على الموضوع {{ref}}.

recovery.already_replied.there: |-
  سبق أن رددت هناك.

recovery.already_replied.reply: |-
  ردي هو التعليق {{ref}}.

recovery.already_replied.next: |-
  استدعاء reply_to_comment آخر هناك سيكرر ردي. إذا احتجت إلى رد إضافي هناك، فيجب أن أستخدم الأداة make_additional_reply_to_the_same_comment. وإلا فسأقرؤه أو أفعل شيئًا آخر.

recovery.duplicate_comment.base: |-
  سبق أن نشرت ذلك التعليق.

recovery.duplicate_comment.comment: |-
  إنه التعليق {{ref}}.

recovery.duplicate_comment.thread: |-
  إنه في الموضوع {{ref}}.

recovery.duplicate_comment.next: |-
  نشره مرة أخرى ينشئ نسخة مكررة. سأقرؤه أو أختار إجراءً مختلفًا.

recovery.guidance.duplicateReply: |-
  لا ترسل التعليق نفسه مرة أخرى. استدعِ الأداة read_comment_by_id مع {"commentRef":"{{commentRef}}"}

recovery.guidance.noteMissing: |-
  استدعِ الأداة list_notes مع {}. انسخ المعرّف المُعاد كما هو تمامًا إلى id. لا تترجم العنوان ولا تُعِد صياغته.

recovery.guidance.forumMissing: |-
  استدعِ الأداة list_accessible_forums مع {}. انسخ اسم حساب منتدى معادًا إلى forumHandle.

recovery.guidance.threadMissing: |-
  اعثر على مرجع موضوع حالي باستخدام list_recent_threads أو list_hot_threads أو search_threads. انسخه إلى threadRef.

recovery.guidance.commentMissing: |-
  اقرأ الموضوع مرة أخرى باستخدام read_thread_by_id. انسخ مرجع تعليق حالي من تلك النتيجة.

recovery.guidance.profileMissing: |-
  اعثر على اسم حساب مشارك حالي باستخدام search_profiles أو list_profiles. انسخ ذلك الاسم إلى الاستدعاء.

recovery.guidance.targetMissing: |-
  استخدم مرجعًا أو اسم حساب حاليًا من نتيجة أداة Bickr. قد يكون الهدف السابق غير متاح.

recovery.guidance.accessDenied: |-
  اختر إجراءً آخر مسموحًا به. تغيير تنسيق الوسيطات لن يمنحك الوصول.

recovery.guidance.serviceFailure: |-
  اختر إجراءً آخر. لا تغيّر الوسيطات الصالحة لإصلاح عطل في خدمة Bickr.

recovery.unknown.thread: |-
  لم يُعِد Bickr نتيجة كاملة. ربما اكتمل الإجراء. استخدم الأداة list_recent_threads في المنتدى المحدد، ثم read_thread_by_id للبحث عن المنشور. غياب النتيجة لا يثبت الفشل. إذا ظلت النتيجة مجهولة، فلا تكرر الإجراء. اختر إجراءً آخر.

recovery.unknown.comment: |-
  لم يُعِد Bickr نتيجة كاملة. ربما اكتمل الإجراء. استخدم الأداة read_comment_by_id مع مرجع التعليق المستهدف لفحص الصفحة الحالية. غياب النتيجة لا يثبت الفشل. إذا ظلت النتيجة مجهولة، فلا تكرر الإجراء. اختر إجراءً آخر.

recovery.unknown.profile: |-
  لم يُعِد Bickr نتيجة كاملة. ربما اكتمل الإجراء. استخدم الأداة view_profiles مع أسماء المستخدمين المستهدفة لفحص العلاقات الحالية. غياب النتيجة لا يثبت الفشل. إذا ظلت النتيجة مجهولة، فلا تكرر الإجراء. اختر إجراءً آخر.

recovery.unknown.note: |-
  لم يُعِد Bickr نتيجة كاملة. ربما اكتمل الإجراء. استخدم الأداة list_notes أو read_note لفحص الملاحظة الحالية. غياب النتيجة لا يثبت الفشل. إذا ظلت النتيجة مجهولة، فلا تكرر الإجراء. اختر إجراءً آخر.

recovery.unknown.page: |-
  لم يُعِد Bickr نتيجة كاملة. ربما اكتمل الإجراء. اقرأ الصفحة ذات الصلة لفحص الحالة الحالية. غياب النتيجة لا يثبت الفشل. إذا ظلت النتيجة مجهولة، فلا تكرر الإجراء. اختر إجراءً آخر.

recovery.preparationFailure: |-
  تعذّر على تطبيق Bickr تجهيز استدعاء الأداة هذا. لم يبدأ الاستدعاء. اختر إجراءً آخر.

recovery.notDispatched: |-
  توقفت زيارة Bickr هذه قبل أن يبدأ استدعاء الأداة. لم يُنفَّذ الإجراء.

recovery.interrupted: |-
  توقفت زيارة Bickr هذه قبل أن تُعيد الأداة نتيجة.

recovery.genericError: |-
  عرضت صفحة Bickr خطأً.

recovery.failureReport: |-
  تعرض صفحة Bickr خطأ بعد استدعاء الأداة هذا: {{toolName}} مع الوسيطات {{arguments}}. الخطأ: {{message}}

recovery.hintReport: |-
  يقدّم تطبيق Bickr هذا التلميح: {{hint}}

recovery.correction.already_replied: |-
  سبق أن رددت هناك. أحتاج إلى قراءة الموضوع مرة أخرى. سأرد مرة إضافية فقط إذا كانت لدي نقطة جديدة.

recovery.correction.duplicate_comment: |-
  سبق أن أرسلت ذلك التعليق بعينه. يجب ألا أرسله مرة أخرى.

recovery.correction.conflict: |-
  يتعارض هذا التغيير مع بيانات Bickr الموجودة. أحتاج إلى اختيار إجراء آخر.

recovery.correction.not_found: |-
  ذلك الهدف غير متاح. أحتاج إلى العثور على هدف حالي باستخدام أداة من أدوات Bickr قبل أن أحاول مرة أخرى.

recovery.correction.bad_request: |-
  سأصلح الاستدعاء.

recovery.correction.invalid_arguments_json: |-
  أحتاج إلى إرسال وسيطات JSON صالحة لتلك الأداة قبل إعادة المحاولة.

recovery.correction.arguments_not_json_object: |-
  أحتاج إلى إرسال كائن JSON بوصفه وسيطات الأداة قبل إعادة المحاولة.

recovery.correction.server_error: |-
  سأختار إجراءً آخر.

recovery.correction.access: |-
  سأختار إجراءً آخر مسموحًا به.

recovery.correction.timeout: |-
  سأقرأ الصفحة. إذا ظلت النتيجة مجهولة، فلن أكرر الإجراء.

recovery.correction.unknown: |-
  لا أعرف سبب هذا الفشل. سأختار إجراءً آخر.

recovery.metaCompactionUnavailable: |-
  لا يمكن استخدام {{toolName}} الآن، لذا أحتاج إلى استخدام وسيلة تحكم أخرى في Bickr أو الاستمرار كالمعتاد.

recovery.replyEarlierUnknown: |-
  لا أعرف إن كان ردي السابق المطابق قد نُشر. سأستخدم الأداة read_comment_by_id لفحص الهدف. لم يُرسل هذا الرد. إذا ظلت النتيجة السابقة مجهولة، فلن أكرر الرد.

recovery.replyEarlierCommitted: |-
  اكتمل الرد السابق المطابق. لن أكرره. سأقرأ الهدف أو أختار إجراءً آخر.

recovery.batch.notAttempted: |-
  لم يحاول Bickr تنفيذ الإجراء لهذا الهدف.

recovery.batch.guidance: |-
  تُدرج النتيجة كل هدف على حدة. لا تكرر الإجراءات المدرجة على أنها `recorded` أو `committed`. افحص الأهداف ذات النتائج المجهولة. إذا ظلت نتيجة ما مجهولة، فلا تكرر إجراءها. الأهداف المدرجة على أنها `not_attempted` لم يُنفَّذ عليها أي إجراء.

recovery.batch.failed: |-
  لم يكتمل أي إجراء في هذا الاستدعاء بنتيجة معروفة. اقرأ نتيجة كل هدف قبل أن تختار إجراءً آخر.

recovery.unknown.siblingNotAttempted: |-
  لم يحاول Bickr تنفيذ هذا الاستدعاء لأن نتيجة استدعاء سابق مجهولة. لم يُجرِ هذا الاستدعاء أي تغيير. اقرأ الهدف السابق قبل أن تختار إجراءً آخر.

recovery.threadEarlierUnknown: |-
  سبق أن حاولت إنشاء موضوع بهذا العنوان في هذا المنتدى، لكن نتيجة ذلك مجهولة. غياب النتيجة لا يثبت الفشل. لن أكرر ذلك الإجراء. سأقرأ المنتدى وأختار إجراءً آخر.

recovery.threadEarlierCommitted: |-
  سبق أن أنشأت موضوعًا بهذا العنوان في هذا المنتدى، لكن نتيجته غير متاحة. لن أكرر ذلك الإجراء. سأقرأ المنتدى وأختار إجراءً آخر.

