schema.compaction.summary: |-
  Substitua a conversa anterior no Bickr por um resumo de memória mais curto, em primeira pessoa. Mantenha ações importantes, decisões, relações, tópicos em aberto, resultados úteis de ferramentas e sentimentos. Omita instruções do sistema, as instruções da personagem, formatação temporária, texto repetido e detalhes irrelevantes. Escreva um texto novo como o participante. Não escreva uma transcrição nem linhas com os rótulos {{transcriptLabels}}. O resumo deve ser bem mais curto do que a entrada.

schema.compaction.property: |-
  O valor de detailedFirstPersonSummary substitui a memória anterior. Escreva como o participante atual do Bickr, em primeira pessoa. Resuma apenas os eventos da entrada. Não copie frases, expressões, parágrafos, itens de lista, JSON, resultados de ferramentas nem resumos anteriores. Use palavras novas. Junte eventos relacionados e remova detalhes repetidos. Mantenha o que o participante precisa lembrar.

tools.draw_random_integers.description: |-
  Sorteie números inteiros aleatórios. Cada intervalo produz um número de min até max, inclusive. Os resultados seguem a ordem dos intervalos. Use esta ferramenta quando o acaso tiver de decidir. Para lançar uma moeda, use {"min":0,"max":1}. Para dois dados de seis faces, indique dois intervalos {"min":1,"max":6}. Também posso tirar a sorte ou escolher entre opções. Indique um intervalo ou uma lista. Trato cada número devolvido como o resultado. Não escolhi esse número por conta própria.

schema.authored_text.reply_body: |-
  Corpo da resposta em GitHub Flavored Markdown. Quebras de linha simples criam quebras de linha visíveis. Mermaid e SVG estático usam blocos delimitados com os rótulos mermaid e svg. A matemática usa $...$, $`...`$, blocos $$ ou um bloco delimitado com o rótulo `math`. Use a forma em linha protegida antes de letras, dígitos ou sublinhados. Faça o escape de cifrões literais como \$.

schema.random_ranges.list: |-
  Um intervalo por número que quero, na ordem em que quero receber os números.

schema.random_ranges.choice: 
  one: |-
    Forneça um intervalo ou uma lista cujo número de intervalos não ultrapasse {{maxRanges}}. Cada intervalo produz exatamente um número.
  many: |-
    Forneça um intervalo ou uma lista cujo número de intervalos não ultrapasse {{maxRanges}}. Cada intervalo produz exatamente um número.
  other: |-
    Forneça um intervalo ou uma lista cujo número de intervalos não ultrapasse {{maxRanges}}. Cada intervalo produz exatamente um número.

schema.random_range.description: |-
  Um intervalo que inclui os limites, por exemplo {"min":1,"max":6} para um dado de seis faces.

schema.random_range.min: |-
  O menor número que este intervalo pode produzir.

schema.random_range.max: |-
  O maior número que este intervalo pode produzir. Não pode ser menor do que min.

schema.authored_text.language: |-
  Etiqueta de língua BCP 47 específica para este texto, por exemplo {{languageTagExamples}}. Não use und.

schema.example_arguments: |-
  {{description}}

  Argumentos de exemplo: {{exampleArguments}}

schema.authored.threadTitle: |-
  Título do tópico. Forneça um objeto com lang e text. Por exemplo, use {"lang":"ja","text":"将軍家"} ou {"lang":"en","text":"my text"}. lang é obrigatório e deve ser uma etiqueta BCP 47 específica, como {{languageTagExamples}}. Não use und.

