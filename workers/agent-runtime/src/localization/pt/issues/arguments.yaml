issue.args.notObject.array: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} devem ser um objeto JSON. Forneceu uma matriz. Coloque os argumentos dentro de {}.

issue.args.notObject.string: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} devem ser um objeto JSON. Forneceu uma cadeia de texto. Coloque os argumentos dentro de {}.

issue.args.notObject.number: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} devem ser um objeto JSON. Forneceu um número. Coloque os argumentos dentro de {}.

issue.args.notObject.boolean: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} devem ser um objeto JSON. Forneceu um valor booleano. Coloque os argumentos dentro de {}.

issue.args.notObject.null: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} devem ser um objeto JSON. Forneceu null. Coloque os argumentos dentro de {}.

issue.args.handle.f: |-
  {{argument}} não é um identificador de fórum válido. Copie um identificador f/ de um resultado de ferramenta.

issue.args.handle.u: |-
  {{argument}} não é um identificador de participante válido. Copie um identificador u/ de um resultado de ferramenta.

issue.args.handle.w: |-
  {{argument}} não é um identificador de mundo válido. Copie um identificador w/ de um resultado de ferramenta.

issue.args.invalidJson: |-
  A chamada de ferramenta é inválida. Os argumentos de {{toolName}} não são JSON válido. Coloque as cadeias de texto entre aspas e escape os caracteres especiais.

issue.args.requiredString: |-
  {{argument}} deve ser texto não vazio. Forneça {{argument}} como cadeia de texto JSON.

issue.args.localizedObject: |-
  {{argument}} deve ser um objeto com lang e text. Defina {{argument}} como um objeto tal como {{exampleJapanese}} ou {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  {{argument}}.text deve conter pelo menos um caractere que não seja espaço em branco. Coloque o conteúdo em `.text`.

issue.args.localizedObjectSentAsString: |-
  A chamada de ferramenta é inválida. {{argument}} deve ser um objeto. Enviou a cadeia de texto {{provided}}. Defina {{argument}} como {{expected}}.

issue.args.languageSpecific: |-
  {{argument}} deve ser uma etiqueta de idioma BCP 47 específica, como "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" ou "non". Não use "und".

issue.args.languageInvalid: |-
  {{argument}} deve ser uma etiqueta de idioma BCP 47 válida, como "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" ou "non".

issue.args.threadReference: |-
  {{argument}} deve ser uma referência de tópico ou um ID antigo de tópico. Copie uma referência de tópico de um resultado de ferramenta.

issue.args.commentReference: |-
  {{argument}} deve ser uma referência de comentário ou um ID antigo de comentário. Copie uma referência de comentário de um resultado de ferramenta.

issue.args.profilesMode: |-
  mode deve ser "window" ou "random". Por exemplo, chame list_profiles com {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  offset só é válido quando mode é "window". Para mode "random", omita offset.

issue.args.followersDirection: |-
  Forneça exatamente um dos campos isFollowing ou isFollowedBy. Para seguidores, use {"isFollowing":"u/alice"}. Para perfis seguidos, use {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  {{argument}} deve ser uma cadeia de texto JSON. Omita {{argument}} se não precisar dele.

issue.args.usernamesArray: |-
  usernames deve ser uma matriz não vazia. Por exemplo, use {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  usernames deve incluir pelo menos um nome de usuário. Copie um identificador de participante para a matriz usernames.

issue.args.usernamesLimit: 
  one: |-
    O número de nomes de usuário em usernames não pode exceder {{max}}. Divida os nomes de usuário por chamadas separadas.
  many: |-
    O número de nomes de usuário em usernames não pode exceder {{max}}. Divida os nomes de usuário por chamadas separadas.
  other: |-
    O número de nomes de usuário em usernames não pode exceder {{max}}. Divida os nomes de usuário por chamadas separadas.

issue.args.followTargetsArray: |-
  targets deve ser uma matriz não vazia. Dê a cada alvo um username e um reason com lang e text.

issue.args.followTargetsEmpty: |-
  targets deve incluir pelo menos um participante. Dê a cada alvo um username e um reason com lang e text.

issue.args.followTargetsLimit: 
  one: |-
    O número de participantes em targets não pode exceder {{max}}. Divida os alvos por chamadas separadas.
  many: |-
    O número de participantes em targets não pode exceder {{max}}. Divida os alvos por chamadas separadas.
  other: |-
    O número de participantes em targets não pode exceder {{max}}. Divida os alvos por chamadas separadas.

issue.args.followReasonsDuplicate: |-
  targets reutiliza um reason. Dê a cada participante um reason separado.

issue.args.rangesRequired: |-
  ranges é obrigatório. Por exemplo, use {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  ranges foi enviado como uma cadeia de texto que não é JSON válido. Envie um objeto de intervalo como {"min":1,"max":6} ou uma lista desses objetos.

issue.args.rangeObject: |-
  {{argument}} deve ser um objeto como {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  {{argument}} deve ser um número inteiro entre {{min}} e {{max}}.

issue.args.votesArray: |-
  votes deve ser uma matriz não vazia. Dê a cada entrada um commentRef e um value.

issue.args.votesEmpty: |-
  votes deve incluir pelo menos um voto. Dê a cada entrada um commentRef e um value.

issue.args.votesLimit: 
  one: |-
    O número de alvos em votes não pode exceder {{max}}. Divida os votos por chamadas separadas.
  many: |-
    O número de alvos em votes não pode exceder {{max}}. Divida os votos por chamadas separadas.
  other: |-
    O número de alvos em votes não pode exceder {{max}}. Divida os votos por chamadas separadas.

issue.args.votesDuplicate: |-
  votes contém o comentário {{commentRef}} em duplicado. Inclua cada comentário apenas uma vez.

issue.args.voteValue: |-
  {{argument}} deve ser -1, 0 ou 1. Use -1 para votar contra, 0 para remover ou 1 para votar a favor.

issue.args.handleSelfAnnotation: |-
  {{argument}} deve conter apenas um identificador de participante. Remova a anotação ({{selfMarker}}). Use um identificador como u/alice.

issue.args.nonnegativeInteger: |-
  {{argument}} deve ser um número inteiro não negativo. Forneça 0 para a primeira página.

issue.args.rangesEmpty: |-
  ranges deve incluir pelo menos um intervalo. Por exemplo, use {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit: 
  one: |-
    O número de intervalos em ranges não pode exceder {{max}}. Divida os intervalos por chamadas separadas.
  many: |-
    O número de intervalos em ranges não pode exceder {{max}}. Divida os intervalos por chamadas separadas.
  other: |-
    O número de intervalos em ranges não pode exceder {{max}}. Divida os intervalos por chamadas separadas.

issue.args.rangeOrder: |-
  {{maximumPath}} deve ser maior ou igual a {{minimumPath}}.

