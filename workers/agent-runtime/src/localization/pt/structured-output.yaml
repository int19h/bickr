structured_output.unexpected_tools.compaction: |-
  META: Não chame ferramentas. Responda com um resumo detalhado em primeira pessoa que siga o esquema JSON exigido.

structured_output.unexpected_tools.other: |-
  Não use um comando do Bickr para esta resposta. Responda com o objeto JSON obrigatório que contém apenas {{property}}.

structured_output.empty.compaction: |-
  A resposta do resumo estava vazia. Devolva um objeto JSON com texto não vazio em {{property}}.

structured_output.empty.translation: |-
  A resposta da tradução estava vazia. Devolva um objeto JSON com texto não vazio em {{property}}.

structured_output.empty.avatar_description: |-
  A resposta da descrição da imagem de perfil estava vazia. Devolva um objeto JSON com texto não vazio em {{property}}.

structured_output.invalid_json.compaction: |-
  A resposta com o resumo deve ser um objeto JSON. Indique apenas {{property}} com o seu valor de texto.

structured_output.invalid_json.translation: |-
  A resposta com a tradução deve ser um objeto JSON. Indique apenas {{property}} com o seu valor de texto.

structured_output.invalid_json.avatar_description: |-
  A resposta com a descrição da imagem de perfil deve ser um objeto JSON. Indique apenas {{property}} com o seu valor de texto.

structured_output.missing_tool: |-
  Não foi devolvida nenhuma chamada da ferramenta {{toolName}}. Chame {{toolName}} uma vez com texto não vazio em {{property}}.

structured_output.wrong_tool: |-
  Use apenas {{toolName}} para este pedido. Não use {{receivedTool}} aqui.

structured_output.tool_count: 
  one: |-
    Era esperada uma chamada à ferramenta {{toolName}}, mas o número de chamadas recebidas é {{count}}. Chame {{toolName}} exatamente uma vez.
  many: |-
    Era esperada uma chamada à ferramenta {{toolName}}, mas o número de chamadas recebidas é {{count}}. Chame {{toolName}} exatamente uma vez.
  other: |-
    Era esperada uma chamada à ferramenta {{toolName}}, mas o número de chamadas recebidas é {{count}}. Chame {{toolName}} exatamente uma vez.

structured_output.tool_mismatch: |-
  Era esperada a ferramenta {{toolName}}, mas foi recebida {{receivedTool}}. Chame {{toolName}} em vez disso.

structured_output.invalid_arguments_json: |-
  Os argumentos de {{toolName}} não eram JSON válido. Forneça um objeto JSON com texto em {{property}}. Escape caracteres especiais nas cadeias.

structured_output.arguments_object: |-
  Os argumentos de {{toolName}} devem ser um objeto JSON. Coloque {{property}} e o seu valor de texto dentro de {}.

structured_output.output_object: |-
  A saída estruturada deve ser um objeto JSON. Coloque {{property}} e o seu valor de texto dentro de {}.

structured_output.extra_arguments: 
