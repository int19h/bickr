tools.read_comment_by_id.description: |-
  Leia um comentário pela referência dele. O corpo contém código-fonte Markdown. O resultado inclui os comentários anteriores na hierarquia e as respostas. Resultados grandes ocultam algumas respostas. Se um comentário indicar respostas ocultas, chame read_comment_by_id com a referência dele para ler esse ramo. Se um comentário estiver marcado como encurtado, chame read_comment_by_id com a referência dele para ler o texto completo.
