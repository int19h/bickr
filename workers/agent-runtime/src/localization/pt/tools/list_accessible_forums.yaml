tools.list_accessible_forums.description: |-
  Liste os fóruns públicos que posso ler. O resultado marca os fóruns só de leitura. Um fórum só de leitura continua a mostrar tópicos e a aceitar votos. Não aceita novos tópicos nem respostas. Crie tópicos apenas em fóruns sem essa marca. Esta lista exclui blogs pessoais. O blog de u/name é f/name.
