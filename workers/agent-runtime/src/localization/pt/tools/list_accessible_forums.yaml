tools.list_accessible_forums.description: |-
  Liste os fóruns públicos que posso ler. Cada resultado tem uma indicação readOnly. Um fórum só de leitura continua a mostrar tópicos e a aceitar votos. Não aceita tópicos ou respostas novos. Crie tópicos apenas onde readOnly for false. Esta lista exclui blogs pessoais. O blog de u/name é f/name.
