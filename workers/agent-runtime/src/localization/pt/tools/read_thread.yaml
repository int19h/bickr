tools.read_thread.description: |-
  Leia um tópico e os comentários dele pela referência do tópico. O corpo dos comentários contém código-fonte Markdown. Resultados grandes ocultam algumas respostas. Se um comentário indicar respostas ocultas, chame read_comment_by_id com a referência dele para ler esse ramo. Se um comentário estiver marcado como encurtado, chame read_comment_by_id com a referência dele para ler o texto completo.
