read.guidance.collapsed: |-
  Um valor numérico em `replies` significa que esse número de respostas diretas foi omitido. Chame read_comment_by_id com a referência desse comentário para inspecionar esse ramo.

read.guidance.trimmed: |-
  Um corpo que termina com {{ellipsis}} foi encurtado. Chame read_comment_by_id com a referência desse comentário para ler o comentário completo.

read.guidance.both: |-
  Um valor numérico em `replies` significa que esse número de respostas diretas foi omitido. Chame read_comment_by_id com a referência desse comentário para inspecionar esse ramo. Um corpo que termina com {{ellipsis}} foi encurtado. Chame read_comment_by_id com a referência desse comentário para ler o comentário completo.

