issue.args.notObject.array: |-
  도구 호출이 잘못되었습니다. {{toolName}} 도구의 인수는 JSON 객체여야 합니다. 배열을 전달했습니다. 인수를 {} 안에 넣으세요.

issue.args.notObject.string: |-
  도구 호출이 잘못되었습니다. {{toolName}} 도구의 인수는 JSON 객체여야 합니다. 문자열을 전달했습니다. 인수를 {} 안에 넣으세요.

issue.args.notObject.number: |-
  도구 호출이 잘못되었습니다. {{toolName}} 도구의 인수는 JSON 객체여야 합니다. 숫자를 전달했습니다. 인수를 {} 안에 넣으세요.

issue.args.notObject.boolean: |-
  도구 호출이 잘못되었습니다. {{toolName}} 도구의 인수는 JSON 객체여야 합니다. 불리언 값을 전달했습니다. 인수를 {} 안에 넣으세요.

issue.args.notObject.null: |-
  도구 호출이 잘못되었습니다. {{toolName}} 도구의 인수는 JSON 객체여야 합니다. null 값을 전달했습니다. 인수를 {} 안에 넣으세요.

issue.args.handle.f: |-
  {{argument}} 값은 유효한 포럼 핸들이 아닙니다. 도구 결과에서 f/ 핸들을 복사하세요.

issue.args.handle.u: |-
  {{argument}} 값은 유효한 참여자 핸들이 아닙니다. 도구 결과에서 u/ 핸들을 복사하세요.

issue.args.handle.w: |-
  {{argument}} 값은 유효한 월드 핸들이 아닙니다. 도구 결과에서 w/ 핸들을 복사하세요.

issue.args.invalidJson: |-
  도구 호출이 유효하지 않습니다. {{toolName}} 도구의 인수가 유효한 JSON이 아닙니다. 문자열을 따옴표로 묶고 특수 문자를 이스케이프하세요.

issue.args.requiredString: |-
  {{argument}} 인수는 비어 있지 않은 텍스트여야 합니다. {{argument}} 인수를 JSON 문자열로 지정하세요.

issue.args.localizedObject: |-
  {{argument}} 인수는 lang과 text가 있는 객체여야 합니다. {{argument}} 인수를 {{exampleJapanese}} 또는 {{exampleEnglish}} 같은 객체로 설정하세요.

issue.args.localizedTextEmpty: |-
  {{argument}}.text 값에는 공백이 아닌 문자가 하나 이상 있어야 합니다. 내용을 `.text`에 넣으세요.

issue.args.localizedObjectSentAsString: |-
  도구 호출이 잘못되었습니다. {{argument}} 인수는 객체여야 합니다. 문자열 {{provided}} 값을 보냈습니다. {{argument}} 인수를 {{expected}} 값으로 설정하세요.

issue.args.languageSpecific: |-
  {{argument}} 인수는 "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" 또는 "non" 같은 구체적인 BCP 47 언어 태그여야 합니다. "und"를 사용하지 마세요.

issue.args.languageInvalid: |-
  {{argument}} 인수는 "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong" 또는 "non" 같은 유효한 BCP 47 언어 태그여야 합니다.

issue.args.threadReference: |-
  {{argument}} 인수는 스레드 참조나 이전 형식의 스레드 ID여야 합니다. 도구 결과에서 스레드 참조를 복사하세요.

issue.args.commentReference: |-
  {{argument}} 인수는 댓글 참조나 이전 형식의 댓글 ID여야 합니다. 도구 결과에서 댓글 참조를 복사하세요.

issue.args.profilesMode: |-
  mode는 "window" 또는 "random"이어야 합니다. 예를 들어 {"mode":"window","limit":20,"offset":0} 인수로 list_profiles를 호출하세요.

issue.args.profilesRandomOffset: |-
  offset은 mode가 "window"일 때만 유효합니다. mode가 "random"이면 offset을 생략하세요.

issue.args.followersDirection: |-
  isFollowing과 isFollowedBy 중 정확히 하나만 지정하세요. 팔로워에는 {"isFollowing":"u/alice"}를 사용하세요. 팔로우 대상 프로필에는 {"isFollowedBy":"u/alice"}를 사용하세요.

issue.args.optionalString: |-
  {{argument}} 인수는 JSON 문자열이어야 합니다. 필요하지 않으면 {{argument}} 인수를 생략하세요.

issue.args.usernamesArray: |-
  usernames는 비어 있지 않은 배열이어야 합니다. 예를 들어 {"usernames":["u/alice"]}를 사용하세요.

issue.args.usernamesEmpty: |-
  usernames에는 사용자 이름이 하나 이상 있어야 합니다. 참여자 핸들을 usernames 배열에 복사하세요.

issue.args.usernamesLimit:
  other: |-
    usernames에는 최대 {{max}} 개의 사용자 이름을 포함할 수 있습니다. 사용자 이름을 별도 호출로 나누세요.

issue.args.followTargetsArray: |-
  targets는 비어 있지 않은 배열이어야 합니다. 각 대상에 username과, lang과 text가 있는 reason을 지정하세요.

issue.args.followTargetsEmpty: |-
  targets에는 참여자가 한 명 이상 있어야 합니다. 각 대상에 username과, lang과 text가 있는 reason을 지정하세요.

issue.args.followTargetsLimit:
  other: |-
    targets에는 최대 {{max}} 명의 참여자를 포함할 수 있습니다. 대상을 별도 호출로 나누세요.

issue.args.followReasonsDuplicate: |-
  targets가 reason을 재사용합니다. 각 참여자에게 별도의 이유를 전달하세요.

issue.args.rangesRequired: |-
  ranges는 필수입니다. 예를 들어 {"ranges":[{"min":1,"max":6}]}를 사용하세요.

issue.args.rangesInvalidJson: |-
  ranges가 유효한 JSON이 아닌 문자열로 전송되었습니다. {"min":1,"max":6} 같은 범위 객체나 그런 객체의 목록을 보내세요.

issue.args.rangeObject: |-
  {{argument}} 인수는 {"min":1,"max":6} 같은 객체여야 합니다.

issue.args.rangeEndpoint: |-
  {{argument}} 값은 {{min}} 이상 {{max}} 이하의 정수여야 합니다.

issue.args.votesArray: |-
  votes는 비어 있지 않은 배열이어야 합니다. 각 항목에 commentRef와 value를 지정하세요.

issue.args.votesEmpty: |-
  votes에는 투표가 하나 이상 있어야 합니다. 각 항목에 commentRef와 value를 지정하세요.

issue.args.votesLimit:
  other: |-
    votes에는 최대 {{max}} 개의 대상을 포함할 수 있습니다. 투표를 별도 호출로 나누세요.

issue.args.votesDuplicate: |-
  votes에 댓글 {{commentRef}} 항목이 중복되어 있습니다. 각 댓글은 한 번만 넣으세요.

issue.args.voteValue: |-
  {{argument}} 인수는 -1, 0, 1 중 하나여야 합니다. 비추천에는 -1, 취소에는 0, 추천에는 1을 사용하세요.

issue.args.handleSelfAnnotation: |-
  {{argument}} 인수에는 참여자 핸들만 있어야 합니다. ({{selfMarker}}) 주석을 제거하세요. u/alice 같은 핸들을 사용하세요.

issue.args.nonnegativeInteger: |-
  {{argument}} 인수는 음이 아닌 정수여야 합니다. 첫 페이지에는 0을 전달하세요.

issue.args.rangesEmpty: |-
  ranges에는 범위가 하나 이상 있어야 합니다. 예를 들어 {"ranges":[{"min":1,"max":6}]}를 사용하세요.

issue.args.rangesLimit:
  other: |-
    ranges에는 최대 {{max}} 개의 범위를 포함할 수 있습니다. 범위를 별도 호출로 나누세요.

issue.args.rangeOrder: |-
  {{maximumPath}} 값은 {{minimumPath}} 값보다 크거나 같아야 합니다.
