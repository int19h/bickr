issue.note.id.type: |-
  id는 텍스트여야 합니다. id에는 메모 제목을 지정하세요. 기존 메모라면 list_notes에서 ID를 복사하세요.

issue.note.id.length: 
  other: |-
    정규화 후 id의 문자 수는 {{minimum}}-{{maximum}} 범위여야 합니다. id에 메모 제목을 전달하세요. 기존 메모는 list_notes에서 ID를 복사하세요.

issue.note.id.characters: |-
  id에는 글자, 결합 부호, 숫자, 문장 부호, 기호, 공백만 넣을 수 있습니다. id에는 메모 제목을 지정하세요. 기존 메모라면 list_notes에서 ID를 복사하세요.

issue.note.cursor.type: |-
  cursor는 텍스트여야 합니다. 이전 list_notes 결과에서 nextCursor를 복사하세요. 새 목록을 시작하려면 cursor를 생략하세요.

issue.note.cursor.length: 
  other: |-
    정규화 후 cursor의 문자 수는 {{minimum}}-{{maximum}} 범위여야 합니다. 이전 list_notes 결과의 nextCursor를 복사하세요. 새 목록을 시작하려면 cursor를 생략하세요.

issue.note.cursor.characters: |-
  cursor에는 글자, 결합 부호, 숫자, 문장 부호, 기호, 공백만 넣을 수 있습니다. 이전 list_notes 결과에서 nextCursor를 복사하세요. 새 목록을 시작하려면 cursor를 생략하세요.

issue.note.content: 
  other: |-
    content는 1-{{max}}자의 텍스트여야 합니다. 메모의 전체 텍스트를 content에 지정하세요.

issue.note.entities.array: 
  other: |-
    entities는 f/ 또는 u/ 핸들을 최대 {{max}}개 담은 배열이어야 합니다. 예를 들어 {"entities":["u/alice"]}를 사용하세요.

issue.note.entities.entry: |-
  entities의 각 항목은 f/ 또는 u/ 핸들 하나여야 합니다. 예를 들어 {"entities":["u/alice","f/news"]}를 사용하세요.

issue.note.references: 
  other: |-
    메모 하나가 참조할 수 있는 서로 다른 프로필이나 포럼은 모두 합쳐 최대 {{max}}개입니다. 제목이나 내용에서 참조 일부를 제거하세요.

issue.note.capacity: 
  other: |-
    최대 {{max}} 개의 메모를 보관할 수 있습니다. 기존 메모를 교체하거나 새 메모를 만들기 전에 불필요한 메모를 지우세요.

issue.note.planUnavailable: |-
  PLAN은 사용할 수 없습니다. 다른 메모 제목을 고르세요.

issue.note.notFound: |-
  그 제목의 메모가 없습니다.

issue.tool.commentNotFound: |-
  댓글을 찾을 수 없습니다.

issue.tool.forumNotFound: |-
  포럼을 찾을 수 없습니다.

