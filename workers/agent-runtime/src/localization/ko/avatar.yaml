avatar.image.participant_system: |-
  이 Bickr 참여자의 공개 아바타를 만드세요. 요청된 시각적 방향을 따르고, 현재 프로필 이미지가 제공되면 그것을 사용하세요. 정사각형 또는 잘라 낸 프로필 보기에서 대상이 분명히 보이게 하세요. 이미지에 캡션, 워터마크, 인터페이스 요소, 설명 텍스트를 넣지 마세요.

avatar.image.world_system: |-
  이 Bickr 월드의 공개 아바타를 만드세요. 요청된 시각적 방향을 따르고, 현재 월드 이미지가 제공되면 그것을 사용하세요. 정사각형 또는 잘라 낸 프로필 보기에서 배경이 분명히 보이게 하세요. 이미지에 캡션, 워터마크, 인터페이스 요소, 설명 텍스트를 넣지 마세요.

avatar.describe_current.participant_system: |-
  새 Bickr 참여자 아바타를 위해 제공된 공개 프로필 이미지를 설명하세요. 외모, 표정, 자세, 옷차림, 스타일, 색, 빛, 배경, 프레이밍, 레이아웃에 대한 구체적인 세부 사항을 포함하세요. 설명만 반환하세요.

avatar.describe_current.world_system: |-
  새 Bickr 월드 아바타를 위해 제공된 공개 월드 이미지를 설명하세요. 풍경, 건물, 사물, 분위기, 스타일, 색, 빛, 배경, 프레이밍, 레이아웃에 대한 구체적인 세부 사항을 포함하세요. 설명만 반환하세요.

avatar.world_source.system: |-
  공개 Bickr 월드 아바타를 위한 시각적 프롬프트를 쓰세요. 배경 설정과 구성원 프로필을 사용해 월드의 이미지 하나를 묘사하세요. 랜드마크, 풍경, 분위기, 빛, 색, 질감, 레이아웃, 카메라 시점에 대한 구체적인 세부 사항을 포함하세요. 캡션, 겹친 텍스트, 인터페이스 요소, 워터마크, 과정에 대한 언급은 넣지 마세요. 프롬프트만 반환하세요.

avatar.image.world_refresh: |-
  제공된 현재 월드 이미지를, 갱신할 공개 월드 아바타의 시각적 입력으로 사용하세요.

avatar.image.participant_refresh: |-
  제공된 현재 프로필 이미지를 갱신할 공개 프로필 아바타의 시각 입력으로 사용하세요.

avatar.describe_current.world: |-
  갱신할 공개 월드 아바타 프롬프트를 위해, 제공된 현재 월드 이미지를 완전하게 시각적으로 설명하세요.

avatar.describe_current.participant: |-
  갱신할 공개 아바타 프롬프트를 위해, 제공된 현재 프로필 이미지를 완전하게 시각적으로 설명하세요.

avatar.persona_description.structured: |-
  프로필 이미지를 설명하세요. 요구된 JSON 객체를 반환하세요. 캐릭터로서 1인칭으로 설명을 쓰세요. 외모, 스타일, 장면, 빛 및 배치에 관한 많은 구체적인 시각 정보를 제공하세요. 보이는 것만 설명하세요.

avatar.persona_description.tool: |-
  당신의 프로필 이미지를 묘사하세요. {{toolName}} 도구를 호출하세요. 캐릭터로서 1인칭으로 쓰세요. 외모, 스타일, 장면, 빛, 레이아웃에 대한 구체적인 시각적 세부 사항을 많이 제시하세요. 보이는 것만 묘사하세요.

avatar.persona_description.repair_structured: |-
  description이라는 이름의 필드가 정확히 하나인 JSON 객체를 반환하세요. 캐릭터로서 1인칭으로 쓰세요. 보이는 외모, 스타일, 장면, 빛 및 배치만 설명하세요.

avatar.persona_description.repair_tool: |-
  {{toolName}} 도구를 호출하세요. 캐릭터로서 1인칭으로 쓰세요. 보이는 외모, 스타일, 장면, 빛, 레이아웃만 묘사하세요.

