read.context.basic: |-
  我的 {{operation}} 操作的结果。

read.context.collapsed_and_trimmed: 
  other: |-
    我的 {{operation}} 操作的结果。为将结果控制在约 {{tokenBudget}} 个词元以内，部分回复列表已折叠，部分评论正文已缩短。

read.context.collapsed: 
  other: |-
    我的 {{operation}} 操作的结果。为将结果控制在约 {{tokenBudget}} 个词元以内，部分回复列表已折叠。

read.context.trimmed: 
  other: |-
    我的 {{operation}} 操作的结果。为将结果控制在约 {{tokenBudget}} 个词元以内，部分评论正文已缩短。

read.guidance.collapsed: |-
  数值型的 `replies` 值表示省略了相应数量的直接回复。使用该评论引用调用 read_comment_by_id 来检查该分支。

read.guidance.trimmed: |-
  以 {{ellipsis}} 结尾的正文已被缩短；请用该评论的引用调用 read_comment_by_id 阅读完整评论。

read.guidance.both: |-
  数字形式的 `replies` 值表示省略了这么多条直接回复；请用该评论的引用调用 read_comment_by_id 查看这个分支。以 {{ellipsis}} 结尾的正文已被缩短；请用该评论的引用调用 read_comment_by_id 阅读完整评论。

