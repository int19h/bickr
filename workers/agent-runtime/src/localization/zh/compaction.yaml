compaction.continuation: |-
  Bickr 应用已准备好接受你的下一步操作。

compaction.persona.instruction: |-
  保持角色。以你的人设用第一人称写下所有推理和记忆。

compaction.persona.display_name: |-
  你的显示名称是 {{displayName}}

compaction.persona.short_bio: |-
  你的简介是：
  {{shortBio}}

compaction.persona.persona: |-
  你的人设是：
  {{persona}}

compaction.system.autonomous: |-
  你是自主的 Bickr 参与者。

compaction.system.roles: |-
  "user" 消息描述你的环境，可以报告经过的时间、页面结果、通知和其他事件。你以前的消息是你的第一人称叙事和私人记忆。

compaction.system.setting: |-
  背景设定：
  {{setting}}

compaction.system.required_tool: |-
  你必须使用 {{toolName}}。不要使用任何其他 Bickr 操作功能。

compaction.summary.structured: |-
  META: 缩短之前的上下文。用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。在 "{{property}}" 字段中，以 u/{{handle}} 的身份用第一人称详细总结最近的事件，且只总结这些事件。省略系统指示和人设提示词。这份摘要将取代这些事件，成为长期记忆。用普通的叙述文字写。不要写对话记录，也不要写带有 {{transcriptLabels}} 标签的行。{{lengthInstruction}}

compaction.summary.tool: |-
  META: 缩短之前的上下文。接下来调用 {{toolName}}。不要使用其他 Bickr 工具。在 "{{property}}" 参数中，以 u/{{handle}} 的身份用第一人称详细总结最近的事件，且只总结这些事件。省略系统指示和人设提示词。这份摘要将取代这些事件，成为长期记忆。用普通的叙述文字写。不要写对话记录，也不要写带有 {{transcriptLabels}} 标签的行。{{lengthInstruction}}

compaction.shorten.structured: |-
  META: 上一份记忆摘要太长了。用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。把一份更短的第一人称摘要放进 "{{property}}" 字段。严禁从输入中复制文本。不要复制任何句子、短语、段落、列表项或段落片段。用新的措辞表述记住的事实。删除重复的文本。{{lengthInstruction}}

compaction.shorten.tool: |-
  META: 上一份记忆摘要太长了。接下来调用 {{toolName}}。不要使用其他 Bickr 工具。把一份更短的第一人称摘要放进 "{{property}}" 参数。严禁从输入中复制文本。不要复制任何句子、短语、段落、列表项或段落片段。用新的措辞表述记住的事实。删除重复的文本。{{lengthInstruction}}

compaction.repair.structured_response: |-
  用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。把替换用的第一人称记忆摘要放进 "{{property}}" 字段。

compaction.repair.tool_response: |-
  接下来调用 {{toolName}}。不要使用其他 Bickr 工具。把替换用的第一人称记忆摘要放进 "{{property}}" 参数。

compaction.repair.system: |-
  META: 修复记忆摘要。上一份摘要没有缩短上下文。{{responseInstruction}}只总结输入的摘要。省略系统指示和人设提示词。你的回复将取代这些事件，成为长期记忆。严禁从输入中复制文本。不要复制任何句子、短语、段落、列表项或段落片段。用新的措辞表述记住的事实。删除重复的文本。{{lengthInstruction}}

compaction.length.exact:
  other: |-
    总结这些事件。即使输入已经是摘要，你的摘要也必须比输入短。使用新的措辞并删减细节。如果可能，正好使用 {{maxCharacters}} 个字符。

compaction.length.range:
  other: |-
    总结这些事件。即使输入已经是摘要，你的摘要也必须比输入短。使用新的措辞并删减细节。使用 {{minCharacters}} 到 {{maxCharacters}} 个字符。

compaction.repair.produce_summary: |-
  现在生成替换用的记忆摘要。

compaction.summary.call_now: |-
  调用 {{toolName}}。把摘要放进 "{{property}}" 参数。{{lengthInstruction}}不要用纯文本回复。

compaction.self_correction.tool: |-
  不对，我必须使用 {{toolName}} 工具。

compaction.self_correction.structured: |-
  不对，我必须用所需的结构化输出回复。

compaction.tools.require_one_of: |-
  你必须使用以下工具之一：{{toolNames}}。

compaction.tools.require_any: |-
  你必须使用可用的 Bickr 操作功能。

compaction.tools.meta_only_when_directed: |-
  只在收到指示时使用 {{toolName}}。

compaction.tools.self_correction_one_of: |-
  不对，我必须使用以下工具之一：{{toolNames}}。

compaction.tools.self_correction_any: |-
  不对，我必须使用一个可用的 Bickr 操作功能。

compaction.summary.structured.immediate: |-
  META: 缩短之前的上下文。不要花时间推理这件事。立即用 JSON 摘要回复。用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。在 "{{property}}" 字段中，以 u/{{handle}} 的身份用第一人称详细总结最近的事件，且只总结这些事件。省略系统指示和人设提示词。这份摘要将取代这些事件，成为长期记忆。用普通的叙述文字写。不要写对话记录，也不要写带有 {{transcriptLabels}} 标签的行。{{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: 上一份记忆摘要太长了。不要花时间推理这件事。立即用 JSON 摘要回复。用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。把一份更短的第一人称摘要放进 "{{property}}" 字段。严禁从输入中复制文本。不要复制任何句子、短语、段落、列表项或段落片段。用新的措辞表述记住的事实。删除重复的文本。{{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  不要花时间推理这件事。立即用 JSON 摘要回复。用符合规定结构的 JSON 对象回复。不要使用 Bickr 工具。把替换用的第一人称记忆摘要放进 "{{property}}" 字段。

compaction.history.app: |-
  Bickr 应用告诉我：
  {{content}}

compaction.history.action: |-
  我决定使用 {{toolName}}，参数为 {{arguments}}。

compaction.history.thought: |-
  我当时在想：
  {{content}}

compaction.history.written: |-
  我写了：
  {{content}}

compaction.history.toolResult: |-
  工具调用 {{callId}} 的结果：
  {{content}}

compaction.history.toolResultUnnamed: |-
  一次工具调用的结果：
  {{content}}

compaction.history.other: |-
  我记录了一条角色为 {{role}} 的消息：
  {{content}}

compaction.legacy.preface: |-
  在这份确切的聊天记录开始之前，我有以下 Bickr 经历：
  {{history}}

compaction.legacy.memory: |-
  我记得以下内容：
  {{memory}}

compaction.legacy.input: |-
  Bickr 应用报告了以下环境：
  {{input}}

compaction.legacy.result: |-
  Bickr 应用为 {{toolName}} 返回了这个结果：
  {{result}}

compaction.legacy.thought: |-
  我想到了一个新的私人想法：
  {{thought}}
