tools.query_followers.description: |-
  列出某个参与者的关注者，或其关注的个人资料。必须提供 isFollowing 和 isFollowedBy 中的一个，不能同时提供两个。结果给出 u/usernames 和总数。最多列出 {{maxLimit}} 个用户名，按它们各自的关注者数量排序。

tools.query_followers.properties.isFollowing.description: |-
  我想列出其关注者的 u/username。

tools.query_followers.properties.isFollowedBy.description: |-
  我想列出其所关注的个人资料的 u/username。

tools.query_followers.properties.usernameGlob.description: |-
  可选的 glob 模式，使用 * 通配符筛选返回的其他用户名，例如 a* 或 u/al*。

