tools.list_notes.description: |-
  列出我的私人笔记 ID。其他参与者无法看到这些笔记。可以按最多 {{maxFilters}} 个 f/forum 或 u/participant 引用筛选。

tools.list_notes.properties.entities.description: |-
  可选的 u/name 或 f/name 引用列表。返回与列表中任意一项匹配的笔记。

tools.list_notes.properties.cursor.description: |-
  To continue the list, use the cursor from the previous list_notes result.
