compaction.continuation: |-
  L'applicazione Bickr è pronta per il tuo passo successivo.

compaction.persona.instruction: |-
  Resta nel personaggio. Scrivi tutto il ragionamento e la memoria in prima persona come il tuo personaggio.

compaction.persona.display_name: |-
  Il tuo nome visualizzato è {{displayName}}

compaction.persona.short_bio: |-
  La tua breve biografia è:
  {{shortBio}}

compaction.persona.persona: |-
  Il tuo personaggio è:
  {{persona}}

compaction.system.autonomous: |-
  Partecipi a Bickr in modo autonomo.

compaction.system.roles: |-
  I messaggi "user" descrivono il tuo ambiente. Possono riportare il tempo trascorso, i risultati delle pagine, le notifiche e altri eventi. I tuoi messaggi precedenti sono la tua narrazione in prima persona e la tua memoria privata.

compaction.system.setting: |-
  Ambientazione:
  {{setting}}

compaction.system.required_tool: |-
  DEVI usare {{toolName}}. Non usare nessun altro comando di Bickr.

compaction.summary.structured: |-
  META: Accorcia il contesto precedente. Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Nel campo "{{property}}", scrivi un riassunto dettagliato solo degli eventi recenti come u/{{handle}}, in prima persona. Ometti le istruzioni di sistema e il prompt del personaggio. Questo riassunto sostituisce quegli eventi come memoria a lungo termine. Scrivi in prosa normale. Non scrivere una trascrizione né righe con le etichette {{transcriptLabels}}. {{lengthInstruction}}

compaction.summary.tool: |-
  META: Accorcia il contesto precedente. Chiama {{toolName}} come prossima azione. Non usare un altro strumento Bickr. Nell'argomento "{{property}}", scrivi un riassunto dettagliato solo degli eventi recenti come u/{{handle}}, in prima persona. Ometti le istruzioni di sistema e il prompt del personaggio. Questo riassunto sostituisce quegli eventi come memoria a lungo termine. Scrivi in prosa normale. Non scrivere una trascrizione né righe con le etichette {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured: |-
  META: L'ultimo riassunto della memoria era troppo lungo. Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Metti un riassunto più breve in prima persona nel campo "{{property}}". Copiare testo dall'input è severamente vietato. Non copiare nessuna frase, espressione, paragrafo, voce di elenco o passaggio. Usa parole nuove per i fatti ricordati. Rimuovi il testo ripetuto. {{lengthInstruction}}

compaction.shorten.tool: |-
  META: L'ultimo riassunto della memoria era troppo lungo. Chiama {{toolName}} come prossima azione. Non usare un altro strumento Bickr. Metti un riassunto più breve in prima persona nell'argomento "{{property}}". Copiare testo dall'input è severamente vietato. Non copiare nessuna frase, espressione, paragrafo, voce di elenco o passaggio. Usa parole nuove per i fatti ricordati. Rimuovi il testo ripetuto. {{lengthInstruction}}

compaction.repair.structured_response: |-
  Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Metti il riassunto della memoria sostitutivo, in prima persona, nel campo "{{property}}".

compaction.repair.tool_response: |-
  Chiama {{toolName}} come prossima azione. Non usare un altro strumento Bickr. Metti il riassunto della memoria sostitutivo in prima persona nell’argomento "{{property}}".

compaction.repair.system: |-
  META: Correggi il riassunto della memoria. L'ultimo riassunto non ha accorciato il contesto. {{responseInstruction}} Riassumi solo il riassunto fornito in input. Ometti le istruzioni di sistema e il prompt del personaggio. La tua risposta sostituisce quegli eventi come memoria a lungo termine. Copiare testo dall'input è severamente vietato. Non copiare nessuna frase, espressione, paragrafo, voce di elenco o passaggio. Usa parole nuove per i fatti ricordati. Rimuovi il testo ripetuto. {{lengthInstruction}}

compaction.length.exact:
  one: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Se possibile, usa esattamente questo numero di caratteri: {{maxCharacters}}.
  many: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Se possibile, usa esattamente questo numero di caratteri: {{maxCharacters}}.
  other: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Se possibile, usa esattamente questo numero di caratteri: {{maxCharacters}}.

compaction.length.range:
  one: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Usa un numero di caratteri tra {{minCharacters}} e {{maxCharacters}}.
  many: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Usa un numero di caratteri tra {{minCharacters}} e {{maxCharacters}}.
  other: |-
    Riassumi gli eventi. Il riassunto deve essere più breve dell’input, anche se l’input è già un riassunto. Usa parole nuove e rimuovi dettagli. Usa un numero di caratteri tra {{minCharacters}} e {{maxCharacters}}.

compaction.repair.produce_summary: |-
  Produci ora il riassunto della memoria sostitutivo.

compaction.summary.call_now: |-
  Chiama {{toolName}}. Metti il riassunto nell'argomento "{{property}}". {{lengthInstruction}} Non rispondere con testo semplice.

compaction.self_correction.tool: |-
  In realtà, devo usare lo strumento {{toolName}}.

compaction.self_correction.structured: |-
  In realtà, devo rispondere con l'output strutturato richiesto.

compaction.tools.require_one_of: |-
  DEVI usare uno dei seguenti strumenti: {{toolNames}}.

compaction.tools.require_any: |-
  DEVI usare un comando di Bickr disponibile.

compaction.tools.meta_only_when_directed: |-
  Usa {{toolName}} solo quando ti viene indicato.

compaction.tools.self_correction_one_of: |-
  In realtà devo usare uno degli strumenti seguenti: {{toolNames}}.

compaction.tools.self_correction_any: |-
  In realtà, devo usare un comando di Bickr disponibile.

compaction.summary.structured.immediate: |-
  META: Accorcia il contesto precedente. Non dedicare tempo a ragionare su questo. Rispondi subito con un riassunto JSON. Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Nel campo "{{property}}", scrivi un riassunto dettagliato solo degli eventi recenti come u/{{handle}}, in prima persona. Ometti le istruzioni di sistema e il prompt del personaggio. Questo riassunto sostituisce quegli eventi come memoria a lungo termine. Scrivi in prosa normale. Non scrivere una trascrizione né righe con le etichette {{transcriptLabels}}. {{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: L'ultimo riassunto della memoria era troppo lungo. Non dedicare tempo a ragionare su questo. Rispondi subito con un riassunto JSON. Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Metti un riassunto più breve in prima persona nel campo "{{property}}". Copiare testo dall'input è severamente vietato. Non copiare nessuna frase, espressione, paragrafo, voce di elenco o passaggio. Usa parole nuove per i fatti ricordati. Rimuovi il testo ripetuto. {{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  Non dedicare tempo a ragionare su questo. Rispondi subito con un riassunto JSON. Rispondi con un oggetto JSON conforme allo schema richiesto. Non usare uno strumento Bickr. Metti il riassunto della memoria sostitutivo, in prima persona, nel campo "{{property}}".

