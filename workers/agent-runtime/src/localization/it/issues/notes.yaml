issue.note.id.type: |-
  id deve essere testo. Fornisci il titolo della nota come id. Per una nota esistente, copia un ID da list_notes.

issue.note.id.length: 
  one: |-
    id deve contenere {{minimum}}-{{maximum}} carattere dopo la normalizzazione. Fornisci il titolo della nota come id. Per una nota esistente, copia un ID da list_notes.
  many: |-
    id deve contenere {{minimum}}-{{maximum}} caratteri dopo la normalizzazione. Fornisci il titolo della nota come id. Per una nota esistente, copia un ID da list_notes.
  other: |-
    id deve contenere {{minimum}}-{{maximum}} caratteri dopo la normalizzazione. Fornisci il titolo della nota come id. Per una nota esistente, copia un ID da list_notes.

issue.note.id.characters: |-
  id può contenere solo lettere, segni combinanti, numeri, punteggiatura, simboli e spazi. Fornisci id come titolo della nota. Per una nota esistente, copia un ID da list_notes.

issue.note.cursor.type: |-
  cursor deve essere testo. Copia nextCursor dal risultato precedente di list_notes. Per iniziare un nuovo elenco, ometti cursor.

issue.note.cursor.length: 
  one: |-
    cursor deve contenere {{minimum}}-{{maximum}} carattere dopo la normalizzazione. Copia nextCursor dal risultato precedente di list_notes. Per iniziare un nuovo elenco, ometti cursor.
  many: |-
    cursor deve contenere {{minimum}}-{{maximum}} caratteri dopo la normalizzazione. Copia nextCursor dal risultato precedente di list_notes. Per iniziare un nuovo elenco, ometti cursor.
  other: |-
    cursor deve contenere {{minimum}}-{{maximum}} caratteri dopo la normalizzazione. Copia nextCursor dal risultato precedente di list_notes. Per iniziare un nuovo elenco, ometti cursor.

issue.note.cursor.characters: |-
  cursor può contenere solo lettere, segni combinanti, numeri, punteggiatura, simboli e spazi. Copia nextCursor dal risultato precedente di list_notes. Per iniziare un nuovo elenco, ometti cursor.

issue.note.content: 
  one: |-
    content deve essere un testo di 1-{{max}} carattere. Fornisci il testo completo della nota in content.
  many: |-
    content deve essere un testo di 1-{{max}} caratteri. Fornisci il testo completo della nota in content.
  other: |-
    content deve essere un testo di 1-{{max}} caratteri. Fornisci il testo completo della nota in content.

issue.note.entities.array: 
  one: |-
    entities deve essere un array di identificativi f/ o u/ il cui numero di elementi non superi {{max}}. Per esempio, usa {"entities":["u/alice"]}.
  many: |-
    entities deve essere un array di identificativi f/ o u/ il cui numero di elementi non superi {{max}}. Per esempio, usa {"entities":["u/alice"]}.
  other: |-
    entities deve essere un array di identificativi f/ o u/ il cui numero di elementi non superi {{max}}. Per esempio, usa {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Ogni voce di entities deve essere un solo identificativo f/ o u/. Per esempio, usa {"entities":["u/alice","f/news"]}.

issue.note.references: 
  one: |-
    Il numero totale massimo di profili o forum distinti a cui una nota può fare riferimento è {{max}}. Rimuovi alcuni riferimenti dal titolo o dal contenuto.
  many: |-
    Il numero totale massimo di profili o forum distinti a cui una nota può fare riferimento è {{max}}. Rimuovi alcuni riferimenti dal titolo o dal contenuto.
  other: |-
    Il numero totale massimo di profili o forum distinti a cui una nota può fare riferimento è {{max}}. Rimuovi alcuni riferimenti dal titolo o dal contenuto.

issue.note.capacity: 
  one: |-
    Il numero massimo di note che puoi conservare è {{max}}. Sostituisci una nota esistente o elimina una nota non necessaria prima di crearne un’altra.
  many: |-
    Il numero massimo di note che puoi conservare è {{max}}. Sostituisci una nota esistente o elimina una nota non necessaria prima di crearne un’altra.
  other: |-
    Il numero massimo di note che puoi conservare è {{max}}. Sostituisci una nota esistente o elimina una nota non necessaria prima di crearne un’altra.

issue.note.planUnavailable: |-
  La nota PLAN non è disponibile. Scegli un altro titolo per la nota.

issue.note.notFound: |-
  Nessuna nota ha quel titolo.

issue.tool.commentNotFound: |-
  Commento non trovato.

issue.tool.forumNotFound: |-
  Forum non trovato.

