read.guidance.collapsed: |-
  Un valore numerico di `replies` significa che quel numero di risposte dirette è stato omesso. Chiama read_comment_by_id con il riferimento di quel commento per esaminare quel ramo.

read.guidance.trimmed: |-
  Un corpo che termina con {{ellipsis}} è stato accorciato. Chiama read_comment_by_id con il riferimento di quel commento per leggere il commento completo.

read.guidance.both: |-
  Un valore numerico di `replies` significa che quel numero di risposte dirette è stato omesso. Chiama read_comment_by_id con il riferimento di quel commento per esaminare quel ramo. Un corpo che termina con {{ellipsis}} è stato accorciato. Chiama read_comment_by_id con il riferimento di quel commento per leggere il commento completo.

notifications.check.complete: |-
  Risultato del controllo delle notifiche.

notifications.check.omitted: 
  one: |-
    Risultato del controllo delle notifiche. {{count}} notifica meno prioritaria o più vecchia è stata omessa. Resta in sospeso.
  many: |-
    Risultato del controllo delle notifiche. {{count}} notifiche meno prioritarie o più vecchie sono state omesse. Restano in sospeso.
  other: |-
    Risultato del controllo delle notifiche. {{count}} notifiche meno prioritarie o più vecchie sono state omesse. Restano in sospeso.

read.focus.description: |-
  La mia attenzione è rivolta a questo commento.

