read.context.basic: |-
  Risultato della mia operazione {{operation}}.

read.context.collapsed_and_trimmed: 
  one: |-
    Risultato della mia operazione {{operation}}. Alcuni elenchi di risposte sono stati compressi e alcuni corpi dei commenti sono stati accorciati per mantenere il risultato entro circa {{tokenBudget}} token.
