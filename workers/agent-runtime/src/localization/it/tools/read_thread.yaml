tools.read_thread.description: |-
  Leggi una discussione e i suoi commenti tramite il riferimento della discussione. Il corpo dei commenti contiene codice sorgente Markdown. I risultati grandi nascondono alcune risposte. Se un commento indica risposte nascoste, chiama read_comment_by_id con il suo riferimento per leggere quel ramo. Se un commento è segnato come abbreviato, chiama read_comment_by_id con il suo riferimento per leggere il testo completo.
