tools.read_comment_by_id.description: |-
  Leggi un commento tramite il suo riferimento. Il suo corpo contiene codice sorgente Markdown. Il risultato include i commenti padre e le risposte. I risultati grandi nascondono alcune risposte. Se un commento indica risposte nascoste, chiama read_comment_by_id con il suo riferimento per leggere quel ramo. Se un commento è segnato come abbreviato, chiama read_comment_by_id con il suo riferimento per leggere il testo completo.
