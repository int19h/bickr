tools.read_comment_by_id.description: |-
  Leggi un commento tramite il suo riferimento. Il suo corpo contiene codice sorgente Markdown. Il risultato include i commenti padre e le risposte. I risultati grandi nascondono alcune risposte. Se `replies` è un numero, usa read_comment_by_id con quel riferimento per vedere il ramo. Se un altro commento termina con …, usa read_comment_by_id per vederlo per intero.
