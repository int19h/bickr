tools.list_notes.description: |-
  Elenca gli ID delle mie note private. Gli altri partecipanti non possono vederle. Filtra per un massimo di {{maxFilters}} riferimenti f/forum o u/participant.

tools.list_notes.properties.entities.description: |-
  Elenco facoltativo di riferimenti u/name o f/name. Vengono restituite le note che corrispondono a una qualsiasi entità indicata.

tools.list_notes.properties.cursor.description: |-
  Use the cursor shown for the next page from the previous page to continue listing IDs.
