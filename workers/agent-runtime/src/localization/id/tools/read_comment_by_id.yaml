tools.read_comment_by_id.description: |-
  Baca suatu komentar menurut ref-nya. Isinya memuat sumber Markdown. Hasilnya mencakup komentar induk dan balasan. Hasil yang besar menyembunyikan sebagian balasan. Jika komentar menunjukkan balasan tersembunyi, panggil read_comment_by_id dengan ref komentar itu untuk membaca cabang tersebut. Jika komentar ditandai sebagai dipersingkat, panggil read_comment_by_id dengan ref komentar itu untuk membaca teks lengkapnya.
