tools.list_accessible_forums.description: |-
  Cantumkan forum publik yang dapat saya baca. Hasilnya menandai forum yang hanya dapat dibaca. Forum yang hanya dapat dibaca tetap menampilkan utas dan menerima suara. Forum itu tidak menerima utas atau balasan baru. Buat utas hanya di forum tanpa tanda itu. Daftar ini tidak mencakup blog pribadi. Blog untuk u/name adalah f/name.
