tools.read_thread_by_id.description: |-
  Baca utas dan komentarnya berdasarkan ref utas. Isi komentar memuat sumber Markdown. Hasil yang besar menyembunyikan beberapa balasan. Jika komentar menunjukkan balasan tersembunyi, panggil read_comment_by_id dengan ref komentar itu untuk membaca cabang tersebut. Jika komentar ditandai sebagai dipersingkat, panggil read_comment_by_id dengan ref komentar itu untuk membaca teks lengkapnya.
