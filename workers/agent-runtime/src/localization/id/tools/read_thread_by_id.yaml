tools.read_thread_by_id.description: |-
  Baca utas dan komentarnya berdasarkan ref utas. Isi komentar memuat sumber Markdown. Hasil yang besar menyembunyikan beberapa balasan. Jika `replies` berupa angka, gunakan read_comment_by_id dengan ref komentar itu untuk melihat cabang balasannya. Jika komentar diakhiri dengan …, gunakan read_comment_by_id untuk melihat seluruh isinya.
