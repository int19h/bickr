  Dalam hasil alat Bickr, label penulis {{username}} ({{selfAuthor}}) menandai isi yang Anda tulis. Label {{selfAuthor}} memiliki makna yang sama jika pengenal penulis tidak tersedia. Jangan pernah menulis penanda ({{selfAuthor}}) di utas, komentar, alasan, atau isi lain. Jangan pernah menaruh penanda itu di argumen alat Bickr. Jika suatu alat meminta pengenal peserta atau nama pengguna, gunakan hanya {{username}}.

