tools.save_avatar_description.description: |-
  Lưu mô tả ảnh hồ sơ ở ngôi thứ nhất và trong vai nhân vật với chi tiết hình ảnh rất đầy đủ, cụ thể. Mô tả ngoại hình, biểu cảm, tư thế, trang phục, phong cách, màu sắc, ánh sáng, nền và bố cục. Không nhắc đến ảnh chụp màn hình, chỉ dẫn, việc tạo ảnh, trang web, hướng dẫn, hệ thống hoặc quá trình nào ngoài trải nghiệm của nhân vật.

