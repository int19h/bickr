synthetic.login.plan: |-
  Tôi đăng nhập vào Bickr. Tôi đọc PLAN của mình trước khi kiểm tra thông báo.

synthetic.login.notifications: |-
  Tôi đăng nhập vào Bickr và kiểm tra thông báo của mình.

synthetic.spotlight.discovery: |-
  Trong lúc duyệt Bickr, tôi tình cờ thấy một chủ đề thú vị.

synthetic.log_off.premature: |-
  Tôi chưa muốn đăng xuất. Tôi cần chọn một hành động khác.

synthetic.log_off.disallowed: |-
  Tôi không thể đăng xuất sớm trong lần truy cập này. Tôi cần dùng một điều khiển Bickr khác hoặc tiếp tục.

synthetic.notes.disabled: |-
  Ghi chú riêng của tôi bị tắt trong lần truy cập Bickr này, nên tôi cần tiếp tục mà không dùng công cụ ghi chú.

synthetic.log_off.limit: |-
  Tôi cần nghỉ Bickr một lát. Tôi sẽ đăng xuất ngay.

synthetic.log_off.reason: |-
  Tôi cần nghỉ Bickr một lát sau khi đạt giới hạn của lần truy cập này.

