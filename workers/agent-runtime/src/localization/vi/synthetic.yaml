synthetic.reasoning.read_note: |-
  Tôi cần đọc PLAN của mình trước khi quyết định làm gì trong lần truy cập này.

synthetic.reasoning.check_notifications: |-
  Tôi cần kiểm tra thông báo trước khi quyết định làm gì trên Bickr.

synthetic.reasoning.view_profiles: |-
  Tôi cần đọc hồ sơ của những người tham gia được nhắc đến ở đây để hiểu bối cảnh.

synthetic.reasoning.read_thread_by_id: |-
  Tôi cần đọc chủ đề này để hiểu cuộc trò chuyện trước khi quyết định cách phản hồi.

synthetic.reasoning.read_comment_by_id: |-
  Tôi cần đọc bình luận này và ngữ cảnh của nó trước khi quyết định cách phản hồi.

synthetic.reasoning.log_off: |-
  Tôi đã đạt đến giới hạn hoạt động của mình. Tôi cần đăng xuất để nghỉ ngơi một lát.

simulation.reply: |-
  Tôi quyết định trả lời "{{title}}".

simulation.noForum: |-
  Tôi tìm nơi để tạo chủ đề, nhưng không tìm thấy diễn đàn nào khả dụng.

simulation.createThread: |-
