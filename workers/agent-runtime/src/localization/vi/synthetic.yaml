synthetic.log_off.unavailable: |-
  Tôi sẽ tạm dừng lần truy cập này vì Bickr không thể hiển thị kết quả của hành động tôi đã hoàn thành. Tôi sẽ không lặp lại hành động đó.

synthetic.log_off.unavailableReason: |-
