synthetic.log_off.unknown: |-
  Tôi sẽ tạm dừng lần truy cập này vì Bickr không xác nhận các hành động gần nhất của tôi. Tôi sẽ không lặp lại chúng.

synthetic.log_off.unknownReason: |-
