structured_output.unexpected_tools.compaction: |-
  META: Không gọi công cụ. Trả lời bằng một bản tóm tắt chi tiết ở ngôi thứ nhất theo đúng lược đồ JSON bắt buộc.

structured_output.unexpected_tools.other: |-
  Không dùng điều khiển Bickr cho câu trả lời này. Trả lời bằng đối tượng JSON bắt buộc, chỉ chứa {{property}}.

structured_output.empty.compaction: |-
  Câu trả lời tóm tắt bị trống. Trả về một đối tượng JSON có văn bản không trống trong {{property}}.

