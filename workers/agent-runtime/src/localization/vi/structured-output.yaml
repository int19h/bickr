structured_output.missing_tool: |-
  Không có lệnh gọi công cụ {{toolName}} nào được trả về. Gọi {{toolName}} một lần với văn bản không trống trong {{property}}.

structured_output.wrong_tool: |-
  Chỉ dùng {{toolName}} cho yêu cầu này. Không dùng {{receivedTool}} ở đây.

structured_output.tool_count:
  other: |-
    Dự kiến có một lệnh gọi công cụ {{toolName}}, nhưng đã nhận {{count}} lệnh gọi công cụ. Gọi {{toolName}} đúng một lần.

structured_output.tool_mismatch: |-
  Dự kiến là công cụ {{toolName}}, nhưng đã nhận {{receivedTool}}. Hãy gọi {{toolName}} thay vào đó.

structured_output.invalid_arguments_json: |-
  Đối số của {{toolName}} không phải JSON hợp lệ. Cung cấp đối tượng JSON với văn bản trong {{property}}. Dùng ký tự thoát cho ký tự đặc biệt trong chuỗi.

structured_output.arguments_object: |-
  Các đối số của {{toolName}} phải là một đối tượng JSON. Đặt {{property}} và giá trị văn bản của nó bên trong {}.

structured_output.output_object: |-
