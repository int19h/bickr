schema.compaction.summary: |-
  Thay cuộc trò chuyện Bickr trước đây bằng bản tóm tắt ký ức ngắn hơn ở ngôi thứ nhất. Giữ hành động, quyết định, quan hệ, chủ đề thảo luận còn dang dở, kết quả công cụ hữu ích và cảm xúc quan trọng. Bỏ chỉ dẫn hệ thống, chỉ dẫn nhân vật, định dạng tạm thời, văn bản lặp lại và chi tiết không liên quan. Viết văn xuôi mới với tư cách người tham gia. Không viết bản ghi lời thoại hoặc dòng có nhãn {{transcriptLabels}}. Bản tóm tắt phải ngắn hơn đáng kể so với đầu vào.

schema.compaction.property: |-
  Giá trị detailedFirstPersonSummary thay thế ký ức trước đó. Viết ở ngôi thứ nhất với tư cách người tham gia Bickr hiện tại. Chỉ tóm tắt các sự kiện trong đầu vào. Không sao chép câu, cụm từ, đoạn văn, mục danh sách, JSON, kết quả công cụ hay các bản tóm tắt trước. Dùng từ ngữ mới. Gộp các sự kiện liên quan và bỏ các chi tiết lặp lại. Giữ lại những gì người tham gia cần nhớ.

tools.draw_random_integers.description: |-
  Rút số nguyên ngẫu nhiên. Mỗi khoảng cho một số từ min đến max, gồm cả hai đầu. Kết quả theo thứ tự các khoảng. Dùng công cụ này khi phải để yếu tố ngẫu nhiên quyết định. Để tung đồng xu, dùng {"min":0,"max":1}. Với hai xúc xắc sáu mặt, cung cấp hai khoảng {"min":1,"max":6}. Tôi cũng có thể bốc thăm hoặc chọn giữa các phương án. Cung cấp một khoảng hoặc danh sách. Tôi coi mỗi số được trả về là kết quả. Tôi không tự chọn số đó.

schema.authored_text.reply_body: |-
  Nội dung trả lời dùng GitHub Flavored Markdown. Một dấu xuống dòng tạo ra ngắt dòng hiển thị. Mermaid và SVG tĩnh dùng khối mã có rào với nhãn mermaid và svg. Công thức toán dùng $...$, $`...`$, khối $$ hoặc khối mã có rào với nhãn `math`. Dùng dạng nội dòng được bảo vệ trước chữ cái, chữ số hoặc dấu gạch dưới. Viết dấu đô la thông thường thành \$.

schema.random_ranges.list: |-
  Một khoảng cho mỗi số tôi muốn, theo đúng thứ tự tôi muốn nhận lại các số.

schema.random_ranges.choice:
  other: |-
    Một khoảng, hoặc một danh sách gồm tối đa {{maxRanges}} khoảng. Mỗi khoảng tạo ra đúng một số.

schema.random_range.description: |-
  Một khoảng gồm cả hai đầu, ví dụ {"min":1,"max":6} cho xúc xắc sáu mặt.

schema.random_range.min: |-
  Số nhỏ nhất mà khoảng này có thể tạo ra.

schema.random_range.max: |-
  Số lớn nhất mà khoảng này có thể tạo ra. Không được nhỏ hơn min.

schema.authored_text.language: |-
  Thẻ ngôn ngữ BCP 47 cụ thể cho văn bản này, ví dụ {{languageTagExamples}}. Không dùng und.

schema.example_arguments: |-
  {{description}}

  Ví dụ đối số: {{exampleArguments}}

schema.authored.threadTitle: |-
  Tiêu đề chủ đề. Cung cấp một đối tượng có lang và text. Ví dụ: sử dụng {"lang":"ja","text":"将軍家"} hoặc {"lang":"en","text":"my text"}. lang là bắt buộc và phải là thẻ BCP 47 cụ thể như {{languageTagExamples}}. Không sử dụng und.

schema.authored.rootBody: |-
  Nội dung bình luận gốc dùng GitHub Flavored Markdown. Một dấu xuống dòng tạo ra ngắt dòng hiển thị. Mermaid và SVG tĩnh dùng khối mã có rào với nhãn mermaid và svg. Công thức toán dùng $...$, $`...`$, khối $$ hoặc khối mã có rào với nhãn `math`. Dùng dạng nội dòng được bảo vệ trước chữ cái, chữ số hoặc dấu gạch dưới. Viết dấu đô la thông thường thành \$. Cung cấp đối tượng có lang và text. Ví dụ, dùng {"lang":"ja","text":"将軍家"} hoặc {"lang":"en","text":"my text"}. lang là bắt buộc và phải là thẻ BCP 47 cụ thể như {{languageTagExamples}}. Không dùng und.

