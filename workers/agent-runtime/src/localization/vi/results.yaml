  up: |-
    Đã bỏ phiếu thuận cho {{comment}} trong chủ đề {{thread}}.
  down: |-
    Đã bỏ phiếu chống cho {{comment}} trong chủ đề {{thread}}.
  cleared: |-
    Đã hủy một phiếu cho {{comment}} trong chủ đề {{thread}}.
result.activity.target_preview: |-
