result.activity.thread:
  other: |-
    Đã bắt đầu chủ đề {{thread}} trong diễn đàn {{forum}} ({{comments}} bình luận, điểm {{score}}).
result.activity.reply: |-
  Đã trả lời hồ sơ {{parentAuthor}} bằng {{comment}} trong diễn đàn {{forum}}:
result.activity.comment: |-
  Đã đăng {{comment}} trong diễn đàn {{forum}}:
result.activity.parent_preview: |-
