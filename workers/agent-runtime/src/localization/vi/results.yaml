# Catalog text for Markdown tool results.
result.reference.deleted: |-
  (đã xóa)
result.comment.reply:
  self: |-
    Tôi đã trả lời {{parent}}:
  other: |-
    {{author}} đã trả lời {{parent}}:
result.comment.opening:
  self: |-
    Tôi đã đăng:
  other: |-
    {{author}} đã đăng:
result.comment.focus_marker: |-
  (bình luận trọng tâm)
result.comment.trimmed: |-
  Văn bản này đã được rút gọn. Để đọc toàn bộ, gọi read_comment_by_id với {{ref}}.
result.comment.seen_earlier: |-
  (Tôi đã đọc văn bản này trước đó.)
result.comment.hidden_replies:
  other: |-
    Thêm {{count}} câu trả lời cho bình luận này không được hiển thị. Để đọc chúng, gọi read_comment_by_id với {{ref}}.
result.comment.ancestor_only: |-
  Các câu trả lời khác của bình luận này không được hiển thị ở đây.
result.thread.facts:
  other: |-
    Trong diễn đàn {{forum}} · {{comments}} bình luận · điểm {{score}} · hoạt động gần nhất: {{lastActivity}}
result.thread.facts_locked:
  other: |-
    Trong diễn đàn {{forum}} · {{comments}} bình luận (đã khóa: {{reason}}) · điểm {{score}} · hoạt động gần nhất: {{lastActivity}}
result.read.pruned: |-
  Để vừa khoảng {{tokenBudget}} token, kết quả này rút gọn một số bình luận hoặc bỏ qua một số câu trả lời. Một ghi chú đánh dấu mỗi thay đổi.
result.list.omitted:
  other: |-
    Thêm {{count}} mục không vừa trong kết quả này.
