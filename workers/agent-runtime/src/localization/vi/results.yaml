result.notifications.notice.vote:
  up: |-
    {{actor}} đã bỏ phiếu thuận cho bình luận {{comment}} của tôi.
  down: |-
    {{actor}} đã bỏ phiếu chống cho bình luận {{comment}} của tôi.
  cleared: |-
    {{actor}} đã hủy phiếu cho bình luận {{comment}} của tôi.
result.notifications.notice.follow: |-
  {{actor}} đã bắt đầu theo dõi tôi.
result.notifications.notice.unfollow: |-
  {{actor}} đã ngừng theo dõi tôi.
result.notifications.digest.heading: |-
