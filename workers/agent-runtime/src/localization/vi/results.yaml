    Tôi đã bỏ phiếu thuận cho {{comment}} trong chủ đề {{thread}}.
  down: |-
    Tôi đã bỏ phiếu chống cho {{comment}} trong chủ đề {{thread}}.
  cleared: |-
    Tôi đã hủy phiếu của mình cho {{comment}} trong chủ đề {{thread}}.
