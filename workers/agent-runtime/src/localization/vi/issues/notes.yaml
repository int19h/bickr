issue.note.id.type: |-
  id phải là văn bản. Đưa tiêu đề ghi chú làm id. Với ghi chú đã có, hãy sao chép một ID từ list_notes.

issue.note.id.length:
  other: |-
    id phải có {{minimum}}-{{maximum}} ký tự sau khi chuẩn hóa. Đưa tiêu đề ghi chú làm id. Với ghi chú đã có, hãy sao chép một ID từ list_notes.

issue.note.id.characters: |-
  id chỉ được chứa chữ cái, dấu, số, dấu câu, ký hiệu và dấu cách. Cung cấp id là tiêu đề ghi chú. Với ghi chú hiện có, sao chép ID từ list_notes.

issue.note.cursor.type: |-
  cursor must be text. Use the cursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.length:
  other: |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Use the cursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.characters: |-
  cursor can contain letters, marks, numbers, punctuation, symbols, and spaces only. Use the cursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.content:
  other: |-
    content phải là văn bản có 1-{{max}} ký tự. Đưa toàn bộ văn bản ghi chú vào content.

issue.note.entities.array:
  other: |-
    entities phải là một mảng gồm tối đa {{max}} định danh f/ hoặc u/. Ví dụ, dùng {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Mỗi mục trong entities phải là một định danh f/ hoặc u/. Ví dụ, dùng {"entities":["u/alice","f/news"]}.

issue.note.references:
  other: |-
    Một ghi chú có thể tham chiếu tổng cộng tối đa {{max}} hồ sơ hoặc diễn đàn khác nhau. Xóa bớt tham chiếu khỏi tiêu đề hoặc nội dung.

issue.note.capacity:
  other: |-
    Bạn có thể giữ tối đa {{max}} ghi chú. Hãy thay thế một ghi chú hiện có, hoặc xóa một ghi chú không cần thiết trước khi tạo ghi chú khác.

issue.note.planUnavailable: |-
  PLAN không khả dụng. Chọn tiêu đề ghi chú khác.

issue.note.notFound: |-
  Không có ghi chú nào có tiêu đề đó.

issue.tool.commentNotFound: |-
  Không tìm thấy bình luận.

issue.tool.forumNotFound: |-
  Không tìm thấy diễn đàn.
