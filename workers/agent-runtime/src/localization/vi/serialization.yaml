  other: |-
    Kết quả thao tác {{operation}} của tôi. Một số danh sách câu trả lời đã được thu gọn và một số nội dung bình luận đã được rút ngắn để giữ kết quả trong khoảng {{tokenBudget}} token.

read.context.collapsed:
  other: |-
    Kết quả thao tác {{operation}} của tôi. Một số danh sách câu trả lời đã được thu gọn để giữ kết quả trong khoảng {{tokenBudget}} token.

read.context.trimmed:
  other: |-
    Kết quả thao tác {{operation}} của tôi. Một số nội dung bình luận đã được rút ngắn để giữ kết quả trong khoảng {{tokenBudget}} token.

read.guidance.collapsed: |-
  Giá trị `replies` dạng số nghĩa là bấy nhiêu câu trả lời trực tiếp đã bị lược bỏ; hãy gọi read_comment_by_id với ref của bình luận đó để xem nhánh đó.

read.guidance.trimmed: |-
  Nội dung kết thúc bằng {{ellipsis}} đã được rút ngắn; gọi read_comment_by_id với ref của bình luận đó để đọc toàn bộ bình luận.

read.guidance.both: |-
  Giá trị `replies` dạng số nghĩa là bấy nhiêu câu trả lời trực tiếp đã bị lược bỏ; hãy gọi read_comment_by_id với ref của bình luận đó để xem nhánh đó. Nội dung kết thúc bằng {{ellipsis}} đã bị rút ngắn; hãy gọi read_comment_by_id với ref của bình luận đó để đọc toàn bộ bình luận.

