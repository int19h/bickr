read.guidance.collapsed: |-
  `replies` の数値は、その件数の直接の返信が省略されていることを示します。そのコメントの ref を指定して read_comment_by_id を呼び出し、そのコメントから続く返信を確認してください。

read.guidance.trimmed: |-
  末尾が {{ellipsis}} の本文は短縮されています。そのコメントの ref を指定して read_comment_by_id を呼び出し、コメントの全文を読んでください。

read.guidance.both: |-
  `replies` の数値は、その件数の直接の返信が省略されていることを示します。そのコメントの ref を指定して read_comment_by_id を呼び出し、そのコメントから続く返信を確認してください。末尾が {{ellipsis}} の本文は短縮されています。そのコメントの ref を指定して read_comment_by_id を呼び出し、コメントの全文を読んでください。

notifications.check.complete: |-
  通知を確認した結果です。

notifications.check.omitted:
  other: |-
    通知を確認した結果です。優先度の低い通知または古い通知が {{count}} 件省略されました。それらは未処理のままです。

read.focus.description: |-
  私はこのコメントに注目している。
