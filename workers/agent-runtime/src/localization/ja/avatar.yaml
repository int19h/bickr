avatar.image.participant_system: |-
  このBickr参加者の公開アバターを作成してください。求められた視覚的な方向性に従い、現在のプロフィール画像が提供されていればそれを使ってください。正方形または切り抜いたプロフィール表示で、被写体がはっきりわかるようにしてください。画像にキャプション、透かし、インターフェースの部品、説明文を入れないでください。

avatar.image.world_system: |-
  このBickrワールドの公開アバターを作成してください。求められた視覚的な方向性に従い、現在のワールド画像が提供されていればそれを使ってください。正方形または切り抜いたプロフィール表示で、舞台がはっきりわかるようにしてください。画像にキャプション、透かし、インターフェースの部品、説明文を入れないでください。

avatar.describe_current.participant_system: |-
  新しいBickr参加者アバターのために、提供された公開プロフィール画像を説明してください。外見、表情、ポーズ、服装、スタイル、色、光、背景、フレーミング、レイアウトについて具体的な詳細を含めてください。説明だけを返してください。

avatar.describe_current.world_system: |-
  新しいBickrワールドアバターのために、提供された公開ワールド画像を説明してください。風景、建物、物体、雰囲気、スタイル、色、光、背景、フレーミング、レイアウトについて具体的な詳細を含めてください。説明だけを返してください。

avatar.world_source.system: |-
  公開のBickrワールドアバターのための視覚的なプロンプトを書いてください。舞台設定とメンバーのプロフィールを使って、ワールドの画像を1枚描写してください。ランドマーク、風景、雰囲気、光、色、質感、レイアウト、カメラの視点について具体的な詳細を含めてください。キャプション、重ねた文字、インターフェースの部品、透かし、過程についてのコメントは含めないでください。プロンプトだけを返してください。

avatar.image.world_refresh: |-
  提供された現在のワールド画像を、更新する公開ワールドアバターの視覚的な入力として使ってください。

avatar.image.participant_refresh: |-
  提供された現在のプロフィール画像を、更新する公開プロフィールアバターの視覚的な入力として使ってください。

avatar.describe_current.world: |-
  更新する公開ワールドアバターのプロンプトのために、提供された現在のワールド画像の完全な視覚的説明を作成してください。

avatar.describe_current.participant: |-
  更新する公開アバターのプロンプトのために、提供された現在のプロフィール画像の完全な視覚的説明を作成してください。

avatar.persona_description.structured: |-
  あなたのプロフィール画像を説明してください。必要なJSONオブジェクトを返してください。説明はキャラクターとして一人称で書いてください。外見、スタイル、場面、光、レイアウトについて、具体的な視覚的詳細を多く示してください。目に見えるものだけを説明してください。

avatar.persona_description.tool: |-
  あなたのプロフィール画像を説明してください。{{toolName}}を呼び出してください。キャラクターとして一人称で書いてください。外見、スタイル、場面、光、レイアウトについて、具体的な視覚的詳細を多く示してください。目に見えるものだけを説明してください。

avatar.persona_description.repair_structured: |-
  descriptionという名前のフィールドをちょうど1つだけ持つJSONオブジェクトを返してください。キャラクターとして一人称で書いてください。目に見える外見、スタイル、場面、光、レイアウトだけを説明してください。

avatar.persona_description.repair_tool: |-
  {{toolName}}を呼び出してください。キャラクターとして一人称で書いてください。目に見える外見、スタイル、場面、光、レイアウトだけを説明してください。

