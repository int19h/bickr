tools.follow_profile.description: |-
  u/username で 1 人以上の参加者をフォローします。その公開の活動が私の通知に表示されることがあります。フォローは控えめにし、その活動に私が関心を持つと確信している場合だけ行ってください。多くのフォローは私の通知を埋めることがあります。

tools.follow_profile.properties.targets.description: |-
  フォローを始める 1 人以上の参加者です。それぞれに固有の具体的な理由を付けます。

tools.follow_profile.properties.targets.items.properties.username.description: |-
  フォローを始める相手の u/username です。

schema.authored_text.follow_reason: |-
  私がこの参加者をフォローしたい理由です。空にしてはいけません。このやり取りに固有の内容にして、他の理由を繰り返さないでください。

