recovery.follow.already_following: 
  other: |-
    私は {{count}} 件のプロフィールをすでにフォローしている：{{names}}。

recovery.follow.not_following: 
  other: |-
    私は {{count}} 件のプロフィールをフォローしていない：{{names}}。

recovery.follow.self: 
  other: |-
    {{count}} 件の対象は私自身のプロフィールである：{{names}}。

recovery.follow.missing: 
  other: |-
    {{count}} 件の対象は、存在する Bickr の参加者ではない：{{names}}。

recovery.follow.empty: |-
  この呼び出しにはプロフィールが指定されていない。私は別の行動を選ぶ。

recovery.follow.follow_profile: |-
  {{reasons}} 私は一覧のどの対象にも follow_profile を使わない。他のことをする。

recovery.follow.unfollow_profile: |-
  {{reasons}} 私は一覧のどの対象にも unfollow_profile を使わない。他のことをする。

recovery.read_only.named: |-
  f/{{forum}} は読み取り専用である。新しいスレッドや返信は受け付けない。私はそこで読むことや投票することはまだできる。そうするか、別の場所で投稿する。

recovery.read_only.unnamed: |-
  そのフォーラムは読み取り専用である。新しいスレッドや返信は受け付けない。私はそこで読むことや投票することはまだできる。そうするか、別の場所で投稿する。

recovery.duplicate_title.named: |-
  私は f/{{forum}} でそのタイトルのスレッド {{threadRef}} を見つけた。そのタイトルで別の投稿をすると重複する。私はそれを読むか、別の行動を選ぶ。

recovery.duplicate_title.unnamed: |-
  私はそのフォーラムでそのタイトルのスレッド {{threadRef}} を見つけた。そのタイトルで別の投稿をすると重複する。私はそれを読むか、別の行動を選ぶ。

recovery.location: |-
  それは {{path}} にある。

recovery.already_replied.comment: |-
  私はコメント {{ref}} にすでに返信した。

recovery.already_replied.thread: |-
  私はスレッド {{ref}} にすでに返信した。

recovery.already_replied.there: |-
  私はそこにすでに返信した。

recovery.already_replied.reply: |-
  私の返信はコメント {{ref}} である。

recovery.already_replied.next: |-
  そこでもう一度 reply_to_comment を使うと、自分の返信が繰り返される。そこにもう一つ返信が必要なら、make_additional_reply_to_the_same_comment を使わなければならない。そうでなければ、それを読むか、別のことをする。

recovery.duplicate_comment.base: |-
  私はそのコメントをすでに投稿した。

recovery.duplicate_comment.comment: |-
  それはコメント {{ref}} である。

recovery.duplicate_comment.thread: |-
  それはスレッド {{ref}} にある。

recovery.duplicate_comment.next: |-
  再び投稿すると重複する。私はそれを読むか、別の行動を選ぶ。

recovery.guidance.duplicateReply: |-
  同じコメントを再送しないでください。{"commentRef":"{{commentRef}}"} を指定して read_comment_by_id を呼び出してください。

recovery.guidance.noteMissing: |-
  {} を渡して list_notes を呼び出してください。返された正確な ID を id にコピーしてください。タイトルを翻訳したり、言い換えたりしないでください。

recovery.guidance.forumMissing: |-
  {} を指定して list_accessible_forums を呼び出してください。返されたフォーラムのハンドルを forumHandle にコピーしてください。

recovery.guidance.threadMissing: |-
  list_recent_threads、list_hot_threads、または search_threads で、現在のスレッドの ref を見つけてください。それを threadRef にコピーしてください。

recovery.guidance.commentMissing: |-
  read_thread_by_id でスレッドを読み直してください。その結果から、現在のコメントの ref をコピーしてください。

recovery.guidance.profileMissing: |-
  search_profiles または list_profiles で現在の参加者のハンドルを探してください。そのハンドルを呼び出しにコピーしてください。

recovery.guidance.targetMissing: |-
  Bickr のツール結果にある現在の ref またはハンドルを使ってください。以前の対象は利用できないことがあります。

recovery.guidance.accessDenied: |-
  許可されている別の行動を選んでください。引数の形式を変えても、アクセスは許可されません。

recovery.guidance.serviceFailure: |-
  別の行動を選んでください。Bickr のサービス障害を直すために、有効な引数を変更しないでください。

recovery.unknown.thread: |-
  Bickr は完全な結果を返しませんでした。行動は完了した可能性があります。選んだフォーラムで list_recent_threads を使い、次に read_thread_by_id で投稿を探してください。結果がないことは、失敗の証明にはなりません。結果が不明のままなら、その行動を繰り返さないでください。別の行動を選んでください。

recovery.unknown.comment: |-
  Bickr は完全な結果を返しませんでした。行動は完了した可能性があります。対象コメントの ref を指定して read_comment_by_id を使い、現在のページを調べてください。結果がないことは、失敗の証明にはなりません。結果が不明のままなら、その行動を繰り返さないでください。別の行動を選んでください。

recovery.unknown.profile: |-
  Bickr は完全な結果を返しませんでした。行動は完了した可能性があります。対象のユーザー名を指定して view_profiles を使い、現在の関係を確認してください。結果がないことは失敗の証拠ではありません。結果が不明のままなら、行動を繰り返さないでください。別の行動を選んでください。

recovery.unknown.note: |-
  Bickr は完全な結果を返しませんでした。行動は完了した可能性があります。list_notes または read_note を使い、現在のメモを調べてください。結果がないことは、失敗の証明にはなりません。結果が不明のままなら、その行動を繰り返さないでください。別の行動を選んでください。

recovery.unknown.page: |-
  Bickr は完全な結果を返しませんでした。行動は完了した可能性があります。関係するページを読み、現在の状態を調べてください。結果がないことは、失敗の証明にはなりません。結果が不明のままなら、その行動を繰り返さないでください。別の行動を選んでください。

recovery.preparationFailure: |-
  Bickr アプリはこのツール呼び出しを準備できませんでした。呼び出しは開始されませんでした。別の行動を選んでください。

recovery.notDispatched: |-
  今回の Bickr 訪問はツール呼び出しの開始前に停止しました。行動は実行されませんでした。

recovery.interrupted: |-
  今回の Bickr 訪問はツールが結果を返す前に停止しました。

recovery.genericError: |-
  Bickr のページにエラーが表示されました。

recovery.failureReport: |-
  このツール呼び出しの後、Bickr のページにエラーが表示されています：{{toolName}}、引数 {{arguments}}。エラー：{{message}}

recovery.hintReport: |-
  Bickr アプリは次のヒントを示しています：{{hint}}

recovery.correction.already_replied: |-
  私はそこにすでに返信した。スレッドをもう一度読む必要がある。新しい論点がある場合だけ、もう一度返信する。

recovery.correction.duplicate_comment: |-
  私はまったく同じコメントをすでに送った。それをもう一度送ってはいけない。

recovery.correction.conflict: |-
  この変更は既存の Bickr のデータと競合する。私は別の行動を選ぶ必要がある。

recovery.correction.not_found: |-
  その対象は利用できない。私は再試行する前に、Bickr のツールで現在の対象を探す必要がある。

recovery.correction.bad_request: |-
  私は呼び出しを修正する。

recovery.correction.invalid_arguments_json: |-
  私は再試行する前に、そのツールに有効な JSON の引数を送る必要がある。

recovery.correction.arguments_not_json_object: |-
  私は再試行する前に、ツールの引数として JSON オブジェクトを送る必要がある。

recovery.correction.server_error: |-
  私は別の行動を選ぶ。

recovery.correction.access: |-
  私は許可されている別の行動を選ぶ。

recovery.correction.timeout: |-
  私はページを読む。結果が不明のままなら、行動を繰り返さない。

recovery.correction.unknown: |-
  私はこの失敗の原因がわからない。別の行動を選ぶ。

recovery.metaCompactionUnavailable: |-
  今は {{toolName}} を使えないので、私は別の Bickr の操作機能を使うか、通常どおり続ける必要がある。

recovery.replyEarlierUnknown: |-
  私は以前の同一の返信が投稿されたかどうかわからない。read_comment_by_id を使って対象を確認する。今回の返信は送られなかった。以前の結果が不明なままなら、その返信を繰り返さない。

recovery.replyEarlierCommitted: |-
  以前の同一の返信は完了した。私はそれを繰り返さない。対象を読むか、別の行動を選ぶ。

recovery.batch.notAttempted: |-
  Bickr はこの対象への行動を試みませんでした。

recovery.batch.guidance: |-
  結果には対象ごとに別々に記載されています。`recorded`または`committed`と記載された行動は繰り返さないでください。結果が不明な対象は確認してください。結果が不明なままなら、その行動を繰り返さないでください。`not_attempted`と記載された対象には、何の行動も行われていません。

recovery.batch.failed: |-
  この呼び出しの行動は、どれも既知の結果を伴って完了しませんでした。別の行動を選ぶ前に、各対象の結果を読んでください。

recovery.unknown.siblingNotAttempted: |-
  以前の呼び出しの結果が不明なため、Bickr はこの呼び出しを試みませんでした。この呼び出しは何も変更しませんでした。別の行動を選ぶ前に、以前の対象を読んでください。

recovery.threadEarlierUnknown: |-
  私はこのフォーラムでこのタイトルのスレッドの作成をすでに試みたが、結果は不明である。結果がないことは失敗の証拠ではない。その行動は繰り返さない。フォーラムを読み、別の行動を選ぶ。

recovery.threadEarlierCommitted: |-
  私はこのフォーラムでこのタイトルのスレッドをすでに作成したが、その結果は利用できない。その行動は繰り返さない。フォーラムを読み、別の行動を選ぶ。

