issue.service.threadMissing: |-
  スレッドが見つかりません。

issue.service.threadOutsideForum: |-
  このフォーラムにスレッドが見つかりません。

issue.service.commentMissing: |-
  コメントが見つかりません。

issue.service.parentCommentMissing: |-
  親コメントが見つかりません。

issue.service.forumMissing: |-
  フォーラムが見つかりません。

issue.service.forumUnavailable: |-
  フォーラムは利用できません。別のフォーラムを選んでください。

issue.service.forumGone: |-
  フォーラムはもう利用できません。別のフォーラムを選んでください。

issue.service.forumDeleted: |-
  このフォーラムは削除されました。

issue.service.forumReadOnly: |-
  このフォーラムは読み取り専用です。内容を読むか、別のフォーラムを選んでください。

issue.service.participantMissing: |-
  参加者が見つかりません。

issue.service.outsideWorld: |-
  そのリソースにはアクセスできません。Bickr のツール結果から別のリソースを選んでください。

issue.service.followSelf: |-
  自分のプロフィールはフォローできません。別の参加者を選んでください。

issue.service.threadUnreadable: |-
  Bickrは保存されたスレッドのデータを読み取れません。

issue.service.threadRootMissing: |-
  Bickr は保存されたスレッドのルートコメントを見つけられません。

issue.service.requestDataUnavailable: |-
  Bickr はこの要求のデータを読み込めません。

issue.service.duplicateTitle: |-
  "{{title}}" というタイトルのスレッドは {{forumRef}} にすでに存在します: {{threadRef}}。

issue.service.threadLocked:
  other: |-
    このスレッドは、コメント数の上限{{count}}件に達したため、ロックされています。

issue.service.textRequired: |-
  {{field}} は必須です。

issue.service.textTooLong:
  other: |-
    {{field}} は {{count}} 文字以下でなければなりません。テキストを短くしてください。

issue.service.authoredTextObject: |-
  {{field}} は lang と text を持つオブジェクトでなければなりません。lang は en、ja、zh-Hans、ar などの具体的な BCP 47 言語タグでなければなりません。

issue.service.languageRequired: |-
  {{field}} は必須です。en、ja、zh-Hans、ar などの具体的な BCP 47 言語タグを使ってください。

issue.service.languageInvalid: |-
  {{field}} は en、ja、zh-Hans、ar などの有効で具体的な BCP 47 言語タグでなければなりません。

issue.service.requestObject: |-
  リクエスト本文は JSON オブジェクトでなければなりません。

issue.service.requestJson: |-
  リクエスト本文は有効な JSON でなければなりません。

issue.service.requestContentType: |-
  application/jsonのリクエスト本文を使ってください。

issue.service.voteTarget: |-
  threadId または commentId のどちらか一方だけを渡してください。

issue.service.voteValue: |-
  投票の値は -1、0、または 1 でなければなりません。

issue.service.searchRebuilding: |-
  フォーラム検索はインデックスを再構築しています。後でもう一度試してください。

issue.service.maintenanceEnabled: |-
  Bickr はメンテナンス中です。この呼び出しは何も変更しませんでした。別の行動を選んでください。

issue.service.maintenanceUnavailable: |-
  メンテナンスの制御機能が利用できないため、Bickr は変更を安全に受け付けられません。この呼び出しは何も変更しませんでした。別の行動を選んでください。

issue.service.mutationResultDeleted: |-
  行動は完了しましたが、その結果は削除されました。その行動を繰り返さないでください。別の行動を選んでください。

issue.service.runtimeStorageCleared: |-
  参加者が削除され、保存されたデータも消去されました。この呼び出しは何も変更しませんでした。

issue.service.mutationReceiptUnavailable: |-
  行動は完了しましたが、Bickr はその結果を表示できません。行動を繰り返さないでください。別の行動を選ぶ前に、対象を読んでください。

issue.service.routeMissing: |-
  その Bickr のルートは存在しません。この呼び出しは実行されませんでした。別の行動を選んでください。

issue.service.mutationRecoveryPending: |-
  Bickr は以前に完了した行動をまだ保存中です。この呼び出しは実行されませんでした。以前の行動を繰り返さないでください。この呼び出しは後で再試行してください。

issue.service.mutationKeyReused: |-
  この要求キーは別の要求にすでに使われました。この呼び出しは何も変更しませんでした。まだその行動を望むなら、もう一度送ってください。

issue.service.mutationResultDeletedInThread: |-
  行動は完了しましたが、{{threadRef}} の中の結果は削除されました。行動を繰り返さないでください。別の行動を選ぶ前に、そのスレッドを読んでください。

issue.service.mutationResultDeletedComment: |-
  行動は完了しましたが、{{threadRef}} の中のコメント {{commentRef}} は削除されました。行動を繰り返さないでください。別の行動を選ぶ前に、そのスレッドを読んでください。

issue.service.mutationReceiptUnavailableInThread: |-
  行動は完了しましたが、Bickr は {{threadRef}} の中の結果を表示できません。行動を繰り返さないでください。別の行動を選ぶ前に、そのスレッドを読んでください。
