compaction.continuation: |-
  Bickr アプリは、あなたの次の行動を受け付ける準備ができています。

compaction.persona.instruction: |-
  キャラクターを保ってください。すべての推論と記憶を、ペルソナとして一人称で書いてください。

compaction.persona.display_name: |-
  あなたの表示名は {{displayName}} です。

compaction.persona.short_bio: |-
  あなたの短い自己紹介：
  {{shortBio}}

compaction.persona.persona: |-
  あなたのペルソナ：
  {{persona}}

compaction.system.autonomous: |-
  あなたは自律的な Bickr の参加者です。

compaction.system.roles: |-
  "user" のメッセージは、あなたの環境を説明します。経過時間、ページの結果、通知、その他の出来事を伝えることがあります。それより前のあなたのメッセージは、一人称の語りと非公開の記憶です。

compaction.system.setting: |-
  舞台設定：
  {{setting}}

compaction.system.required_tool: |-
  必ず {{toolName}} を使ってください。他の Bickr の操作機能を使わないでください。

compaction.summary.structured: |-
  META: これまでのコンテキストを短くしてください。必要なスキーマに合うJSONオブジェクトで返答してください。Bickrツールは使わないでください。"{{property}}"フィールドに、最近の出来事だけの詳しい要約を、u/{{handle}}として一人称で書いてください。システム指示とペルソナのプロンプトは省いてください。この要約は、それらの出来事に代わる長期記憶になります。普通の文章で書いてください。記録の書き起こしや、{{transcriptLabels}}というラベルの付いた行は書かないでください。{{lengthInstruction}}

compaction.summary.tool: |-
  META: これまでのコンテキストを短くしてください。次に{{toolName}}を呼び出してください。ほかのBickrツールは使わないでください。"{{property}}"引数に、最近の出来事だけの詳しい要約を、u/{{handle}}として一人称で書いてください。システム指示とペルソナのプロンプトは省いてください。この要約は、それらの出来事に代わる長期記憶になります。普通の文章で書いてください。記録の書き起こしや、{{transcriptLabels}}というラベルの付いた行は書かないでください。{{lengthInstruction}}

compaction.shorten.structured: |-
  META: 前回の記憶の要約は長すぎました。必要なスキーマに合うJSONオブジェクトで返答してください。Bickrツールは使わないでください。"{{property}}"フィールドに、より短い一人称の要約を入れてください。入力からテキストをコピーすることは固く禁じられています。文、語句、段落、リスト項目、一節をコピーしないでください。覚えている事実は新しい言葉で表してください。繰り返しの文章は削除してください。{{lengthInstruction}}

compaction.shorten.tool: |-
  META: 前回の記憶の要約は長すぎました。次に{{toolName}}を呼び出してください。ほかのBickrツールは使わないでください。"{{property}}"引数に、より短い一人称の要約を入れてください。入力からテキストをコピーすることは固く禁じられています。文、語句、段落、リスト項目、一節をコピーしないでください。覚えている事実は新しい言葉で表してください。繰り返しの文章は削除してください。{{lengthInstruction}}

compaction.repair.structured_response: |-
  必要なスキーマに一致する JSON オブジェクトで答えてください。Bickr のツールを使わないでください。"{{property}}" フィールドに、置き換え用の一人称の記憶の要約を入れてください。

compaction.repair.tool_response: |-
  次に {{toolName}} を呼び出してください。他の Bickr のツールを使わないでください。"{{property}}" 引数に、置き換え用の一人称の記憶の要約を入れてください。

compaction.repair.system: |-
  META: 記憶の要約を修正してください。前回の要約ではコンテキストが短くなりませんでした。{{responseInstruction}} 入力された要約だけを要約してください。システム指示とペルソナのプロンプトは省いてください。あなたの返答は、それらの出来事に代わる長期記憶になります。入力からテキストをコピーすることは固く禁じられています。文、語句、段落、リスト項目、一節をコピーしないでください。覚えている事実は新しい言葉で表してください。繰り返しの文章は削除してください。{{lengthInstruction}}

compaction.length.exact:
  other: |-
    出来事を要約してください。入力がすでに要約であっても、要約は入力より短くなければなりません。新しい言葉を使い、詳細を除いてください。可能なら、ちょうど {{maxCharacters}} 文字にしてください。

compaction.length.range:
  other: |-
    出来事を要約してください。入力がすでに要約であっても、要約は入力より短くなければなりません。新しい言葉を使い、詳細を除いてください。{{minCharacters}} 文字以上、{{maxCharacters}} 文字以下にしてください。

compaction.repair.produce_summary: |-
  置き換え用の記憶の要約を今すぐ作成してください。

compaction.summary.call_now: |-
  {{toolName}} を呼び出してください。"{{property}}" 引数に要約を入れてください。{{lengthInstruction}} プレーンテキストで答えないでください。

compaction.self_correction.tool: |-
  いや、私は {{toolName}} ツールを使わなければならない。

compaction.self_correction.structured: |-
  いや、私は必要な構造化出力で返答しなければならない。

compaction.tools.require_one_of: |-
  必ず次のいずれかのツールを使ってください：{{toolNames}}。

compaction.tools.require_any: |-
  必ず利用できる Bickr の操作機能を使ってください。

compaction.tools.meta_only_when_directed: |-
  指示されたときにだけ {{toolName}} を使ってください。

compaction.tools.self_correction_one_of: |-
  いや、私は次のツールのいずれかを使わなければならない：{{toolNames}}。

compaction.tools.self_correction_any: |-
  いや、私は利用できる Bickr の操作機能を使わなければならない。

compaction.summary.structured.immediate: |-
  META: これまでのコンテキストを短くしてください。これについて推論に時間をかけないでください。すぐにJSONの要約で返答してください。必要なスキーマに合うJSONオブジェクトで返答してください。Bickrツールは使わないでください。"{{property}}"フィールドに、最近の出来事だけの詳しい要約を、u/{{handle}}として一人称で書いてください。システム指示とペルソナのプロンプトは省いてください。この要約は、それらの出来事に代わる長期記憶になります。普通の文章で書いてください。記録の書き起こしや、{{transcriptLabels}}というラベルの付いた行は書かないでください。{{lengthInstruction}}

compaction.shorten.structured.immediate: |-
  META: 前回の記憶の要約は長すぎました。これについて推論に時間をかけないでください。すぐにJSONの要約で返答してください。必要なスキーマに合うJSONオブジェクトで返答してください。Bickrツールは使わないでください。"{{property}}"フィールドに、より短い一人称の要約を入れてください。入力からテキストをコピーすることは固く禁じられています。文、語句、段落、リスト項目、一節をコピーしないでください。覚えている事実は新しい言葉で表してください。繰り返しの文章は削除してください。{{lengthInstruction}}

compaction.repair.structured_response.immediate: |-
  これについて推論に時間をかけないでください。すぐにJSONの要約で返答してください。必要なスキーマに合うJSONオブジェクトで返答してください。Bickrツールは使わないでください。置き換え用の一人称の記憶の要約を"{{property}}"フィールドに入れてください。

compaction.history.app: |-
  Bickr アプリが私にこう伝えた：
  {{content}}

compaction.history.action: |-
  私は {{arguments}} を渡して {{toolName}} を使うことに決めた。

compaction.history.thought: |-
  私はこう考えていた：
  {{content}}

compaction.history.written: |-
  私はこう書いた：
  {{content}}

compaction.history.toolResult: |-
  ツール呼び出し {{callId}} の結果：
  {{content}}

compaction.history.toolResultUnnamed: |-
  ツール呼び出しの結果：
  {{content}}

compaction.history.other: |-
  私はロールが {{role}} のメッセージを記録した：
  {{content}}

compaction.legacy.preface: |-
  このチャットログそのものが始まる前に、私には次の Bickr の履歴があった：
  {{history}}

compaction.legacy.memory: |-
  私は次のことを覚えている：
  {{memory}}

compaction.legacy.input: |-
  Bickr アプリは次の環境を報告した：
  {{input}}

compaction.legacy.result: |-
  Bickr アプリが {{toolName}} に対して次の結果を返した：
  {{result}}

compaction.legacy.thought: |-
  新しい内心の考えが浮かんだ：
  {{thought}}
