issue.note.id.type: |-
  id metin olmalıdır. id olarak notun başlığını verin. Mevcut bir not için list_notes sonucundan bir ID kopyalayın.

issue.note.id.length: 
  one: |-
    id normalleştirmeden sonra {{minimum}}-{{maximum}} karakter içermelidir. id olarak notun başlığını verin. Mevcut bir not için list_notes sonucundan bir ID kopyalayın.
  other: |-
    id normalleştirmeden sonra {{minimum}}-{{maximum}} karakter içermelidir. id olarak notun başlığını verin. Mevcut bir not için list_notes sonucundan bir ID kopyalayın.

issue.note.id.characters: |-
  id yalnızca harf, işaret, sayı, noktalama, simge ve boşluk içerebilir. id olarak notun başlığını verin. Mevcut bir not için list_notes sonucundan bir ID kopyalayın.

issue.note.cursor.type: |-
  cursor metin olmalıdır. Önceki list_notes sonucundan nextCursor değerini kopyalayın. Yeni bir liste başlatmak için cursor vermeyin.

issue.note.cursor.length: 
  one: |-
    Normalleştirmeden sonra cursor {{minimum}}-{{maximum}} karakter içermelidir. Önceki list_notes sonucundan nextCursor değerini kopyalayın. Yeni bir liste başlatmak için cursor vermeyin.
  other: |-
    Normalleştirmeden sonra cursor {{minimum}}-{{maximum}} karakter içermelidir. Önceki list_notes sonucundan nextCursor değerini kopyalayın. Yeni bir liste başlatmak için cursor vermeyin.

issue.note.cursor.characters: |-
  cursor yalnızca harf, işaret, sayı, noktalama, simge ve boşluk içerebilir. Önceki list_notes sonucundan nextCursor değerini kopyalayın. Yeni bir liste başlatmak için cursor vermeyin.

issue.note.content: 
  one: |-
    content 1-{{max}} karakterlik bir metin olmalıdır. Notun tam metnini content alanında verin.
  other: |-
    content 1-{{max}} karakterlik bir metin olmalıdır. Notun tam metnini content alanında verin.

issue.note.entities.array: 
  one: |-
    entities en fazla {{max}} f/ veya u/ tanıtıcısından oluşan bir dizi olmalıdır. Örneğin {"entities":["u/alice"]} kullanın.
  other: |-
    entities en fazla {{max}} f/ veya u/ tanıtıcısından oluşan bir dizi olmalıdır. Örneğin {"entities":["u/alice"]} kullanın.

issue.note.entities.entry: |-
  Her entities girdisi tek bir f/ veya u/ tanıtıcısı olmalıdır. Örneğin {"entities":["u/alice","f/news"]} kullanın.

issue.note.references: 
