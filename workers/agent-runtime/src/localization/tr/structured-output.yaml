structured_output.unexpected_tools.compaction: |-
  META: Araç çağırmayın. Gerekli JSON şemasına uyan, birinci tekil şahısla yazılmış ayrıntılı bir özetle yanıt verin.

structured_output.unexpected_tools.other: |-
  Bu yanıt için Bickr kontrolü kullanmayın. Yalnızca {{property}} içeren gerekli JSON nesnesiyle yanıt verin.

structured_output.empty.compaction: |-
  Özet yanıtı boştu. {{property}} alanında boş olmayan metin içeren bir JSON nesnesi döndürün.

structured_output.empty.translation: |-
  Çeviri yanıtı boştu. {{property}} alanında boş olmayan metin bulunan bir JSON nesnesi döndürün.

structured_output.empty.avatar_description: |-
  Profil resmi açıklaması yanıtı boştu. {{property}} alanında boş olmayan metin içeren bir JSON nesnesi döndürün.

structured_output.invalid_json.compaction: |-
  Özet yanıtı bir JSON nesnesi olmalıdır. Yalnızca {{property}} alanını metin değeriyle verin.

structured_output.invalid_json.translation: |-
  Çeviri yanıtı bir JSON nesnesi olmalıdır. Yalnızca {{property}} alanını metin değeriyle verin.

structured_output.invalid_json.avatar_description: |-
  Profil resmi açıklaması yanıtı bir JSON nesnesi olmalıdır. Yalnızca {{property}} alanını metin değeriyle verin.

structured_output.missing_tool: |-
  Hiç {{toolName}} araç çağrısı döndürülmedi. {{property}} alanında boş olmayan metinle {{toolName}} aracını bir kez çağırın.

structured_output.wrong_tool: |-
  Bu istek için yalnızca {{toolName}} aracını kullanın. Burada {{receivedTool}} aracını kullanmayın.

structured_output.tool_count: 
  one: |-
    Bir {{toolName}} araç çağrısı bekleniyordu, ancak {{count}} araç çağrısı alındı. {{toolName}} aracını tam olarak bir kez çağırın.
  other: |-
    Bir {{toolName}} araç çağrısı bekleniyordu, ancak {{count}} araç çağrısı alındı. {{toolName}} aracını tam olarak bir kez çağırın.

structured_output.tool_mismatch: |-
  {{toolName}} aracı bekleniyordu, ancak {{receivedTool}} alındı. Bunun yerine {{toolName}} aracını çağırın.

structured_output.invalid_arguments_json: |-
  {{toolName}} argümanları geçerli JSON değildi. {{property}} alanında metin içeren bir JSON nesnesi verin. Dizgelerdeki özel karakterler için kaçış kullanın.

structured_output.arguments_object: |-
  {{toolName}} argümanları bir JSON nesnesi olmalıdır. {{property}} alanını ve metin değerini {} içine koyun.

structured_output.output_object: |-
  Yapılandırılmış çıktı bir JSON nesnesi olmalıdır. {{property}} alanını ve metin değerini {} içine koyun.

structured_output.extra_arguments: 
  one: |-
    {{count}} beklenmeyen argüman var: {{fields}}. O argümanı kaldırın. Yalnızca {{property}} verin.
  other: |-
    {{count}} beklenmeyen argüman var: {{fields}}. Gösterilen argümanların tümünü kaldırın. Yalnızca {{property}} verin.

structured_output.extra_fields: 
  one: |-
    {{count}} beklenmeyen alan var: {{fields}}. O alanı kaldırın. Yalnızca {{property}} verin.
  other: |-
    {{count}} beklenmeyen alan var: {{fields}}. Gösterilen alanların tümünü kaldırın. Yalnızca {{property}} verin.

