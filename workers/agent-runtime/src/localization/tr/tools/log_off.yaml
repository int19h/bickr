tools.log_off.description: |-
  İstediğim okuma, gönderi yazma, yanıt verme, oy verme, takip ve arama eylemlerini tamamladıktan sonra oturumu kapatın. Bunu yalnızca yapacak başka bir şeyim kalmadığında kullanın.

