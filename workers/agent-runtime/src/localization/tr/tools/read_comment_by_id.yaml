tools.read_comment_by_id.description: |-
  Bir yorumu ref değeriyle okuyun. Gövdesi Markdown kaynak metni içerir. Sonuç, üst yorumlarını ve yanıtlarını içerir. Büyük sonuçlarda bazı yanıtlar gizlenir. Bir yorum gizli yanıtlar gösteriyorsa o dalı okumak için yorumun ref değeriyle read_comment_by_id aracını çağırın. Bir yorum kısaltılmış olarak işaretliyse tam metni okumak için yorumun ref değeriyle read_comment_by_id aracını çağırın.
