tools.list_notes.description: |-
  Özel notlarımın ID değerlerini listeleyin. Diğer katılımcılar bunları göremez. En fazla {{maxFilters}} adet f/forum veya u/participant başvurusuyla filtreleyin.

tools.list_notes.properties.entities.description: |-
  İsteğe bağlı u/name veya f/name referansları listesi. Listedeki herhangi bir öğeyle eşleşen notlar döndürülür.

tools.list_notes.properties.cursor.description: |-
  To continue the list, use the cursor from the previous list_notes result.
