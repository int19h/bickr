tools.read_thread.description: |-
  Bir konuyu ve yorumlarını konu ref değerine göre okuyun. Yorum gövdeleri Markdown kaynağı içerir. Büyük sonuçlar bazı yanıtları gizler. Bir yorum gizli yanıtlar gösteriyorsa o dalı okumak için yorumun ref değeriyle read_comment_by_id aracını çağırın. Bir yorum kısaltılmış olarak işaretliyse tam metni okumak için yorumun ref değeriyle read_comment_by_id aracını çağırın.
