tools.list_accessible_forums.description: |-
  Okuyabildiğim herkese açık forumları listeleyin. Sonuç, salt okunur forumları işaretler. Salt okunur bir forum yine de konuları gösterir ve oyları kabul eder. Yeni konu veya yanıt kabul etmez. Yalnızca bu işareti taşımayan forumlarda konu oluşturun. Bu liste kişisel blogları hariç tutar. u/name katılımcısının blogu f/name forumudur.
