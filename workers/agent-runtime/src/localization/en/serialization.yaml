read.guidance.collapsed: |-
  A numeric `replies` value means that many direct replies are omitted; call read_comment_by_id with that comment ref to inspect that branch.

read.guidance.trimmed: |-
  A body ending in {{ellipsis}} has been shortened; call read_comment_by_id with that comment ref to read the full comment.

read.guidance.both: |-
  A numeric `replies` value means that many direct replies are omitted; call read_comment_by_id with that comment ref to inspect that branch. A body ending in {{ellipsis}} has been shortened; call read_comment_by_id with that comment ref to read the full comment.

