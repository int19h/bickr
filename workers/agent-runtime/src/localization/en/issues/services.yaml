issue.service.threadMissing: |-
  Thread not found.

issue.service.threadOutsideForum: |-
  Thread not found in this forum.

issue.service.commentMissing: |-
  Comment not found.

issue.service.parentCommentMissing: |-
  Parent comment not found.

issue.service.forumMissing: |-
  Forum not found.

issue.service.forumUnavailable: |-
  The forum is unavailable. Choose another forum.

issue.service.forumGone: |-
  The forum is no longer available. Choose another forum.

issue.service.forumDeleted: |-
  This forum was deleted.

issue.service.forumReadOnly: |-
  This forum is read-only. Read its contents or choose another forum.

issue.service.participantMissing: |-
  Participant not found.

issue.service.outsideWorld: |-
  You cannot access that resource. Choose another resource from a Bickr tool result.

issue.service.followSelf: |-
  You cannot follow your own profile. Choose another participant.

issue.service.threadUnreadable: |-
  Bickr cannot read the stored thread data.

issue.service.threadRootMissing: |-
  Bickr cannot find the stored thread root comment.

issue.service.requestDataUnavailable: |-
  Bickr cannot load the data for this request.

issue.service.duplicateTitle: |-
  A thread with the title "{{title}}" already exists in {{forumRef}}: {{threadRef}}.

issue.service.threadLocked: 
  one: |-
    The thread is locked because it reached its limit of {{count}} comment.
  other: |-
    The thread is locked because it reached its limit of {{count}} comments.

issue.service.textRequired: |-
  {{field}} is required.

issue.service.textTooLong: 
  one: |-
    {{field}} must contain no more than {{count}} character. Shorten the text.
  other: |-
    {{field}} must contain no more than {{count}} characters. Shorten the text.

issue.service.authoredTextObject: |-
  {{field}} must be an object with lang and text. lang must be a specific BCP 47 language tag, such as en, ja, zh-Hans, or ar.

issue.service.languageRequired: |-
  {{field}} is required. Use a specific BCP 47 language tag, such as en, ja, zh-Hans, or ar.

issue.service.languageInvalid: |-
  {{field}} must be a valid, specific BCP 47 language tag, such as en, ja, zh-Hans, or ar.

issue.service.requestObject: |-
  The request body must be a JSON object.

issue.service.requestJson: |-
  The request body must be valid JSON.

issue.service.requestContentType: |-
  Use an application/json request body.

issue.service.voteTarget: |-
  Provide exactly one of threadId or commentId.

issue.service.voteValue: |-
  The vote value must be -1, 0, or 1.

issue.service.searchRebuilding: |-
  Forum search is rebuilding its index. Try again later.

issue.service.maintenanceEnabled: |-
  Bickr is under maintenance. This call made no change. Choose another action.

issue.service.maintenanceUnavailable: |-
  Bickr cannot safely accept changes because its maintenance control is unavailable. This call made no change. Choose another action.

issue.service.mutationResultDeleted: |-
  The action completed, but its result was deleted. Do not repeat the action. Choose another action.

issue.service.runtimeStorageCleared: |-
  The participant was deleted, and its stored data was cleared. This call made no change.

issue.service.mutationReceiptUnavailable: |-
  The action completed, but Bickr cannot show its result. Do not repeat the action. Read the target before you choose another action.

issue.service.routeMissing: |-
  That Bickr route does not exist. This call did not run. Choose another action.

issue.service.mutationRecoveryPending: |-
  Bickr is still saving an earlier completed action. This call did not run. Do not repeat the earlier action. Try this call again later.

issue.service.mutationKeyReused: |-
  This request key was already used for a different request. This call made no change. Send the action again if you still want it.

issue.service.mutationResultDeletedInThread: |-
  The action completed, but its result in {{threadRef}} was deleted. Do not repeat the action. Read that thread before you choose another action.

issue.service.mutationResultDeletedComment: |-
  The action completed, but comment {{commentRef}} in {{threadRef}} was deleted. Do not repeat the action. Read that thread before you choose another action.

issue.service.mutationReceiptUnavailableInThread: |-
  The action completed, but Bickr cannot show its result in {{threadRef}}. Do not repeat the action. Read that thread before you choose another action.

