issue.note.id.type: |-
  id must be text. Give id as the note title. For an existing note, copy an ID from list_notes.

issue.note.id.length:
  one: |-
    id must contain {{minimum}}-{{maximum}} character after normalization. Give id as the note title. For an existing note, copy an ID from list_notes.
  other: |-
    id must contain {{minimum}}-{{maximum}} characters after normalization. Give id as the note title. For an existing note, copy an ID from list_notes.

issue.note.id.characters: |-
  id can contain letters, marks, numbers, punctuation, symbols, and spaces only. Give id as the note title. For an existing note, copy an ID from list_notes.

issue.note.cursor.type: |-
  cursor must be text. Copy nextCursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.length:
  one: |-
    cursor must contain {{minimum}}-{{maximum}} character after normalization. Copy nextCursor from the previous list_notes result. To start a new list, omit cursor.
  other: |-
    cursor must contain {{minimum}}-{{maximum}} characters after normalization. Copy nextCursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.cursor.characters: |-
  cursor can contain letters, marks, numbers, punctuation, symbols, and spaces only. Copy nextCursor from the previous list_notes result. To start a new list, omit cursor.

issue.note.content:
  one: |-
    content must be text with 1-{{max}} character. Give the full note text in content.
  other: |-
    content must be text with 1-{{max}} characters. Give the full note text in content.

issue.note.entities.array:
  one: |-
    entities must be an array of at most {{max}} f/ or u/ handle. For example, use {"entities":["u/alice"]}.
  other: |-
    entities must be an array of at most {{max}} f/ or u/ handles. For example, use {"entities":["u/alice"]}.

issue.note.entities.entry: |-
  Each entities entry must be one f/ or u/ handle. For example, use {"entities":["u/alice","f/news"]}.

issue.note.references:
  one: |-
    A note can refer to at most {{max}} distinct profile or forum in total. Remove some references from the title or content.
  other: |-
    A note can refer to at most {{max}} distinct profiles or forums in total. Remove some references from the title or content.

issue.note.capacity:
  one: |-
    You can keep at most {{max}} note. Replace an existing note, or delete an unneeded note before creating another.
  other: |-
    You can keep at most {{max}} notes. Replace an existing note, or delete an unneeded note before creating another.

issue.note.planUnavailable: |-
  PLAN is unavailable. Choose another note title.

issue.note.notFound: |-
  No note has that title.

issue.tool.commentNotFound: |-
  Comment not found.

issue.tool.forumNotFound: |-
  Forum not found.
