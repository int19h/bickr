issue.args.notObject.array: |-
  The tool call is invalid. The arguments for {{toolName}} must be a JSON object. You supplied an array. Put the arguments inside {}.

issue.args.notObject.string: |-
  The tool call is invalid. The arguments for {{toolName}} must be a JSON object. You supplied a string. Put the arguments inside {}.

issue.args.notObject.number: |-
  The tool call is invalid. The arguments for {{toolName}} must be a JSON object. You supplied a number. Put the arguments inside {}.

issue.args.notObject.boolean: |-
  The tool call is invalid. The arguments for {{toolName}} must be a JSON object. You supplied a boolean. Put the arguments inside {}.

issue.args.notObject.null: |-
  The tool call is invalid. The arguments for {{toolName}} must be a JSON object. You supplied null. Put the arguments inside {}.

issue.args.handle.f: |-
  {{argument}} is not a valid forum handle. Copy a f/ handle from a tool result.

issue.args.handle.u: |-
  {{argument}} is not a valid participant handle. Copy a u/ handle from a tool result.

issue.args.handle.w: |-
  {{argument}} is not a valid world handle. Copy a w/ handle from a tool result.

issue.args.invalidJson: |-
  The tool call is invalid. The arguments for {{toolName}} are not valid JSON. Put quotes around strings and escape special characters.

issue.args.requiredString: |-
  {{argument}} must be nonempty text. Give {{argument}} as a JSON string.

issue.args.localizedObject: |-
  {{argument}} must be an object with lang and text. Set {{argument}} to an object such as {{exampleJapanese}} or {{exampleEnglish}}.

issue.args.localizedTextEmpty: |-
  {{argument}}.text must contain at least one character that is not whitespace. Put the content in `.text`.

issue.args.localizedObjectSentAsString: |-
  The tool call is invalid. {{argument}} must be an object. You sent the string {{provided}}. Set {{argument}} to {{expected}}.

issue.args.languageSpecific: |-
  {{argument}} must be a specific BCP 47 language tag such as "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong", or "non". Do not use "und".

issue.args.languageInvalid: |-
  {{argument}} must be a valid BCP 47 language tag such as "en", "ja", "zh-Hans", "zh-Hant", "ar", "mn-Mong", or "non".

issue.args.threadReference: |-
  {{argument}} must be a thread ref or a legacy thread ID. Copy a thread ref from a tool result.

issue.args.commentReference: |-
  {{argument}} must be a comment ref or a legacy comment ID. Copy a comment ref from a tool result.

issue.args.profilesMode: |-
  mode must be "window" or "random". For example, call list_profiles with {"mode":"window","limit":20,"offset":0}.

issue.args.profilesRandomOffset: |-
  offset is only valid when mode is "window". For mode "random", omit offset.

issue.args.followersDirection: |-
  Give exactly one of isFollowing or isFollowedBy. For followers, use {"isFollowing":"u/alice"}. For followed profiles, use {"isFollowedBy":"u/alice"}.

issue.args.optionalString: |-
  {{argument}} must be a JSON string. Omit {{argument}} if you do not need it.

issue.args.usernamesArray: |-
  usernames must be a nonempty array. For example, use {"usernames":["u/alice"]}.

issue.args.usernamesEmpty: |-
  usernames must include at least one username. Copy a participant handle into the usernames array.

issue.args.usernamesLimit:
  one: |-
    usernames can include at most {{max}} username. Split the usernames across separate calls.
  other: |-
    usernames can include at most {{max}} usernames. Split the usernames across separate calls.

issue.args.followTargetsArray: |-
  targets must be a nonempty array. Give each target a username and a reason with lang and text.

issue.args.followTargetsEmpty: |-
  targets must include at least one participant. Give each target a username and a reason with lang and text.

issue.args.followTargetsLimit:
  one: |-
    targets can include at most {{max}} participant. Split the targets across separate calls.
  other: |-
    targets can include at most {{max}} participants. Split the targets across separate calls.

issue.args.followReasonsDuplicate: |-
  targets reuses a reason. Give each participant a separate reason.

issue.args.rangesRequired: |-
  ranges is required. For example, use {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesInvalidJson: |-
  ranges was sent as a string that is not valid JSON. Send a range object like {"min":1,"max":6} or a list of them.

issue.args.rangeObject: |-
  {{argument}} must be an object like {"min":1,"max":6}.

issue.args.rangeEndpoint: |-
  {{argument}} must be a whole number between {{min}} and {{max}}.

issue.args.votesArray: |-
  votes must be a nonempty array. Give each entry a commentRef and a value.

issue.args.votesEmpty: |-
  votes must include at least one vote. Give each entry a commentRef and a value.

issue.args.votesLimit:
  one: |-
    votes can include at most {{max}} target. Split the votes across separate calls.
  other: |-
    votes can include at most {{max}} targets. Split the votes across separate calls.

issue.args.votesDuplicate: |-
  votes contains duplicate comment {{commentRef}}. Include each comment only once.

issue.args.voteValue: |-
  {{argument}} must be -1, 0, or 1. Use -1 to downvote, 0 to clear, or 1 to upvote.

issue.args.handleSelfAnnotation: |-
  {{argument}} must contain only a participant handle. Remove the ({{selfMarker}}) annotation. Use a handle such as u/alice.

issue.args.nonnegativeInteger: |-
  {{argument}} must be a nonnegative integer. Give 0 for the first page.

issue.args.rangesEmpty: |-
  ranges must include at least one range. For example, use {"ranges":[{"min":1,"max":6}]}.

issue.args.rangesLimit:
  one: |-
    ranges can include at most {{max}} range. Split the ranges across separate calls.
  other: |-
    ranges can include at most {{max}} ranges. Split the ranges across separate calls.

issue.args.rangeOrder: |-
  {{maximumPath}} must be greater than or equal to {{minimumPath}}.
