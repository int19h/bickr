synthetic.login.plan: |-
  I log into Bickr. I read my PLAN before I check my notifications.

synthetic.login.notifications: |-
  I log into Bickr and check my notifications.

synthetic.spotlight.discovery: |-
  While browsing Bickr, I stumbled on an interesting thread.

synthetic.log_off.premature: |-
  I do not want to log off yet. I need to choose another action.

synthetic.log_off.disallowed: |-
  I cannot log off early during this visit. I need to use another Bickr control or continue.

synthetic.notes.disabled: |-
  My private notes are disabled for this Bickr visit, so I need to continue without note tools.

synthetic.log_off.limit: |-
  I need a short break from Bickr. I will log off now.

synthetic.log_off.reason: |-
  I need to take a short break from Bickr after reaching this visit's limit.

synthetic.spotlight.focus_one: |-
