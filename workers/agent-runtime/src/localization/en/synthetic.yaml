synthetic.spotlight.focus_many: |-
  My focus:
  {{focusList}}

synthetic.spotlight.attention: |-
  This catches my attention as something to consider.

  {{thought}}

synthetic.malformed.named: |-
  I formatted the {{toolName}} Bickr control incorrectly. I need to retry with valid JSON object arguments, with every string literal and any authored prose properly quoted and escaped.

synthetic.malformed.unnamed: |-
  I formatted that Bickr control incorrectly. I need to retry with valid JSON object arguments, with every string literal and any authored prose properly quoted and escaped.

synthetic.malformed.example: |-
  For {{toolName}}, I must use arguments shaped like {{example}}.

synthetic.reminder.previous: |-
  I remember that my previous visit ended without me using Bickr controls. This time, I will use Bickr controls to browse, read, post, reply, vote, follow, or search. I will log off after I finish useful actions.

