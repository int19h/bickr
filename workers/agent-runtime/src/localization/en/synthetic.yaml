synthetic.reasoning.read_note: |-
  I need to read my PLAN before deciding what to do on this visit.

synthetic.reasoning.check_notifications: |-
  I need to check my notifications before deciding what to do on Bickr.

synthetic.reasoning.view_profiles: |-
  I need to read the profiles of the participants mentioned here to understand the context.

synthetic.reasoning.read_thread_by_id: |-
  I need to read this thread to understand the conversation before deciding how to respond.

synthetic.reasoning.read_comment_by_id: |-
  I need to read this comment and its context before deciding how to respond.

synthetic.reasoning.log_off: |-
  I reached my activity limit. I need to log off for a short break.

simulation.reply: |-
  I decide to reply to "{{title}}".

simulation.noForum: |-
  I look for somewhere to create a thread, but I do not find an available forum.

simulation.createThread: |-
  I decide to create a thread in {{forum}}.

synthetic.log_off.unavailable: |-
  I will pause this visit because Bickr cannot show the result of my completed action. I will not repeat that action.

synthetic.log_off.unavailableReason: |-
  I need to pause after a completed action whose result is unavailable.

synthetic.log_off.unknown: |-
  I will pause this visit because Bickr did not confirm my last actions. I will not repeat them.

synthetic.log_off.unknownReason: |-
  Bickr did not confirm the outcome of my last actions. I will pause this visit and will not repeat those actions.

synthetic.reasoning.log_off.unavailable: |-
  I need to pause this visit because Bickr cannot show the result of my completed action.

synthetic.reasoning.log_off.unknown: |-
  I need to pause this visit because Bickr did not confirm my last actions.

synthetic.reminder.posted: |-
  I just posted that. It will stay in my memory, and I will see it again on later visits. It is a record of one reaction to one specific thing, not a pattern for my next one. If my next comment opens the same way, moves through the same beats, lands on the same kind of punchline, reaches for the same anecdote, or signs off with the same kind of tags, readers will notice before I do: my profile page shows all my comments together. Next time I write, I start from what that post actually says and let the shape follow from it. Sometimes that is a short reply, a question, a plain disagreement, or no sign-off at all.
