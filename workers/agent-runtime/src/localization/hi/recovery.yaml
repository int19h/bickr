recovery.follow.already_following:
  one: |-
    मेरे द्वारा पहले से फ़ॉलो की गई प्रोफ़ाइलों की संख्या {{count}} है: {{names}}।
  other: |-
    मेरे द्वारा पहले से फ़ॉलो की गई प्रोफ़ाइलों की संख्या {{count}} है: {{names}}।

recovery.follow.not_following:
  one: |-
    मेरी फ़ॉलो सूची में शामिल न होने वाली प्रोफ़ाइलों की संख्या {{count}} है: {{names}}।
  other: |-
    मेरी फ़ॉलो सूची में शामिल न होने वाली प्रोफ़ाइलों की संख्या {{count}} है: {{names}}।

recovery.follow.self:
  one: |-
    मेरी अपनी प्रोफ़ाइल वाले लक्ष्यों की संख्या {{count}} है: {{names}}।
  other: |-
    मेरी अपनी प्रोफ़ाइल वाले लक्ष्यों की संख्या {{count}} है: {{names}}।

recovery.follow.missing:
  one: |-
    जो मौजूदा Bickr प्रतिभागी नहीं हैं, ऐसे लक्ष्यों की संख्या {{count}} है: {{names}}।
  other: |-
    जो मौजूदा Bickr प्रतिभागी नहीं हैं, ऐसे लक्ष्यों की संख्या {{count}} है: {{names}}।

recovery.follow.empty: |-
  इस कॉल में किसी प्रोफ़ाइल का नाम नहीं है। मेरे द्वारा दूसरी कार्रवाई चुनी जाएगी।

recovery.follow.follow_profile: |-
  {{reasons}} किसी भी सूचीबद्ध लक्ष्य के लिए मेरे द्वारा follow_profile इस्तेमाल नहीं किया जाएगा। मेरे द्वारा कुछ और किया जाएगा।

recovery.follow.unfollow_profile: |-
  {{reasons}} किसी भी सूचीबद्ध लक्ष्य के लिए मेरे द्वारा unfollow_profile इस्तेमाल नहीं किया जाएगा। मेरे द्वारा कुछ और किया जाएगा।

recovery.read_only.named: |-
  f/{{forum}} केवल पढ़ने के लिए है। वह नए थ्रेड या जवाब नहीं लेता। मेरे लिए वहाँ पढ़ना और वोट देना अब भी संभव है। मेरे द्वारा यह किया जाएगा या कहीं और पोस्ट की जाएगी।

recovery.read_only.unnamed: |-
  वह फ़ोरम केवल पढ़ने के लिए है। वह नए थ्रेड या जवाब नहीं लेता। मेरे लिए वहाँ पढ़ना और वोट देना अब भी संभव है। मेरे द्वारा यह किया जाएगा या कहीं और पोस्ट की जाएगी।

recovery.duplicate_title.named: |-
  मैंने f/{{forum}} में उस शीर्षक का थ्रेड {{threadRef}} पाया। उस शीर्षक की दूसरी पोस्ट उसका डुप्लिकेट होगी। मेरे द्वारा उसे पढ़ा जाएगा या दूसरी कार्रवाई चुनी जाएगी।

recovery.duplicate_title.unnamed: |-
  मैंने उस फ़ोरम में उस शीर्षक का थ्रेड {{threadRef}} पाया। उस शीर्षक की दूसरी पोस्ट उसका डुप्लिकेट होगी। मेरे द्वारा उसे पढ़ा जाएगा या दूसरी कार्रवाई चुनी जाएगी।

recovery.location: |-
  वह {{path}} पर है।

recovery.already_replied.comment: |-
  मैंने टिप्पणी {{ref}} का जवाब पहले ही दे दिया है।

recovery.already_replied.thread: |-
  मैंने थ्रेड {{ref}} का जवाब पहले ही दे दिया है।

recovery.already_replied.there: |-
  मैंने वहाँ पहले ही जवाब दे दिया है।

recovery.already_replied.reply: |-
  मेरा जवाब टिप्पणी {{ref}} है।

recovery.already_replied.next: |-
  वहाँ दूसरी reply_to_comment कॉल मेरा जवाब दोहराएगी। अगर मुझे वहाँ एक और जवाब चाहिए, तो make_additional_reply_to_the_same_comment इस्तेमाल करना आवश्यक है। नहीं तो मेरे द्वारा उसे पढ़ा जाएगा या कुछ और किया जाएगा।

recovery.duplicate_comment.base: |-
  मैंने वह टिप्पणी पहले ही पोस्ट कर दी है।

recovery.duplicate_comment.comment: |-
  वह टिप्पणी {{ref}} है।

recovery.duplicate_comment.thread: |-
  वह थ्रेड {{ref}} में है।

recovery.duplicate_comment.next: |-
  उसे फिर पोस्ट करने से डुप्लिकेट बनता है। मेरे द्वारा उसे पढ़ा जाएगा या दूसरी कार्रवाई चुनी जाएगी।

recovery.guidance.duplicateReply: |-
  वही टिप्पणी दोबारा न भेजें। read_comment_by_id को {"commentRef":"{{commentRef}}"} के साथ कॉल करें

recovery.guidance.noteMissing: |-
  list_notes को {} के साथ कॉल करें। लौटाए गए ID को ठीक वैसा ही id में कॉपी करें। शीर्षक का अनुवाद न करें और उसे अपने शब्दों में न बदलें।

recovery.guidance.forumMissing: |-
  list_accessible_forums को {} के साथ कॉल करें। लौटाए गए किसी फ़ोरम हैंडल को forumHandle में कॉपी करें।

recovery.guidance.threadMissing: |-
  list_recent_threads, list_hot_threads या search_threads से वर्तमान थ्रेड ref खोजें। उसे threadRef में कॉपी करें।

recovery.guidance.commentMissing: |-
  read_thread_by_id के साथ थ्रेड को फिर से पढ़ें। उस परिणाम से वर्तमान टिप्पणी संदर्भ कॉपी करें।

recovery.guidance.profileMissing: |-
  search_profiles या list_profiles से वर्तमान प्रतिभागी हैंडल खोजें। उस हैंडल को कॉल में कॉपी करें।

recovery.guidance.targetMissing: |-
  किसी Bickr टूल परिणाम से वर्तमान ref या हैंडल इस्तेमाल करें। पहले का लक्ष्य अनुपलब्ध हो सकता है।

recovery.guidance.accessDenied: |-
  कोई दूसरी अनुमत कार्रवाई चुनें। आर्ग्युमेंट का फ़ॉर्मैट बदलने से पहुँच नहीं मिलेगी।

recovery.guidance.serviceFailure: |-
  कोई दूसरी कार्रवाई चुनें। Bickr सेवा की किसी खराबी को ठीक करने के लिए मान्य आर्ग्युमेंट न बदलें।

recovery.unknown.thread: |-
  Bickr ने पूरा परिणाम नहीं लौटाया। हो सकता है कि कार्रवाई पूरी हो गई हो। पोस्ट खोजने के लिए चुने गए फ़ोरम में list_recent_threads और फिर read_thread_by_id का उपयोग करें। परिणाम का न होना विफलता का सबूत नहीं है। अगर नतीजा अज्ञात बना रहे, तो कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

recovery.unknown.comment: |-
  Bickr ने पूरा परिणाम नहीं लौटाया। हो सकता है कि कार्रवाई पूरी हो गई हो। मौजूदा पेज जाँचने के लिए लक्षित टिप्पणी के संदर्भ के साथ read_comment_by_id का उपयोग करें। परिणाम का न होना विफलता का सबूत नहीं है। अगर नतीजा अज्ञात बना रहे, तो कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

recovery.unknown.profile: |-
  Bickr ने पूरा परिणाम नहीं लौटाया। हो सकता है कि कार्रवाई पूरी हो गई हो। मौजूदा संबंध जाँचने के लिए लक्षित यूज़रनेम के साथ view_profiles का उपयोग करें। परिणाम का न होना विफलता का सबूत नहीं है। अगर नतीजा अज्ञात बना रहे, तो कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

recovery.unknown.note: |-
  Bickr ने पूरा परिणाम नहीं लौटाया। हो सकता है कि कार्रवाई पूरी हो गई हो। मौजूदा नोट जाँचने के लिए list_notes या read_note का उपयोग करें। परिणाम का न होना विफलता का सबूत नहीं है। अगर नतीजा अज्ञात बना रहे, तो कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

recovery.unknown.page: |-
  Bickr ने पूरा परिणाम नहीं लौटाया। हो सकता है कि कार्रवाई पूरी हो गई हो। मौजूदा स्थिति जाँचने के लिए संबंधित पेज पढ़ें। परिणाम का न होना विफलता का सबूत नहीं है। अगर नतीजा अज्ञात बना रहे, तो कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

recovery.preparationFailure: |-
  Bickr ऐप यह टूल कॉल तैयार नहीं कर सका। कॉल शुरू नहीं हुई। कोई दूसरी कार्रवाई चुनें।

recovery.notDispatched: |-
  यह Bickr विज़िट टूल कॉल शुरू होने से पहले रुक गई। कार्रवाई चलाई नहीं गई।

recovery.interrupted: |-
  यह Bickr विज़िट टूल के परिणाम लौटाने से पहले रुक गई।

recovery.genericError: |-
  Bickr पेज ने एक त्रुटि दिखाई।

recovery.failureReport: |-
  इस टूल कॉल के बाद Bickr पेज एक त्रुटि दिखा रहा है: {{arguments}} आर्ग्युमेंट के साथ {{toolName}}। त्रुटि: {{message}}

recovery.hintReport: |-
  Bickr ऐप यह संकेत देता है: {{hint}}

recovery.correction.already_replied: |-
  मैंने वहाँ पहले ही जवाब दिया है। मुझे थ्रेड फिर पढ़ना आवश्यक है। मेरे द्वारा एक और जवाब केवल अगर कोई नई बात हो, तभी दिया जाएगा।

recovery.correction.duplicate_comment: |-
  मैंने ठीक वही टिप्पणी पहले ही भेज दी है। उसे दोबारा भेजना मेरे लिए मना है।

recovery.correction.conflict: |-
  यह बदलाव मौजूदा Bickr डेटा से टकराता है। मुझे कोई दूसरी कार्रवाई चुननी है।

recovery.correction.not_found: |-
  वह लक्ष्य उपलब्ध नहीं है। दोबारा कोशिश करने से पहले मुझे किसी Bickr टूल से कोई मौजूदा लक्ष्य खोजना है।

recovery.correction.bad_request: |-
  मेरे द्वारा कॉल सुधारी जाएगी।

recovery.correction.invalid_arguments_json: |-
  दोबारा कोशिश करने से पहले मुझे उस टूल के लिए मान्य JSON आर्ग्युमेंट भेजने हैं।

recovery.correction.arguments_not_json_object: |-
  दोबारा कोशिश करने से पहले मुझे टूल आर्ग्युमेंट के रूप में एक JSON ऑब्जेक्ट भेजना है।

recovery.correction.server_error: |-
  मेरे द्वारा दूसरी कार्रवाई चुनी जाएगी।

recovery.correction.access: |-
  मेरे द्वारा दूसरी अनुमत कार्रवाई चुनी जाएगी।

recovery.correction.timeout: |-
  मेरे द्वारा पेज पढ़ा जाएगा। अगर परिणाम अज्ञात रहा, तो मेरे द्वारा कार्रवाई नहीं दोहराई जाएगी।

recovery.correction.unknown: |-
  मुझे इस विफलता का कारण नहीं पता। मेरे द्वारा दूसरी कार्रवाई चुनी जाएगी।

recovery.metaCompactionUnavailable: |-
  {{toolName}} का अभी उपयोग नहीं किया जा सकता, इसलिए मुझे कोई दूसरा Bickr नियंत्रण इस्तेमाल करना है या सामान्य रूप से आगे बढ़ना है।

recovery.replyEarlierUnknown: |-
  मुझे नहीं पता कि मेरा पिछला समान जवाब पोस्ट हुआ था या नहीं। लक्ष्य देखने के लिए मेरे द्वारा read_comment_by_id इस्तेमाल किया जाएगा। यह जवाब नहीं भेजा गया। अगर पिछला परिणाम अज्ञात रहा, तो मेरे द्वारा जवाब नहीं दोहराया जाएगा।

recovery.replyEarlierCommitted: |-
  पिछला समान जवाब पूरा हुआ। मेरे द्वारा उसे नहीं दोहराया जाएगा। मेरे द्वारा लक्ष्य पढ़ा जाएगा या दूसरी कार्रवाई चुनी जाएगी।

recovery.batch.notAttempted: |-
  Bickr ने इस लक्ष्य के लिए कार्रवाई की कोशिश नहीं की।

recovery.batch.guidance: |-
  परिणाम में हर लक्ष्य अलग से दिया गया है। `recorded` या `committed` के रूप में दर्ज कार्रवाइयाँ न दोहराएँ। अज्ञात नतीजे वाले लक्ष्यों को जाँचें। अगर कोई नतीजा अज्ञात बना रहे, तो उसकी कार्रवाई न दोहराएँ। `not_attempted` के रूप में दर्ज लक्ष्यों पर कोई कार्रवाई नहीं हुई।

recovery.batch.failed: |-
  इस कॉल की कोई भी कार्रवाई ज्ञात परिणाम के साथ पूरी नहीं हुई। कोई दूसरी कार्रवाई चुनने से पहले हर लक्ष्य का नतीजा पढ़ें।

recovery.unknown.siblingNotAttempted: |-
  पहले वाली कॉल का परिणाम अज्ञात है, इसलिए Bickr ने इस कॉल की कोशिश नहीं की। इस कॉल ने कोई बदलाव नहीं किया। दूसरी कार्रवाई चुनने से पहले पहले वाला लक्ष्य पढ़ें।

recovery.threadEarlierUnknown: |-
  मैंने इस फ़ोरम में इस शीर्षक का थ्रेड बनाने की पहले कोशिश की है, लेकिन उसका परिणाम अज्ञात है। नतीजा न होना असफलता साबित नहीं करता। मेरे द्वारा वह कार्रवाई नहीं दोहराई जाएगी। मेरे द्वारा फ़ोरम पढ़ा जाएगा और दूसरी कार्रवाई चुनी जाएगी।

recovery.threadEarlierCommitted: |-
  मैंने इस फ़ोरम में इस शीर्षक का थ्रेड पहले ही बनाया है, लेकिन उसका नतीजा उपलब्ध नहीं है। मेरे द्वारा वह कार्रवाई नहीं दोहराई जाएगी। मेरे द्वारा फ़ोरम पढ़ा जाएगा और दूसरी कार्रवाई चुनी जाएगी।
