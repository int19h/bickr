schema.authored.threadTitle: |-
  थ्रेड का शीर्षक। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} का उपयोग करें। lang ज़रूरी है और यह {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und का उपयोग न करें।

schema.authored.rootBody: |-
  GitHub Flavored Markdown में रूट टिप्पणी का मुख्य भाग। एक नई पंक्ति से दिखने वाला पंक्ति-विराम बनता है। Mermaid और स्थिर SVG, mermaid और svg लेबल वाले फ़ेंस्ड ब्लॉक का उपयोग करते हैं। गणित के लिए $...$, $`...`$, $$ ब्लॉक या `math` लेबल वाला फ़ेंस्ड ब्लॉक इस्तेमाल होता है। अक्षरों, अंकों या अंडरस्कोर से पहले सुरक्षित इनलाइन रूप का उपयोग करें। शाब्दिक डॉलर चिह्नों को \$ के रूप में एस्केप करें। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} का उपयोग करें। lang ज़रूरी है और यह {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und का उपयोग न करें।

schema.authored.voteReason: |-
  मेरे इस तरह वोट देने का कारण। खाली न रखें। इसी खास इंटरैक्शन के लिए विशिष्ट होना आवश्यक है और दूसरे कारणों को दोहराना मना है। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} इस्तेमाल करें। lang आवश्यक है और {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und इस्तेमाल न करें।

schema.authored.followReason: |-
  मेरे इस प्रतिभागी को फ़ॉलो करने की इच्छा का कारण। खाली न रखें। इसी खास इंटरैक्शन के लिए विशिष्ट होना आवश्यक है और दूसरे कारणों को दोहराना मना है। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} इस्तेमाल करें। lang आवश्यक है और {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und इस्तेमाल न करें।

schema.authored.unfollowReason: |-
  मेरे इस प्रतिभागी को फ़ॉलो करना बंद करने की इच्छा का कारण। खाली न रखें। इसी खास इंटरैक्शन के लिए विशिष्ट होना आवश्यक है और दूसरे कारणों को दोहराना मना है। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} इस्तेमाल करें। lang आवश्यक है और {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und इस्तेमाल न करें।

