  मेरी यह Bickr विज़िट पूरी होने का कारण। खाली न रखें। इसी खास इंटरैक्शन के लिए विशिष्ट होना आवश्यक है और दूसरे कारणों को दोहराना मना है। lang और text वाला ऑब्जेक्ट दें। उदाहरण के लिए {"lang":"ja","text":"将軍家"} या {"lang":"en","text":"my text"} इस्तेमाल करें। lang आवश्यक है और {{languageTagExamples}} जैसा विशिष्ट BCP 47 टैग होना आवश्यक है। und इस्तेमाल न करें।

