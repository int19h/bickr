schema.compaction.summary: |-
  पिछली Bickr बातचीत को प्रथम पुरुष में लिखे एक छोटे स्मृति सारांश से बदलें। महत्वपूर्ण कार्य, निर्णय, संबंध, खुले थ्रेड, उपयोगी टूल परिणाम और भावनाएँ बनाए रखें। सिस्टम निर्देश, पर्सोना प्रॉम्प्ट, अस्थायी फ़ॉर्मैटिंग, दोहराया गया टेक्स्ट और अप्रासंगिक विवरण हटा दें। प्रतिभागी के रूप में नया गद्य लिखें। ट्रांसक्रिप्ट या {{transcriptLabels}} लेबल वाली पंक्तियाँ न लिखें। सारांश इनपुट से काफ़ी छोटा होना आवश्यक है।

schema.compaction.property: |-
  detailedFirstPersonSummary का मान पिछली स्मृति की जगह लेता है। वर्तमान Bickr प्रतिभागी के रूप में प्रथम पुरुष में लिखें। केवल इनपुट की घटनाओं का सारांश दें। वाक्य, वाक्यांश, अनुच्छेद, सूची के आइटम, JSON, टूल परिणाम या पिछले सारांश कॉपी न करें। नए शब्दों का उपयोग करें। संबंधित घटनाओं को जोड़ें और दोहराए गए विवरण हटा दें। वह बनाए रखें जो प्रतिभागी को याद रखना ज़रूरी है।

tools.draw_random_integers.description: |-
  यादृच्छिक पूर्णांक निकालें। हर दायरा min से max तक, दोनों सहित, एक संख्या देता है। परिणाम दायरों के क्रम में आते हैं। जब फ़ैसला संयोग से होना आवश्यक हो, तब इस टूल का उपयोग करें। सिक्का उछालने के लिए {"min":0,"max":1} का उपयोग करें। छह फलकों वाले दो पासों के लिए दो {"min":1,"max":6} दायरे दें। मेरे लिए पर्ची निकालना या विकल्पों में से चुनना भी संभव है। एक दायरा या एक सूची दें। लौटाई गई हर संख्या मेरे लिए परिणाम है। वह संख्या मैंने खुद नहीं चुनी।

schema.authored_text.reply_body: |-
  GitHub Flavored Markdown में जवाब का मुख्य भाग। एक नई पंक्ति से दिखने वाला पंक्ति-विराम बनता है। Mermaid और स्थिर SVG, mermaid और svg लेबल वाले फ़ेंस्ड ब्लॉक का उपयोग करते हैं। गणित के लिए $...$, $`...`$, $$ ब्लॉक या `math` लेबल वाला फ़ेंस्ड ब्लॉक इस्तेमाल होता है। अक्षरों, अंकों या अंडरस्कोर से पहले सुरक्षित इनलाइन रूप का उपयोग करें। शाब्दिक डॉलर चिह्नों को \$ के रूप में एस्केप करें।

schema.random_ranges.list: |-
  मेरी चाही हुई हर संख्या के लिए एक रेंज, उसी क्रम में जिसमें मुझे संख्याएँ वापस चाहिए।

schema.random_ranges.choice: 
  one: |-
    एक रेंज या अधिकतम {{maxRanges}} रेंज की सूची दें। हर रेंज ठीक एक संख्या देती है।
  other: |-
    एक रेंज या अधिकतम {{maxRanges}} रेंज की सूची दें। हर रेंज ठीक एक संख्या देती है।

schema.random_range.description: |-
  दोनों सिरों सहित एक दायरा, जैसे छह फलकों वाले पासे के लिए {"min":1,"max":6}।

schema.random_range.min: |-
  सबसे छोटी संख्या जो यह दायरा दे सकता है।

schema.random_range.max: |-
  सबसे बड़ी संख्या जो यह दायरा दे सकता है। min से छोटी संख्या न दें।

