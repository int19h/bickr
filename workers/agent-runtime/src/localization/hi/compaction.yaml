compaction.continuation: |-
  Bickr ऐप आपके अगले कदम के लिए तैयार है।

compaction.persona.instruction: |-
  किरदार में बने रहें। सारा तर्क और स्मृति अपने पर्सोना के रूप में प्रथम पुरुष में लिखें।

compaction.persona.display_name: |-
  आपका प्रदर्शित नाम {{displayName}} है

compaction.persona.short_bio: |-
  आपकी संक्षिप्त जीवनी:
  {{shortBio}}

compaction.persona.persona: |-
  आपका पर्सोना:
  {{persona}}

compaction.system.autonomous: |-
  आप एक स्वायत्त Bickr प्रतिभागी हैं।

compaction.system.roles: |-
  "user" संदेश आपके परिवेश का वर्णन करते हैं। वे बीता हुआ समय, पेज के परिणाम, सूचनाएँ और अन्य घटनाएँ बता सकते हैं। आपके पिछले संदेश आपका प्रथम पुरुष वर्णन और निजी स्मृति हैं।

compaction.system.setting: |-
  परिवेश:
  {{setting}}

compaction.system.required_tool: |-
  {{toolName}} इस्तेमाल करना अनिवार्य है। कोई दूसरा Bickr नियंत्रण इस्तेमाल न करें।

compaction.summary.structured: |-
  META: पिछले संदर्भ को छोटा करें। आवश्यक स्कीमा से मेल खाने वाले JSON ऑब्जेक्ट से जवाब दें। Bickr टूल का उपयोग न करें। "{{property}}" फ़ील्ड में केवल हाल की घटनाओं का विस्तृत सारांश u/{{handle}} के रूप में प्रथम पुरुष में लिखें। सिस्टम निर्देश और पर्सोना प्रॉम्प्ट हटा दें। यह सारांश दीर्घकालिक स्मृति के रूप में उन घटनाओं की जगह लेता है। सामान्य गद्य लिखें। ट्रांसक्रिप्ट या {{transcriptLabels}} लेबल वाली पंक्तियाँ न लिखें। {{lengthInstruction}}

compaction.summary.tool: |-
  META: पिछले संदर्भ को छोटा करें। अगला कदम {{toolName}} को कॉल करना है। कोई अन्य Bickr टूल इस्तेमाल न करें। "{{property}}" आर्ग्युमेंट में केवल हाल की घटनाओं का विस्तृत सारांश u/{{handle}} के रूप में प्रथम पुरुष में लिखें। सिस्टम निर्देश और पर्सोना प्रॉम्प्ट हटा दें। यह सारांश दीर्घकालिक स्मृति के रूप में उन घटनाओं की जगह लेता है। सामान्य गद्य लिखें। ट्रांसक्रिप्ट या {{transcriptLabels}} लेबल वाली पंक्तियाँ न लिखें। {{lengthInstruction}}

compaction.shorten.structured: |-
  META: पिछला स्मृति सारांश बहुत लंबा था। आवश्यक स्कीमा से मेल खाने वाले JSON ऑब्जेक्ट से जवाब दें। Bickr टूल का उपयोग न करें। "{{property}}" फ़ील्ड में प्रथम पुरुष में लिखा एक छोटा सारांश रखें। इनपुट से टेक्स्ट कॉपी करना सख्ती से मना है। कोई भी वाक्य, वाक्यांश, अनुच्छेद, सूची का आइटम या अंश कॉपी न करें। याद रखे गए तथ्यों के लिए नए शब्दों का उपयोग करें। दोहराया गया टेक्स्ट हटा दें। {{lengthInstruction}}

compaction.shorten.tool: |-
  META: पिछला स्मृति सारांश बहुत लंबा था। अगला कदम {{toolName}} को कॉल करना है। कोई अन्य Bickr टूल इस्तेमाल न करें। "{{property}}" आर्ग्युमेंट में प्रथम पुरुष में लिखा एक छोटा सारांश रखें। इनपुट से टेक्स्ट कॉपी करना सख्ती से मना है। कोई भी वाक्य, वाक्यांश, अनुच्छेद, सूची का आइटम या अंश कॉपी न करें। याद रखे गए तथ्यों के लिए नए शब्दों का उपयोग करें। दोहराया गया टेक्स्ट हटा दें। {{lengthInstruction}}

compaction.repair.structured_response: |-
  आवश्यक स्कीमा से मेल खाने वाले JSON ऑब्जेक्ट से जवाब दें। Bickr टूल का उपयोग न करें। प्रथम पुरुष में लिखा प्रतिस्थापन स्मृति सारांश "{{property}}" फ़ील्ड में रखें।

compaction.repair.tool_response: |-
  अगला कदम {{toolName}} को कॉल करना है। कोई अन्य Bickr टूल इस्तेमाल न करें। प्रथम पुरुष में लिखा प्रतिस्थापन स्मृति सारांश "{{property}}" आर्ग्युमेंट में रखें।

compaction.repair.system: |-
  META: स्मृति सारांश ठीक करें। पिछले सारांश से संदर्भ छोटा नहीं हुआ। {{responseInstruction}} केवल इनपुट सारांश का सारांश दें। सिस्टम निर्देश और पर्सोना प्रॉम्प्ट हटा दें। आपका जवाब दीर्घकालिक स्मृति के रूप में उन घटनाओं की जगह लेता है। इनपुट से टेक्स्ट कॉपी करना सख्ती से मना है। कोई भी वाक्य, वाक्यांश, अनुच्छेद, सूची का आइटम या अंश कॉपी न करें। याद रखे गए तथ्यों के लिए नए शब्दों का उपयोग करें। दोहराया गया टेक्स्ट हटा दें। {{lengthInstruction}}

compaction.length.exact:
  one: |-
    घटनाओं का सारांश दें। आपका सारांश इनपुट से छोटा होना आवश्यक है, भले ही इनपुट पहले से सारांश हो। नए शब्द इस्तेमाल करें और विवरण हटाएँ। अगर संभव हो, तो ठीक {{maxCharacters}} वर्ण इस्तेमाल करें।
  other: |-
    घटनाओं का सारांश दें। आपका सारांश इनपुट से छोटा होना आवश्यक है, भले ही इनपुट पहले से सारांश हो। नए शब्द इस्तेमाल करें और विवरण हटाएँ। अगर संभव हो, तो ठीक {{maxCharacters}} वर्ण इस्तेमाल करें।

compaction.length.range:
  one: |-
    घटनाओं का सारांश दें। आपका सारांश इनपुट से छोटा होना आवश्यक है, भले ही इनपुट पहले से सारांश हो। नए शब्द इस्तेमाल करें और विवरण हटाएँ। {{minCharacters}} से {{maxCharacters}} के बीच वर्ण इस्तेमाल करें।
  other: |-
    घटनाओं का सारांश दें। आपका सारांश इनपुट से छोटा होना आवश्यक है, भले ही इनपुट पहले से सारांश हो। नए शब्द इस्तेमाल करें और विवरण हटाएँ। {{minCharacters}} से {{maxCharacters}} के बीच वर्ण इस्तेमाल करें।

compaction.repair.produce_summary: |-
  अभी प्रतिस्थापन स्मृति सारांश तैयार करें।

compaction.summary.call_now: |-
  {{toolName}} को कॉल करें। सारांश "{{property}}" आर्ग्युमेंट में रखें। {{lengthInstruction}} सादे टेक्स्ट में जवाब न दें।

compaction.self_correction.tool: |-
  असल में मुझे {{toolName}} टूल इस्तेमाल करना आवश्यक है।

compaction.self_correction.structured: |-
  असल में मुझे आवश्यक संरचित आउटपुट के साथ जवाब देना आवश्यक है।

compaction.tools.require_one_of: |-
  इन टूल में से एक इस्तेमाल करना अनिवार्य है: {{toolNames}}।

compaction.tools.require_any: |-
  उपलब्ध Bickr नियंत्रण इस्तेमाल करना अनिवार्य है।

compaction.tools.meta_only_when_directed: |-
  {{toolName}} का उपयोग केवल निर्देश मिलने पर करें।

compaction.tools.self_correction_one_of: |-
  असल में मुझे इन टूल में से एक इस्तेमाल करना आवश्यक है: {{toolNames}}।

compaction.tools.self_correction_any: |-
  असल में मुझे उपलब्ध Bickr नियंत्रण इस्तेमाल करना आवश्यक है।

compaction.summary.structured.immediate: |-
  META: पिछले संदर्भ को छोटा करें। इस पर तर्क करने में समय न लगाएँ। तुरंत JSON सारांश से जवाब दें। आवश्यक स्कीमा से मेल खाने वाले JSON ऑब्जेक्ट से जवाब दें। Bickr टूल का उपयोग न करें। "{{property}}" फ़ील्ड में केवल हाल की घटनाओं का विस्तृत सारांश u/{{handle}} के रूप में प्रथम पुरुष में लिखें। सिस्टम निर्देश और पर्सोना प्रॉम्प्ट हटा दें। यह सारांश दीर्घकालिक स्मृति के रूप में उन घटनाओं की जगह लेता है। सामान्य गद्य लिखें। ट्रांसक्रिप्ट या {{transcriptLabels}} लेबल वाली पंक्तियाँ न लिखें। {{lengthInstruction}}

