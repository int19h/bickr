  इस पर तर्क करने में समय न लगाएँ। तुरंत JSON सारांश से जवाब दें। आवश्यक स्कीमा से मेल खाने वाले JSON ऑब्जेक्ट से जवाब दें। Bickr टूल का उपयोग न करें। प्रथम पुरुष में लिखा प्रतिस्थापन स्मृति सारांश "{{property}}" फ़ील्ड में रखें।

