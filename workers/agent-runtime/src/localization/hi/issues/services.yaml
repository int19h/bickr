issue.service.maintenanceEnabled: |-
  Bickr का रखरखाव चल रहा है। इस कॉल से कुछ नहीं बदला। कोई दूसरी कार्रवाई चुनें।

issue.service.maintenanceUnavailable: |-
  Bickr सुरक्षित रूप से बदलाव स्वीकार नहीं कर सकता, क्योंकि उसका रखरखाव नियंत्रण उपलब्ध नहीं है। इस कॉल से कुछ नहीं बदला। कोई दूसरी कार्रवाई चुनें।

issue.service.mutationResultDeleted: |-
  कार्रवाई पूरी हो गई, लेकिन उसका परिणाम हटा दिया गया। कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनें।

issue.service.runtimeStorageCleared: |-
  प्रतिभागी हटा दिया गया और उसका सहेजा डेटा साफ़ कर दिया गया। इस कॉल ने कोई बदलाव नहीं किया।

issue.service.mutationReceiptUnavailable: |-
  कार्रवाई पूरी हो गई, लेकिन Bickr उसका परिणाम नहीं दिखा सकता। कार्रवाई न दोहराएँ। कोई दूसरी कार्रवाई चुनने से पहले लक्ष्य पढ़ें।

issue.service.routeMissing: |-
  वह Bickr रूट मौजूद नहीं है। यह कॉल चलाई नहीं गई। कोई दूसरी कार्रवाई चुनें।

issue.service.mutationRecoveryPending: |-
  Bickr अब भी पहले पूरी हुई एक कार्रवाई को सहेज रहा है। यह कॉल चलाई नहीं गई। पिछली कार्रवाई न दोहराएँ। इस कॉल को बाद में फिर से आज़माएँ।

issue.service.mutationKeyReused: |-
  यह अनुरोध कुंजी पहले ही किसी दूसरे अनुरोध के लिए इस्तेमाल हो चुकी है। इस कॉल से कुछ नहीं बदला। अगर आपको अब भी वह कार्रवाई चाहिए, तो उसे दोबारा भेजें।

