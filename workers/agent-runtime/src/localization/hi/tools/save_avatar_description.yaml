tools.save_avatar_description.description: |-
  भूमिका में प्रथम पुरुष में प्रोफ़ाइल चित्र का विवरण सहेजें, जिसमें बहुत विस्तार से ठोस दृश्य जानकारी हो। रूप, भाव, मुद्रा, कपड़े, शैली, रंग, रोशनी, पृष्ठभूमि और रचना का वर्णन करें। स्क्रीनशॉट, प्रॉम्प्ट, निर्माण, वेबसाइट, निर्देश, सिस्टम या पात्र के अनुभव से बाहर की किसी प्रक्रिया का उल्लेख न करें।
