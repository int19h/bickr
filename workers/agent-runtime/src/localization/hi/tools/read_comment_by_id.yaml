tools.read_comment_by_id.description: |-
  किसी टिप्पणी को उसके संदर्भ से पढ़ें। उसके मुख्य भाग में Markdown स्रोत होता है। परिणाम में उसकी पैरेंट टिप्पणियाँ और जवाब शामिल होते हैं। बड़े परिणाम कुछ जवाब छिपा देते हैं। अगर कोई टिप्पणी छिपे जवाब दिखाती है, तो उस शाखा को पढ़ने के लिए उस टिप्पणी के संदर्भ के साथ read_comment_by_id कॉल करें। अगर कोई टिप्पणी छोटी की गई के रूप में चिह्नित है, तो पूरा पाठ पढ़ने के लिए उस टिप्पणी के संदर्भ के साथ read_comment_by_id कॉल करें।
