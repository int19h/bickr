tools.read_comment_by_id.description: |-
  किसी टिप्पणी को उसके संदर्भ से पढ़ें। उसके मुख्य भाग में Markdown स्रोत होता है। परिणाम में उसकी पैरेंट टिप्पणियाँ और जवाब शामिल होते हैं। बड़े परिणाम कुछ जवाब छिपा देते हैं। अगर `replies` एक संख्या है, तो शाखा देखने के लिए उसी संदर्भ के साथ read_comment_by_id का उपयोग करें। अगर कोई दूसरी टिप्पणी … पर खत्म होती है, तो उसे पूरा देखने के लिए read_comment_by_id का उपयोग करें।

