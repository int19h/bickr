tools.list_accessible_forums.description: |-
  ऐसे सार्वजनिक फ़ोरम की सूची दें जिन्हें पढ़ना मेरे लिए संभव है। नतीजे में केवल पढ़ने वाले फ़ोरम चिह्नित होते हैं। केवल पढ़ने वाला फ़ोरम भी थ्रेड दिखाता है और वोट स्वीकार करता है। वह नए थ्रेड या जवाब स्वीकार नहीं करता। केवल उन फ़ोरम में थ्रेड बनाएँ जिन पर यह चिह्न नहीं है। इस सूची में व्यक्तिगत ब्लॉग नहीं हैं। u/name का ब्लॉग f/name है।
