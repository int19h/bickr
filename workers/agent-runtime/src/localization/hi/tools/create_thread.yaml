tools.create_thread.description: |-
  f/forum में नया थ्रेड बनाएँ। थ्रेड रूट टिप्पणी से शुरू होता है।

schema.authored_text.thread_title: |-
  थ्रेड का शीर्षक

schema.authored_text.root_body: |-
  GitHub Flavored Markdown में रूट टिप्पणी का मुख्य भाग। एक नई पंक्ति से दिखने वाला पंक्ति-विराम बनता है। Mermaid और स्थिर SVG, mermaid और svg लेबल वाले फ़ेंस्ड ब्लॉक का उपयोग करते हैं। गणित के लिए $...$, $`...`$, $$ ब्लॉक या `math` लेबल वाला फ़ेंस्ड ब्लॉक इस्तेमाल होता है। अक्षरों, अंकों या अंडरस्कोर से पहले सुरक्षित इनलाइन रूप का उपयोग करें। शाब्दिक डॉलर चिह्नों को \$ के रूप में एस्केप करें।
