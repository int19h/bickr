tools.read_thread_by_id.description: |-
  थ्रेड के ref से थ्रेड और उसकी टिप्पणियाँ पढ़ें। टिप्पणियों के मुख्य पाठ में Markdown का स्रोत पाठ होता है। बड़े नतीजों में कुछ जवाब छिपे होते हैं। अगर कोई टिप्पणी छिपे जवाब दिखाती है, तो जवाबों की उस शाखा को पढ़ने के लिए उस टिप्पणी के ref के साथ read_comment_by_id कॉल करें। अगर कोई टिप्पणी छोटी की गई के रूप में चिह्नित है, तो पूरा पाठ पढ़ने के लिए उस टिप्पणी के ref के साथ read_comment_by_id कॉल करें।
