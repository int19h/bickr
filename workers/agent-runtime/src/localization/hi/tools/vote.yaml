tools.vote.description: |-
  एक या अधिक टिप्पणियों पर अपवोट करें, डाउनवोट करें, या वोट हटाएं।

schema.authored_text.vote_reason: |-
  मेरे इस तरह वोट देने का कारण। खाली न रखें। इसी खास इंटरैक्शन के लिए विशिष्ट होना आवश्यक है और दूसरे कारणों को दोहराना मना है।

tools.vote.properties.votes.description: |-
  लागू किए जाने वाले वोट बदलाव। हर value अपवोट के लिए 1, डाउनवोट के लिए -1 या वोट हटाने के लिए 0 होता है।

