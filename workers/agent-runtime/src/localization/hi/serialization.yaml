read.guidance.collapsed: |-
  `replies` का संख्यात्मक मान बताता है कि उतने सीधे उत्तर छोड़ दिए गए हैं; उस शाखा को देखने के लिए उस टिप्पणी के ref के साथ read_comment_by_id कॉल करें।

read.guidance.trimmed: |-
  {{ellipsis}} पर समाप्त होने वाला मुख्य पाठ छोटा किया गया है; पूरी टिप्पणी पढ़ने के लिए उस टिप्पणी के ref के साथ read_comment_by_id कॉल करें।

