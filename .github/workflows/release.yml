name: Release

# Shared release job. The deploy-test and deploy-production workflows call it.
# It runs the same scripts as a local release: check:release, then release.mjs.
on:
  workflow_call:
    inputs:
      environment:
        description: Release target, test or production
        required: true
        type: string
      apply-migrations:
        description: Apply pending D1 migrations before the code update
        required: true
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The GitHub environment holds CLOUDFLARE_API_TOKEN and any protection rules.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://bickr.social' || 'https://test.bickr.social' }}
    # Cloudflare does not make a release of several services atomic, so two
    # releases to one environment must not overlap. Never cancel a running
    # release, because a partial upload leaves Cloudflare in a mixed state.
    concurrency:
      group: release-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      RELEASE_ENVIRONMENT: ${{ inputs.environment }}
      RELEASE_COMMIT: ${{ github.sha }}
      APPLY_MIGRATIONS: ${{ inputs.apply-migrations }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Require main for production
        if: inputs.environment == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production releases deploy main only. This run selected $GITHUB_REF."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      # The release script accepts only a check record for this exact commit and
      # build. A fresh check in this job produces both from the same checkout.
      - name: Test and build the exact commit
        run: npm run check:release -- --commit "$RELEASE_COMMIT"
      - name: Deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          args=(--environment "$RELEASE_ENVIRONMENT" --commit "$RELEASE_COMMIT")
          if [ "$APPLY_MIGRATIONS" = "true" ]; then args+=(--apply-migrations); fi
          node scripts/release.mjs "${args[@]}"
      - name: Record released source
        run: echo "Released and verified $RELEASE_COMMIT on $RELEASE_ENVIRONMENT" >> "$GITHUB_STEP_SUMMARY"
      # Keep the release record and Wrangler operation file for failed runs too.
      # They show which steps changed Cloudflare before the failure.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-${{ inputs.environment }}-${{ github.sha }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          path: .wrangler/release/
