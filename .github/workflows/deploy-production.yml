name: Deploy to production

# Manual only. The run deploys the head commit of main and rejects other branches.
on:
  workflow_dispatch:
    inputs:
      apply-migrations:
        description: Apply pending D1 migrations (review them first)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  release:
    uses: ./.github/workflows/release.yml
    with:
      environment: production
      apply-migrations: ${{ inputs.apply-migrations }}
    secrets: inherit
