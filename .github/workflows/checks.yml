name: Candidate checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHECKED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CHECKED_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Test and build the exact commit
        run: npm run check:release -- --commit "$CHECKED_COMMIT"
      - name: Record checked source
        run: echo "Tests and build passed for $CHECKED_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ env.CHECKED_COMMIT }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .wrangler/release/checks.json
            apps/web/dist/client
